             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3><strong>About the Author</strong></h3>
              <p>Joshua Birdsong (he/him) is designer for the Rules and Lore team at Paizo. He was the lead designer for the upcoming <em>Pathfinder Impossible Magic</em> book. He started his journey with Pathfinder writing homebrew on the internet and is excited and humbled to work with so many wonderful and amazing authors, editors, and all the other incredible people who help make these books and blogs possible! Don’t forget to be awesome!</p>
