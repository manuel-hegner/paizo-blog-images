           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>What’s that? In chapter 6 of <em>Starfinder Tech Core</em>? It’s a Star Dragon! It’s a Canopyskipper! No, wait: It’s <em>Tactical Starship Combat</em>!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6c08b72b-1458-4b5e-ae52-41913bec678a/PZO22006_Hellknights_vs_Xenowardens_Starships.jpg" alt="Hellknights Versus Xenowardens Starships by Gunship Revolution. A pod of large whale-like alien creatures called oma, are using their sonar to freeze a hellknight starship, allowing their Xenowarden allies in a large whale shaped starship to finish  it off with a powerful blast of primal magic." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>A pod of oma are using their sonar to freeze a hellknight starship, allowing their Xenowarden allies to finish&nbsp; it off with a powerful blast of primal magic. By Gunship Revolution.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Tactical starship combat combines the round-by-round threats and action of a typical combat encounter with strategic nature of a starship-scale space battle. Characters move on a battle map of their own starship, using their three actions per turn to helm a station, repair damaged portions of the ship, bolster their allies, or defeat enemies and hazards that appear aboard their ship during the encounter. Meanwhile the distance between your starship and enemy vessels is tracked using a sensor map, giving your ship’s pilot the opportunity to tactically Boost Thrusters, Change Heading, and Juke enemies to make them more vulnerable to your ship’s Gunners, Drone Pilots, and Spellcasters.</p>
              <p>Gunners are able to fire starship-scale weapons using their own proficiencies and feats the same way they would their trusty laser pistol. This means soldiers can hit multiple enemies at once using Area Fire actions, while Operatives can do extra damage to a single starship by using the Aim action. Drones give characters a chance to play more tactically, planting mines or blocking incoming attacks. Meanwhile spellcasters can use a retinue of powerful starship spells by channeling their magic through the ship’s magic conduit. And using other battle stations and upgrades you can further customize your starship to suit every member of your party.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/840af518-f0a7-4a5e-899b-907b556997c2/PZO22006_PirateShip_Conversions.jpg" alt="Pirate Ship Conversions By Gunship Revolution. A captured hellknight starship sits in a dry-dock, being retrofitted and upgraded by pirates, including adding their logo to the side of the main cannon" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Space pirates retrofit and upgrade a captured Hellknight starship in dry-dock. By Gunship Revolution.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image right" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/c7f30d3a-0004-4e2b-af57-c62fde44ddb0/NovaRush_StarshipSheet.jpg?w=500" alt="A filled out starship sheet with details about about the ship's name, armor class, stats, and customizations." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Choosing your starship’s battle stations is only the beginning. Each battle station has upgrade slots that allows you to grant bespoke abilities to the character helming those battle stations, including class specific upgrades that allow for alternative uses for each class’s most important features. Whether it’s deploying your turret as a starship weapon, installing your own mines into a drone, or turning the prow of your ship into a solar weapon capable of ripping apart enemy vessels when you ram them! There are additional customization options for your starship, including expansion bays like a medbay or holoden, upgraded escape pods, and guidelines for how to introduce, upgrade, and use starships in your campaign!</p>
              <p>There’s so much more to tactical starship combat that we thought the best way to show you was with a copy of our ship’s Starship Sheet!</p>
              <p><strong>Dustin Knight (he/him)<br></strong><em><strong>Lead Designer</strong></em></p>
              <h3><a href="https://paizo.com/threads/rzs8qbsw?NEW-BLOG-Starfinder-Tech-Core-Something-New">Excited for starship combat? Join the conversation on the Paizo Forums!</a></h3>
             </div>
