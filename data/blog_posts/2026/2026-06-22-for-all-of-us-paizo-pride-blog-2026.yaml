           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Happy Pride, ‘Finders!</p>
              <p>June is upon us once again, and Paizo is proud to celebrate the LGBTQ+ members of our community by inviting them to share their stories, projects, and inspiration here on the blog!</p>
              <p>The theme for this year’s Pride is “For All Of Us”—a snippet of Marsha P. Johnson’s full quote: “There is no pride for some of us without liberation for all of us.”<strong> </strong>As a community, we are stronger, safer, and happier together than we’ll ever be if we let the world try to divide us.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/f686a7b3-b4d8-4428-aae5-2aced0bba34a/LESHYGNOME_AKATAFIGHT.jpg?w=500" alt="A leshy and a gnome, both dressed in space suites, attached to each other via a plant-like tether, defend each other while they are surrounded by large, blue lion-like aliens called akatas." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Alex Augunas (he/him) &amp; Dustin Knight (he/him)</h2>
              <p>D: Pride is a protest against shame, and shame’s greatest weakness is love. Love is the purest expression of our ability to share joy, and as such, Alex and I have decided to express our love together rather than doing separate blog submissions.</p>
              <p>A: The flourishing of our story is kind of a story about Paizo. We met in person for the first time at PaizoCon 2019. Dustin aspired to work for Paizo, but he needed publishing experience. I had plenty of experience as a Paizo freelancer and was putting out Third-Party work via my publishing imprint, Everybody Games. What began as a figurative “match made in Heaven” became a literal one.</p>
              <p>D: Until I met Alex, being who I was never felt right. Specifically, the post he wrote for pride right here on Paizo.com planted something deep inside my heart, and as our friendship grew, that seed sprouted, blooming only when I was ready to accept that he was my joy and, even harder to admit, that I was capable of being his. The shame made me feel unworthy of love, and it took Pride to make me realize the shame was always rooted in a lie. It took love to realize I was worthy of pride—and I’m proud to be with him.</p>
              <p>A: Until I met Dustin, I had always felt like a piece of myself was missing. In my first Paizo Pride blog, I came out as being ace/hetero, but there was part of me that suspected I was gay for years. That part felt ashamed, even depressed. I thought being gay would make my life more difficult, and my asexuality made me feel like I never needed to explore that further. Demisexual people need a strong, emotional bond to be attracted to someone, and when I fell in love with Dustin, it was like wandering out into the sunshine after living 30 years of life in a cave.</p>
              <p>D: And once you feel that sunshine, you feel like it’s okay to be proud. Not just of yourself, but of your accomplishments. Thank you for reading about our experiences. I’m Dustin Knight, Starfinder Designer (<a href="https://bsky.app/profile/kitsunewarlock.bsky.social">Bluesky</a>), and you can find my work in everything Starfinder, including <a href="https://store.paizo.com/starfinder-tech-core/"><em>Starfinder Tech Core</em></a> this Fall!</p>
              <p>A: You can pick up <a href="https://www.pathfinderinfinite.com/en/product/465460/kitsune-of-golarion-remastered?filters=0_100122_100122_0_100159_0_0">Kitsune of Golarion: Remastered</a> from me via Pathfinder Infinite, and follow me, Alexander Augunas, on <a href="https://bsky.app/profile/alexaug.bsky.social">Bluesky</a>. I also have some “junk(omancy)” for you to check out in my love’s next big release, <em>Starfinder Tech Core</em>.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>James Beck (any/all)</h3>
              <p>Hello, everyone! My name is James Beck, and I'm a freelancer for Paizo. You can catch my work in <em>Pathfinder Lost Omens Firebrands</em>, <em>Starfinder Absalom Station</em>, <em>Starfinder Tech Core</em>, and <em>Pathfinder Legacy of the Forge</em>! I'm here to give my well wishes for everyone to have a great pride month. As a freelancer, I try my best to represent the&nbsp;world around&nbsp;me, adding NPCs of various genders and sexual orientations&nbsp;where&nbsp;I can. I hope you'll come to love these characters as much as I do. Unfortunately, not everyone can be open about their identity, and it's important to remember that pride represents us all. To my fellow brothers, sisters, and siblings, your light shall shine brighter than ever before. Happy pride, everyone!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/5f9fb9d0-6ba8-4cde-a16b-6addd82eb105/QuinnattheCafe_2700x1800.png" alt="Art by Kiki Moch Rizky : Iconic investigator, Quinn, works on a case while his favorite barista delivers him coffee to his table" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>Maya Coleman (xe/xem/they/them)</h3>
              <p>An avid musician and graduate from Oberlin College &amp; Conservatory with a degree in Film Music Composition, Maya has used their skills in organization in combination with a weaponization of their OCD and OCPD (literally the case) to flourish in the tabletop industry for ten years. Starting as the sole employee at Goat, Wolf, &amp; Cabbage LLC and managing the community for the board game Secret Hitler since its inception, they’ve gone on to manage communities at Skybound Tabletop, run projects on Kickstarter such as <em>Trogdor!! The Board Game!</em> and <em>Trial by Trolley</em>, and are now the Community and Social Media specialist here at Paizo.</p>
              <p>When they are not working in the industry, Maya is an avid crafter and gamer. Their plushie collection is vast, from sweaters for their loyal service dog, Avalon (which she hates and refuses to wear), to Yvali from Pathfinder, skittermanders from Starfinder, and a Toro sweater that at least MAYA wears even if AVALON refuses to wear HERS! They’re also a huge fan of Pokémon and, despite never having finished a single game, they’ve played each one released (their favorite Pokémon is Gardevoir, by the way)! Maya is also your go-to resource for obscure film and soundtracks; they are happy to geek out about either one at any given time! Shout out to Cristobal Tapia de Veer, the world’s most underrated film and television composer.</p>
              <p><strong>You can find Maya at the following links:</strong></p>
              <ul>
               <li>Etsy: <a href="https://www.etsy.com/shop/MayagurumiCo" data-new-window="true" target="_blank" rel="noopener noreferrer">https://www.etsy.com/shop/MayagurumiCo</a> <br>
                 (My pattern for a crocheted d20 with the Paizo logo on the 20 is here!!)</li>
               <li>Nintendo Friend Code: SW-6873-1301-1137.&nbsp;</li>
              </ul>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/96ab7bfb-241a-4728-8546-8146106420e2/MayaColeman_Pride26_1.jpg?w=400" alt="Avalon, a yellow labrador wearing headphones with accessories resembling the pokemon Gengar" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/c8c3e158-b508-4caf-9e13-7de501d78762/MayaColeman_Pride26_2.jpg?w=400" alt="A crocheted doll of a dark skinned fairy with grey hair and a dress made of multi-colored flower petals" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>Hiromi Cota (she/they)</h3>
              <p>As I type this, copies of <em>The Fifth Season Roleplaying Game</em> are arriving in backers’ hands. It is a profoundly queer and BIPOC book. Everyone brought their A game and created something queer, Black, and magical. It was a labor of love—love for the source material and love for our communities. Every book I make is special, but this one… this one hits me hard.</p>
              <p>Just like the novels normalized trans people in the setting, we normalized trans people in the game. The stunning art features a wide range of complexions, skin tones, and hair. Oh, the hair! As an Indigenous Okinawan &amp; Yaeyaman, I used my peoples to inspire the look of the island people in the game. Hell, my face is in the book!</p>
              <p>But I didn’t do it alone. This was the work of a team where damn near everyone was LGBTQIA2S+, BIPOC, or both, and it shows.</p>
              <p>Gushing about another company’s book here in the Paizo blog is a bit gauche, but I’m not talking about the book—not really. I’m talking about the power of words, ideas, and community; the power that we have. Let’s make something magical.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/266475f0-687a-42ef-a8c4-db76fec2d2f0/PZO13012_Cata_FlameWalker.png?w=400" alt="Cata Flame Walker, she/her, , Art by Luca Sotgiu. A tan skinned woman dressed in beaded leather clothing and jewelry stands confidently with a knife in her hand." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>Rue Dickey</h3>
              <p>Growing up as a queer, trans, and disabled person of color left me feeling ‘out of place’ in most spaces. One thing or another would be ‘too much’ for someone to handle or fodder to fuel bullying, harassment, and cruelty. I am extremely grateful to have found a home in the gaming space, surrounded by friends and colleagues who see me as myself and who love and respect me for who I am, not despite it.</p>
              <p>The collaborative storytelling in RPGs is what drew me to games in the first place, and I am happy to see so many other queer people flourish in this space. Our stories have been stifled for so long: censored out of existence, rewritten by homophobic and transphobic translations and historians, and removed from their proper contexts. But at a gaming table, the stories are ours to craft and share, and that freedom has made me a better person, a stronger writer, and a more powerful force for change.</p>
              <p>No one will tell your story for you. Take the pen from their hands and make this story yours.</p>
              <h3><br>
                Lynne M. Meyer (she/they)</h3>
              <p>When I create, I do so from the perspective of multiple marginalized identities: I’m a genderfluid femme, I’m bisexual and polyamorous, and I’m a chronically ill person living with an invisible disability. Yet I’m keenly aware that I’m someone with immense privilege. I have a degree of (relative) safety in public that many of my queer kin do not. I try to signal my queerness openly, so others don’t have to. It’s a way of proclaiming, “We’re not going anywhere!” Of letting folks know they’re not alone.</p>
              <p>Some days, the work is loud—Pride did start as a riot. But most days, the work is quiet, taking place behind the scenes: offering a listening ear, being a bathroom buddy, or supporting mutual aid.</p>
              <p>This month, I’m part of The Power of Pride—a bundle of nearly 400 games, zines, and other creations from 284 queer creators across itch.io available as a <a href="https://itch.io/b/3682/the-power-of-pride-bundle-2026-60-edition">$60 edition</a> and as a <a href="https://itch.io/b/3684/the-power-of-pride-bundle-2026-10-pwyc-edition">$10 PWYC edition.</a> The bundle is a direct action that folks can take right now to support queer creators in a life-changing way. Both editions include “Elsewhere,” my flash fic about current events and not looking away.</p>
              <p>No Pride for some of us without liberation for all of us.</p>
              <p>Come say hi on Bluesky (@lynnemeyer.bsky.social)!</p>
              <p><br></p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/55eac0c4-4774-4665-8341-409962d166c7/Pride_2025IconicsLineup.png" alt="Pathfinder and Starfinder iconics including Mios, Iseph, Kyra, Navsi, Quin, and Dae overlayed over the inclusive progress pride flag." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Queer people have always been here. Queer people will always be here. Paizo is proud to be a safe space for queer gamers—whether you’re a GM, a player, a designer, an artist, or fan, you have a seat at our table.</p>
             </div>
            </div>
