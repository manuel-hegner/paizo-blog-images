           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Welcome, Pathfinders!</p>
              <p>We are here to announce the new show for the Find the Path Podcast! For those who don’t know us, Find the Path is an actual-play podcast network created by a group of longtime friends with a shared love of Pathfinder and great stories. Each week, we release new episodes full of exciting adventures and unforgettable heroes.</p>
              <p>Find the Path became a Paizo partner alongside the launch of our Patreon (hyperlink: https://www.patreon.com/FindthePath) and our second show. That show—our actual-play of the Tyrant's Grasp Adventure Path—just ended after a seven-year run with a spellbinding finale. Now, we're back and ready to begin our next grand adventure!</p>
              <p>We chose to play Tyrant’s Grasp because of its excellent narrative, horror themes, exhilarating encounters, and larger-than-life villains. When it came time to choose our next story, we wanted something that captured many of those same qualities, while also giving us an opportunity to explore new ground. One Adventure Path immediately stood out to us: Abomination Vaults!</p>
              <h2><br></h2>
              <h2>Otari needs Heroes!</h2>
              <p>While Abomination Vaults is a modern adventure there is something about it that feels wonderfully old school. At its heart is a classic fantasy premise: when an old evil awakens it is up to a small band of adventurers to protect their town from devastation. To do this our heroes must gather their courage and journey deep into a sprawling dungeon, to face horrors unimaginable and destroy the growing evil at its source!</p>
              <p>Classic ‘dungeon delves’ are something we enjoyed in Tyrant’s Grasp, and in our previous actual play of Mummy’s Mask, but Abomination Vaults gives us the chance to make it the centerpiece of an entire campaign! Abomination Vaults has a well-earned reputation for being challenging and that should give us plenty of opportunities for the tactical combat we enjoy while putting our players—and their characters—to the test.</p>
              <p>So, if you enjoy tales of heroes descending into the unknown, where every room might contain new horrors, every hallway might be an ambush, and every treasure might be a trap, then you will love our new show!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/3b29de73-b650-46e3-a27a-a5c6f8e4f663/FindThePath_AV_Tarot.jpg?w=700" alt="A spread of tarot  style cards on a wooden table. The top card is a lighthouse with the label &quot;Devil's Lantern&quot; The second row has three cards, on the far left us a white haired human dressed in fine blue garments labeled &quot;The Unicorn&quot; the center card is a finely dressed human posing dramatically with their hand over their face labeled &quot;The Keep&quot; the third card in the row is a finely dressed labeled &quot;The Eclipse. In the third row is a single card with a ghostly woman labeled &quot;The Lost&quot;" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Join us in the Vaults!</h2>
              <p>So please join our phenomenal cast of players: Heather Allen, Jessica Jenkins, and Rachel Sandidge as they explore the town of Otari and battle against the monsters that threaten to destroy it!</p>
              <p>The first three episodes of our new show will be available <strong>October 5th</strong> on our website and across both of our public podcast feeds! You’ll find them on the <strong>Find the Path Podcast</strong> feed, home to our Mummy’s Mask and War for the Crown actual-plays, as well as the <strong>Find the Path Presents</strong> feed alongside our Hell’s Rebels Second Edition conversion. Both feeds are available wherever you listen to podcasts!</p>
              <p>But if you can’t wait that long to meet our new heroes and start exploring Otari, you don’t have to! <strong>The first two episodes are available to listen to for free on our Patreon right now!</strong></p>
              <p>After October 5th, new episodes will be released <strong>every Monday</strong> for all <strong>Witness Tier ($5) and above Patrons</strong>. So if you enjoy what you hear and want to continue the adventure, we hope you’ll consider supporting the show!</p>
              <p>Whether you listen early on Patreon, or begin the story on October 5th, we look forward to having you with us as we begin our descent into the <em>Abomination Vaults</em>!</p>
              <p>Good luck Pathfinders!</p>
              <p><strong>Rick Sandidge<br></strong><em>Host and Gamemaster</em></p>
