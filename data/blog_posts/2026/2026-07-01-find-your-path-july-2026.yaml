           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Hail and well met, ‘Finders! This month’s new releases invite you to sail Golarion’s seas and delve into the mysteries of Falcon’s Hollow!</p>
              <p>Never miss a release with our <a href="https://store.paizo.com/subscriptions">Paizo Subscriptions</a>—for everything from rulebooks to accessories! Subscribers get a free PDF with purchase, early access to game content, and exclusive discounts for members with 4 or more active subscriptions.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__video" data-v-7a806b22>
             <div data-v-7a806b22>
              <iframe type="text/html" src="https://www.youtube.com/embed/fn49lmHxmqg" frameborder="0" data-v-7a806b22></iframe>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/795642c8-dcbf-4b1b-bf9f-010904f120bb/PZO17001-BC_PathfinderQuest-Box3DMock-up.png?w=300" alt="Pathfinder Quest Box Mockup" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-quest/?" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Quest</a></h2>
              <p><strong>Falcon’s Hollow Needs YOUR Help!</strong></p>
              <p>For many years, the farmers, loggers, and woodworkers of Falcon’s Hollow have lived a simple, prosperous life, despite being in the shadow of Droskar’s Crag, a massive volcano that looms on the other side of Darkmoon Vale. The dungeons carved into that mountain were once a den for monsters that menaced the region, but they’ve been quiet for over 10 years. Now, something stirs in the depths once more, causing the restless dead to pour forth and the mountain to belch smoke and ash, threatening every living person and creature in the Vale! Fortunately, your band of daring adventurers stands ready to face this growing darkness, wielding deadly weapons and utilizing powerful spells to protect the people of Falcon’s Hollow from a terrifying fate. Do you and your fellow adventurers have what it takes to turn the tide and get to the bottom of this mystery?</p>
              <p>Pathfinder Quest Standard Edition is available on store.paizo.com and at your friendly local game store! Pathfinder Quest Deluxe Edition was exclusively printed for our crowdfunding campaign—there are extremely limited quantities available for sale on our website!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/64d56051-260b-4d56-ad98-594ee8fad7c3/PZO22005_PEGalacticAncestries_3D.png?w=300" alt="Starfinder Second Edition Galactic Ancestries. The cover art features a starfinder goblin dressed in a space suit with a bandage covering a crack in their helmet, they have rocket launcher hefted to their shoulder. Standing behind them with bantrid, a short triangular alien with small wings at their back dressed in robes and glowing." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-galactic-ancestries/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Galactic Ancestries Pocket Edition</a></h2>
              <p><strong>The cantina is open!</strong></p>
              <p>This&nbsp;<strong>224-page</strong>&nbsp;rulebook is packed full of playable alien ancestries for Starfinder Second Edition games, including 21 brand new options like the lucky blue worlanisi, sentient rollerball bantrid, or even a blazing miniature sun called a novian. In addition to this intergalactic cast of science-fantasy species are a host of stellar options for familiar ancestries, including Starfinder favorites like reptilian vesk and insectoid shirrens, and fantasy classics like gnomes, elves, and goblins in space! On top of that, the brand-new Gap-touched versatile heritage connects players to the history-breaking event at the heart of the Starfinder setting while giving them special abilities, and the xenometric android allows readers to create robotic versions of any Starfinder alien, not just humans!</p>
              <p>The pocket edition provides the same rules content in a smaller, softcover, easy-to-transport version!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image above" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6c9d1fc5-f992-4945-8edc-7557d7c355e1/LostOmensHighSeas_SE.jpg?w=300" alt="Pathfinder Second Edition Lost Omens High Seas Special Edition: Silver embossed text on a blue textured leatherette cover" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/75c75d62-a0d6-4493-a2c0-f4c91d41304e/LostOmensHighSeas.jpg?w=300" alt="Pathfinder Second Edition Lost Omens High Seas" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-lost-omens-high-seas" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Lost Omens High Seas</a></h2>
              <p>Set a course for grand adventures with this expansive hardcover guide to the open waters of the Inner Sea. Since time immemorial, the people of Golarion have been setting out into the sea to gather resources, ply their trades, and seek secrets both above and below the water. Explore the failed utopia of the island of Hermea, the home of deadly Red Mantis assassins on Mediogalti Island, the mysteries of the Mordant Spire grown from the remains of a dead god, the countless pirate-scoured islands of the Shackles, or the dangerous depths of underwater regions. Each entry within this gazetteer includes the history, culture, and current events of the region, as well as a major city to include in a variety adventures. The book also includes new character options and a fold-out poster map!</p>
              <p>Pathfinder Lost Omens High Seas is available in standard hardcover, Special Edition faux-leatherette hardcover, and PDF formats.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/3ec5b686-ff57-4995-9e86-e0a4f3f49c2b/PZO21012-FM_IconicStarship_NovaRush.jpg?w=300" alt="Starfinder Second Edition Flip-Mat: Iconic Startship Nova Rush" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-flip-mat-iconic-starship-the-nova-rush" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Flip-Mat: Iconic Starship Nova Rush</a></h2>
              <p>No party of interstellar adventurers is complete without an iconic starship, whether it's a junky smuggler's vessel or a state-of-the-art fleet flagship. In the case of Starfinder's Iconic Heroes, that ship is the&nbsp;<em>Nova Rush</em>, as featured in the Starfinder adventure,&nbsp;<em>Battle for Nova Rush</em>. This double-sided map depicts two decks of a versatile starship complete with a command center, science, engineering, and medical facilities, storage bays, living quarters, airlocks, escape pods, and more! Whether your party is boarding an enemy vessel for rescue, piracy, or a diplomatic mission, or the Nova Rush is their home among the stars, this map is a must have for Game Masters of any sci-fi or science fantasy RPG!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/bc8a3515-984f-4fc0-ab8b-e75b9c8a67ca/PZO11039-FM__83043.jpg?w=300" alt="Pathfinder Second Edition Flip-Mat: Fleet Flagships" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-flip-mat-fleet-flagship/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Flip-Mat: Fleet Flagship</a></h2>
              <p>Set sail for the high seas in this four-masted clipper! Whether the PCs are leading a nation’s navy or pleasure cruising in their newest prize, this vessel is ready for high adventure. This double-sided Flip-Mat features the ship’s upper decks on one side, including the forecastle, quarterdeck and crow’s nest, and the lower decks on the other side showing the officer’s room, sailor’s bunks, and the gun deck. Whether your PCs are storming the ship or defending it from boarding parties,&nbsp;<em>Pathfinder Flip-Mat: Fleet Flagship</em>&nbsp;brings scale and drama to any seafaring scenario.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/4419efa5-7dca-472b-b263-1f3e220c08b1/PZO260125E__86828.jpg?w=300" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-society-scenario-1-25-the-hollowed-shell/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Society Scenario #1-25: The Hollowed Shell</a></h2>
              <p>A Starfinder Society Scenario designed for 3rd- through 4th-level characters, playable in 2-3 hours.</p>
              <p>Over the past year, numerous agents of the Starfinder Society have encountered a mysterious anomaly while traveling through the Drift: an artificial, alien structure unlike any starship or space station on record, that scrambles communication signals. This structure appears without warning and vanishes just as swiftly, and has proven to utterly confound starship scanners and magical assessment. Curious about this persistent anomaly, Venture-Captain Arvin has consulted a diviner and fellow Starfinder, Nykiti Lampadephoros, to determine the next known appearance of the site. Directions in hand, Arvin dispatches a team to locate and explore the Drift anomaly.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/f88759f9-1fbc-4bb1-ab2a-f98e714760e0/PZO160721E__18661.jpg?w=300" alt="Pathfinder Second Edition Pathfinder Society Year of Battle's Spark: The Home of Empty Breath" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-society-scenario-7-21-the-home-of-empty-breath/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Society Scenario #7-21: The Home of Empty Breath</a></h2>
              <p>A Pathfinder Society adventure for 5th-6th level characters, playable in 2-3 hours.</p>
              <p>As part of the Pathfinder Society's attempts to make allies across all nations, a few Pathfinders have made contact with a low-ranking Blood Lord among the leadership of the undead nation of Geb, the lich Msasa Kuatuz. As part of her attempts to climb the ranks, she's agreed to introduce the Society's representatives to her fellow Blood Lords, so long as the Society is willing to assist her with one little problem: she hasn't seen her ghoul friend in a number of years and she'd like the Society to check on them. Once inside the ghoul academic's home, the Pathfinders find evidence of giant bugs, assassination attempts, and scholarly disarray, but where could the ghoul be?</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/7c07c3e4-f1ff-4bdc-b9ae-2aabd4106a55/PZO260126E__63121.jpg?w=300" alt="Starfinder Second Edition Starfinder Society Invasion's Edge: Final Gambit Part Two" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-society-scenario-1-26-final-gambit-part-two/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Society Scenario #1-26: Final Gambit: Part Two</a></h2>
              <p>A Starfinder Society Scenario designed for 5th- through 6th-level characters, playable in 2-3 hours.</p>
              <p>The invasion of the Wreck of the Returned continues as a team of Starfinders enters the magical heart of the Wreck, a metaphysical liminal space occupied by Elovai’s mind. But can a foe as dangerous and powerful as a First One be defeated in a realm under her control? Battle your way through the heart of the Wreck to take down Elovai in a final showdown over the fate of Akiton!</p>
              <p>This is an adventure in the ongoing Invasion’s Edge metaplot, and is part two of a two-part scenario series. This adventure’s direct prequel is&nbsp;<a href="https://store.paizo.com/starfinder-society-scenario-1-24-final-gambit-part-one"><em>Starfinder Society Scenario #1-24: Final Gambit: Part One</em></a>.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/0432a67f-e119-442d-852f-78a37d60f2d2/PZO160722E__31472.jpg?w=300" alt="Pathfinder Second Edition Pathfinder Society: The year of Battle's Spark The Handmaiden's Gaze" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-society-scenario-7-22-the-handmaiden-s-gaze/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Society Scenario #7-22: The Handmaiden’s Gaze</a></h2>
              <p>A Pathfinder Society adventure for 11th-12th level characters, playable in 2-3 hours.</p>
              <p>The Pathfinders have learned of a group of Hellish soldiers sitting outside Absalom in the Cairnlands. Though they've alerted the Grand Council of Absalom, the Council's hands are tied between international relations and the complexities of the legal system, but the Pathfinders are willing to step up and handle the situation. Two devils lead the troops; one of them, a devil that's already met their match against the Society, the other a devil who's been hiding in plain sight since the beginning of the entire crisis. It's up to the Pathfinders to show them that Absalom is not a toy that they can use for their nefarious plans!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>From Our Partners</h2>
              <p>Our partners at Archives of Nethys, Demiplane, Fantasy Grounds, Hero Lab Online, and Roll20* are dropping new content this month as well! Buy your PDF on paizo.com to get a discount via the PaizoConnect API. Or pay full price on their platforms, sync your account, and get a complimentary PDF on the Paizo Store.</p>
              <p>*Roll20 is no longer a part of PaizoConnect and discounts and complimentary PDFs do not apply.</p>
              <p><br></p>
              <p>Bring Pathfinder and Starfinder to where you are, in person or online, and if you don’t have a favorite local game store, get books delivered to your door via a&nbsp;<a href="https://store.paizo.com/subscriptions">Paizo Subscription!</a> From rulebooks to adventures, accessories, and more, we’ve got subscriptions for every table. Subscribing to a line of books gets you the physical book and the PDF for one price! Subscribe to four lines or more to unlock exclusive discounts on subscriptions and added products.</p>
