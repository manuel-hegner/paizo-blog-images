           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Hail and well met, adventurers!</p>
              <p>Gen Con 2026 is upon is as the halls open for the Best Four Days in Gaming! Whether you’re popping by to see us at the show or celebrating at home, there’s a smorgasbord of excitement to be had!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>New Releases &amp; Exclusives!</h2>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/444590df-6975-4753-b353-d0792cdebd6b/13Omens_Banner.png?w=700" alt="13 Omens banner. A young man and women creep through a dark cave guided by a single flashlight. Something lurks in the background of the cave" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Step into the darkness with Paizo’s new rules-lite, modern supernatural horror RPG: 13 Omens! Designed by Jason Bulmahn and Joe Pasini, 13 Omens is easy to pick up and learn, built for one-shots, and guaranteed to tick up the tension to the adventure’s thrilling conclusion!</p>
              <p>Releasing <em>exclusively </em>at Gen Con 2026, Paizo will be printing limited quantities of the <em>13 Omens Preview Edition </em>rulebook, <em>Bequeathed, A 13 Omens Story, </em>and a premium Omen Dice Set with Bag.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e7c8071b-b7af-4b75-8f18-a571d7116b61/13Omens_Products.jpg?w=700" alt="A layout of Paizo's Thirteen Omens and two preview adventures. " data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>13 Omens is funding on Kickstarter later this fall! Join the mailing list and put down a $5 reservation to access PDF versions of both the preview rulebook and <em>Bequeathed.</em></p>
              <p><a href="https://www.launchoracle.com/paizo/13-omens/KLLD5" data-new-window="true" target="_blank" rel="noopener noreferrer">Embrace the darkness.</a></p>
              <h3><br></h3>
              <h2>August Releases</h2>
              <p>Additionally, all of our August releases are dropping at Booth 203 and on <a href="https://store.paizo.com">https://store.paizo.com</a> ! Broaden your horizons for Pathfinder and Starfinder with these exciting books:</p>
              <ul>
               <li>Pathfinder Impossible Magic</li>
               <li>Starfinder Absalom Station: Center of the Galaxy</li>
               <li>Pathfinder Adventure Path: Bastion of Blasphemies</li>
               <li>Starfinder Assault on Absalom Station</li>
              </ul>
              <p>If you’re at Gen Con, drop by Booth 203 or the Sagamore Ballroom to pick up an advance release copy of Pathfinder Dice Gods, our semi-cooperative dice-drafting game dropping in September!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/fb86cfc2-74b9-4f15-a07e-67fd2c66ecfd/August26_Releases.jpg" alt="A layout of Paizo Products releasing in August 2026 including Pathfinder Second Edition Impossible Magic, the hardcover, sketch cover, and special editions. Paizo Thirteen Omens preview, Pathfinder Second Edition Bastions of Blasphemy Adventure Path, Starfinder Absalom Station: Center of the Galaxy, and Starfinder Assault on Absalom Station fiction novel." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Gen Con Deals!</h2>
              <p>Whether you’re shopping online or at the booth, we’ve got some deals and delights for the weekend! Today through Sunday, August 2<sup>nd</sup> at 11:59 P.M. Pacific Time, stock up on books for your table!</p>
              <h3><em>Pathfinder Rulebook Stacking Discount!</em></h3>
              <p>The more books you buy, the more you save!</p>
              <ul>
               <li>Buy 1 rulebook: 10% off</li>
               <li>Buy 2 rulebooks: 15% off</li>
               <li>Buy 3+ rulebooks: 20% off</li>
              </ul>
              <p><em>Pathfinder Impossible Magic </em>is excluded from this promotion. All other Patfhinder rulebooks, in all physical formats (Standard Hardcover, Sketch, Special Edition, and Pocket Edition) are included. Digital formats not included.</p>
              <h3><em>Hellfire Crisis Bundle</em></h3>
              <p>Buy any three of the following and receive 20% off the whole bundle:</p>
              <ul>
               <li>Pathfinder Lost Omens Hellfire Dispatches</li>
               <li>Pathfinder Adventure Path: Hellbreakers</li>
               <li>Pathfinder Adventure Path: Hell’s Destiny</li>
               <li>Operation Hellmouth, A Pathfinder Novel</li>
              </ul>
              <p><em>Promotion applies to all physical editions and excludes PDFs, Foundry VTT modules, and other digital products.</em></p>
              <h3><em>Starfinder Adventures Sale</em></h3>
              <p>Save 15% on Starfinder Adventure Path: Guilt of the Grave World and Starfinder Adventure Anthology: Tales from the Vast!</p>
              <h3><em>Pathfinder Beginner’s Journey Bundle</em></h3>
              <p>Purchase Pathfinder Adventure Path: Bastion of Blasphemies and receive 20% off all of the following products:</p>
              <ul>
               <li>Pathfinder Beginner Box: Secrets of the Unlit Star</li>
               <li>Pathfinder Adventure Anthology: Troubles in Grayce.</li>
              </ul>
              <p><em>Promotion applies to all physical editions and excludes PDFs, Foundry VTT modules, and other digital products.</em></p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e84bf275-5d40-4fbd-974c-f0d25f6a03b8/PFRulebooks_960x1200.jpg?w=250" alt="Pathfinder Rulebook Stacking Discount!" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6f621299-2542-4298-b380-a0199481a804/HellfireBundle_960x1200.jpg?w=250" alt="Hellfire Crisis Bundle" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/bf32a23e-ef97-4cea-ba60-3e048cc088e8/SF2EAdventure_960x1200.jpg?w=250" alt="Starfinder Adventures Sale: Save 15% on Starfinder Adventure Path: Guilt of the Grave World and Starfinder Adventure Anthology: Tales from the Vast!" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e77b6978-5bbf-4644-a1c3-b3f490302850/PFBundle_960x1200.jpg?w=250" alt="Pathfinder Beginner’s Journey Bundle: Purchase Pathfinder Adventure Path: Bastion of Blasphemies and receive 20% off all of the following products: Pathfinder Beginner Box: Secrets of the Unlit Star and Pathfinder Adventure Anthology: Troubles in Grayce." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Events at Gen Con!</h2>
              <p>Join us for a panel, live show, or game at the show! <a href="https://www.gencon.com/event_finder?host=Paizo+Inc">All of our events with tickets still available can be browsed here!</a> Generic tickets will be accepted at the door to panels, the live show, and select gaming tables.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/b4c31526-ade1-4a66-9011-2837a36406c6/WoundedWisp_Logo.png?w=600" alt="The Wounded Wisp Logo:  wooden board with text carved into it" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>The Wounded Wisp</h2>
              <p>Wind down to finish off your busy days at The Wounded Wisp, founding place of the Pathfinder Society! We are excited to once again partner with the Omni Severin to theme the Bar Cardinale for the duration of Gen Con!</p>
              <p>Stop by The Wounded Wisp for themed food and drinks, a special Omni-exclusive Pathfinder button, mini painting, and games!</p>
              <p>Thursday, Friday, and Saturday, join Paizo and our partners at Turbo Dork for a miniature paint-and-take from 4:30 P.M. to 6:00 P.M</p>
              <p>Test your skills in our Starfinder Infinity Deck tournament, Thursday from 6:30 P.M to 9:00 P.M.</p>
              <p>Drop in and try out our party and strategy games during Open Gaming, Friday and Saturday from 6:30 P.M. to 9:00 P.M.! Everyone who plays can enter their name for a chance to win the board game at the end of the evening.</p>
              <p><br></p>
              <p>Hope to see you at the show! Drop by and say hello!</p>
              <h3><a href="https://paizo.com/threads/rzs8i3i2?NEW-BLOG-Welcome-to-Gen-Con-2026" data-new-window="true" target="_blank" rel="noopener noreferrer">Not at the show? Drop by and say hi in the Paizo Forums!</a></h3>
             </div>
            </div>
           </div>
