           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p><em>Take time with a wounded hand<br>
                 ‘Cause it likes to heal<br></em>--Stone Temple Pilots</p>
              <p>Last winter, when we first received the green light from Erik Mona to play through <em>The Dead God’s Hand </em>before its release, we were as nervous as we were excited for the moment that had finally arrived. Seven years in the making, we rearranged everything to see this project happen – including the launch of another Pathfinder project. The schedule for The Dead God’s Deliverance was daunting: three marathon sessions, each about five weeks apart, spread across the entire summer. This meant dropping five blogs in just a few months, our fastest pace since the Pathfinder Playtest in <a href="https://paizo.com/blog/order-of-the-amber-die-mdash-doomsday-dawn-playtest-wrap-up">2018</a>. All we had to do was draft a roster of members willing to sacrifice their personal lives, and this new project was a go! Now that this playthrough is in the past, we’ve pulled together our data, candid photos, and behind the scenes material for one final look at The Dead God’s Deliverance. This is what we call, “Session Plus One.”</p>
              <p>Before we go behind the scenes, you might want a refresher on how our party of Aroden worshipers fared during their quest to escape their captors and restore the Last Azlanti:</p>
              <p><a href="https://paizo.com/blog/the-dead-god-s-deliverance">Introduction</a></p>
              <ul>
               <li><a href="https://paizo.com/blog/the-dead-god-s-deliverance-part-1">Part 1</a></li>
               <li><a href="https://paizo.com/blog/the-dead-god-s-deliverance-part-2">Part 2</a></li>
               <li><a href="file:///Users/maryssalagervall/Desktop/DGH%203">Part 3</a></li>
              </ul>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/531103a9-f3ed-4709-9710-cdac67d2021f/OoTAD_Reflection_IMG_0771.jpg" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Let’s go over the session hours first. The author states that it should take somewhere around thirty hours to complete the adventure, and we agree. We’ve never said that our tracked hours are an average guide to follow, as our playthroughs tend to run about double standard length for several reasons. First, we are playing rules-as-written, with a strict adherence to the way the adventure is authored; this means we spend a good amount of time making sure we get correct rulings. Second, we have some very elaborate setups that require extra management, and we include that time in our session hours. Third, we slow down here and there to track data, document our experience, or even capture a great photo for all of you. Lastly, we roleplayed A LOT in this adventure. With a party consisting entirely of worshipers of Aroden that were delving the holy Sanctum of the god of humanity, that part came naturally.</p>
              <ul>
               <li><strong>Completed Deluxe Adventure</strong>: The Dead God’s Hand</li>
               <li><strong>Total Marathon Hours</strong>: 121 hours, 35min</li>
               <li><strong>Total Session Hours</strong>: 69 hours, 10min</li>
              </ul>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image right" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/089cf4da-8329-4215-8d23-1cfb7f8a47f9/OoTAD_Reflection_Heinrich.jpg?w=450" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Behind The Scenes:</h2>
              <p>□ Dozens of groups have played the various unpublished versions of this adventure over the years, but the author informed us that we were the first group to ever use the <em>Flame of the Radiant Spark</em> to revive a dead NPC that we came across – in this case a mustachioed Taldan rogue named Heinrich. We’re hoping to start a new trend with these reflection blogs, by leaving something behind for the community to use with their own games. Since Heinrich did not have a portrait in the adventure, we present you with the original portrait we used, courtesy of artist <a href="https://www.youtube.com/@erikfrankhousepresents">Erik Frankhouse</a>!</p>
              <p>□ After so many comments from the community, we’ll go back to the TPK one last time. Even though it technically occurred during the Test of Aroden and the consequences weren’t as severe, it marked our third Total Party Kill across eleven years of releasing these blogs. The first was in <a href="https://paizo.com/blog/giantslayer-marathon-part-6">2015</a>, the second in <a href="https://paizo.com/blog/the-abomination-arsenal-part-7">2024</a>, and the third right here in 2026. We have our concurrent project, <a href="https://paizo.com/blog/the-sky-scions-part-3">The Sky Scions</a>, wrapping up in 2027 and right now there isn’t a single dwarf in Clan Firecask that isn’t thinking about the ramifications of another TPK.&nbsp;</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>□ Something we probably didn’t talk enough about was the adventure’s plot outside of our unique goal of trying to restore Aroden. The ancient statue of Aroden found at the end of the adventure – the “dead god’s hand” as it were – can serve as one of the requirements that allows someone to take the Test of the Starstone! There was a plot going on alongside us that most groups will encounter, starting with the reason the hryngar are tunnelling under Absalom in the opening scene. As you can read in the quote down below, we had our own mission to restore Aroden and no one else’s motives were going to get in our way.</p>
              <p>□ We’ve already mentioned one of our favorite scenes where a three-way tie occurred in the Destiny Points system, which is used to determine who will become the initiate in the Test of Aroden. We’ve included a photo with the blog that shows the actual tracker our GM used during our playthrough. Also, Adam was interviewed about The Dead God’s Deliverance on <a href="https://www.youtube.com/watch?v=6dy2nQI041o&amp;t=439s">Know Direction</a>, and said he would put together some of our raw footage of the speeches that each player gave to convince the others they should be the initiate. <a href="https://youtu.be/BNOXSTVHCaU">Here they are</a>, let us know who you think deserved your vote!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>□ Let’s not forget the Amber Die itself. As you can see in the photo, its etched faces have begun to fade over the decades; our GM uses the die sparingly these days, but he’ll roll it at some key moments. Early in the adventure, we employed Acrobatics checks to scramble only somewhat successfully on a ledge that surrounded a deep pit. When it came time for the NPCs to attempt it, Adam decided that the Amber Die should determine whether they were worthy of having their names remembered. The die threw down one of its signature 20-20-20s, and the three NPCs showed us how to skirt around the pit with complete ease!&nbsp;</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/9ae80d18-b46f-40f4-abd1-0bb3f7243fe8/OoTAD_Reflection_4912.jpg?w=650" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>□ We’ve never shied away from trying new things: For the first time, we implemented a hybrid virtual format at the table. One of our esteemed veteran members, Matthew Hardin, was stationed overseas in Rome at the U.S. embassy during this project. We decided to try and use WhatsApp to have him present with us through an iPad – it actually worked pretty well! As you can see in the photo, Matt had a good view of the action and could mic in whenever he wanted; it helped us try something new, but it was lacking in the realm of table presence. We’ve decided that in spring 2027 when Matt lands stateside again, we’ll put the hybrid option away.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/10ed03e7-c623-4695-bf68-f75643ca3ae7/OoTAD_Reflection_2441%20v1.jpg?w=450" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/8c99859d-0fc0-432b-9eca-05edce49bd60/OoTAD_Reflection_9792.jpg?w=450" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>The Dead God’s Hand by the Numbers</h2>
              <p>Real-life time passed: 3 months<br>
                Longest single session: 11 hours, 30 min.<br>
                Party shared feat: Incredible Initiative<br>
                Most valuable skill: Aroden Lore<br>
                Most valuable feat: Plant Banner<br>
                Coolest ability: Whispers of Weakness<br>
                Total Character deaths: 12<br>
                Times Heinrich died: 4<br>
                Live-NPCs featured: 5<br>
                Nurses at the table: 2<br>
                Teachers at the table: 4<br>
                Published adventures completed since 1987: 174</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3><strong>Party Data</strong></h3>
              <p><strong>Uhlan Vale<br></strong>Oracle<br>
                Uses of Whispers of Weakness: 10<br>
                Number of times a weakness was learned: 3</p>
              <p><strong>Dorianth<br></strong>Commander<br>
                Uses of Double Team tactic: 7<br>
                Successful uses of Double Team: 4</p>
              <p><strong>Cassiel Seldeogaear<br></strong>Fighter (wizard archetype)<br>
                Uses of Reactive Strike: 3<br>
                Reactive Strike hits: 1</p>
              <p><strong>Bettalia<br></strong>Barbarian (Spirit Instinct)<br>
                Uses of Demoralize: 4<br>
                Successful uses of Demoralize: 4<br>
                Critical success Demoralize: 1</p>
              <p><strong>Alleuwyn Alsyr<br></strong>Exemplar<br>
                Uses of Scar of the Survivor: 27<br>
                Total hit points healed: 186</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/de64c4fd-e34b-43ba-bff7-32a547294959/OoTAD_Reflection_Tracker.jpg" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Quote not to forget:</h2>
              <p>(Shan had the best dad jokes)<br>
                Irabel of Eiseth: “I’m coming with you, start the Test.”<br>
                Alleuwyn: “The aspirant has spoken, Chelaxian. You are not coming with us.”<br>
                Shan: “Yeah, can’t we just tell her to Chelax about it?”</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Aftermath</h2>
              <p>Our party, The Aroden 5, completed the Test of Aroden. We then stood where so many worshippers had done before, and touched the hand of the statue of our god. The legend of gaining an audience with the god of humanity may have been true once, but there was no answer now. This still left us with a difficult choice: What do we do with the statue? We had already encountered at least a couple of groups interested in obtaining the stone hand for themselves, as possessing it would enable someone to pass one of the final requirements for the Test of the Starstone. Don’t judge us – we had to break off the hand and take it. We also kept the <em>Azlanti Diamond</em>, the sword of Aroden himself. Now in possession of two items that could help us get through the Test of the Starstone, our characters finally accepted the past and started to look toward the future. Get ready Golarion, the void Aroden left might just be filled by two members of The Aroden 5.</p>
              <p>We should probably have been disappointed that by the end of the adventure we couldn’t bring about Aroden’s return, or even learn what it would take to do so. After all, those goals were what we imagined <em>The Dead God’s Hand </em>contained within its covers. We also incorrectly assumed Aroden’s return was the main reason that this adventure took seven years to hit publication. Instead, we gained something far greater throughout this journey: We got to experience an adventure that an author closely nurtured for a substantial part of his life, poured countless time and energy into, and ultimately delivered a work so detailed that it now demands a place among our fondest adventuring memories. Our party left the Sanctum of Aroden having acquired precious lore, experiences, and a shared sense of purpose. While our characters didn’t deliver Aroden back to Golarion, Erik Mona<em> </em>delivered Order of the Amber Die exactly what we wanted – we’ll never forget the summer we played <em>The Dead God’s Hand</em>.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
