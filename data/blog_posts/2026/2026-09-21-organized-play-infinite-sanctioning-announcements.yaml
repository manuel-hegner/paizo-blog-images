           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Beginning today, September 21st, we're officially opening the Pathfinder and Starfinder Society programs to fan-created scenarios through our Infinite program. You can find more information on the program <a href="https://help.pathfinderinfinite.com/hc/en-us/articles/43593276216983-Pathfinder-and-Starfinder-Society-Infinite-Scenario-Guidelines" data-new-window="true" target="_blank" rel="noopener noreferrer">here</a>, including how to write and publish your own Pathfinder and Starfinder Society scenarios through Infinite.</p>
              <p>Our goal is to grow the number of Organized Play offerings available to the community by welcoming fan-created content. We'll be watching closely how this change affects the community, and we're looking forward to working with our Infinite creators, Venture-Officers, and campaign participants on how best to adjust in the months ahead.</p>
              <p>Along with this announcement, we have several other updates about the future of Paizo Organized Play that we're excited to share.</p>
              <h2><br></h2>
              <h2>Scenario Release Cadence</h2>
              <p>Let's start with news that sounds dramatic at first, but won't seem so dire once we dive into the details.</p>
              <p>In October, Paizo will be winding down the monthly release of Pathfinder Society Scenarios.</p>
              <p>We're shifting how regular Organized Play content is distributed—moving from standard monthly scenario releases to a handful of larger releases throughout the year, as described below. In many ways, this means Organized Play will see <em>more</em> content over the course of a year than it was previously scheduled to have, just delivered differently.</p>
              <p>We remain firmly committed to Organized Play, but our release cadence needs to change to adapt to recent shifts at Paizo. With hundreds of scenarios already available for active play, our goal is to produce content in new ways that generates wider interest in the program and greater excitement among our current playerbase.</p>
              <h2><br></h2>
              <h2>Paizo Printables Adventures</h2>
              <p>Since its launch in April, Paizo Printables—our monthly 3D-printable miniatures line for Pathfinder—has seen growing success. Alongside STL files for Paizo's creatures and characters, we've also released a short adventure each month to help support these releases. We’ve sanctioned these small adventures with generic Chronicle Sheets, letting you get credit for trying them out.</p>
              <p>Starting this October, with the launch of the spooky-themed <em>Creep Season</em>, Paizo Printables adventures are expanding to match the size of a current Pathfinder Society scenario. You can learn more about Paizo Printables <a href="https://store.paizo.com/paizoprintables/" data-new-window="true" target="_blank" rel="noopener noreferrer">HERE</a>.</p>
              <p>Going forward, monthly Paizo Printables releases will serve as our regular Organized Play content for Pathfinder Society. Each adventure will include guidance for adjusting difficulty, a bespoke Chronicle Sheet, and a full page of details on running it in the Organized Play environment—traditional Venture-Captain briefings, mission gear, early Recall Knowledge check details, and primary and secondary objectives. All of this comes alongside accessible 3D-printable miniature files for anyone backing Paizo Printables on MyMiniFactory or Patreon.</p>
              <p>If you're only interested in the adventure content, we'll release the PDFs on the <a href="https://store.paizo.com/pathfinder/adventures/paizo-printables-pdfs/"><strong>Paizo Webstore</strong></a> 1 month after their MyMiniFactory/Patreon release. Venture-Officers and stores can continue to receive these files for free to run at local events (though you'll still need to back the MyMiniFactory/Patreon campaign to get the STLs and other bonus content).</p>
              <h2>Wrapping Up the Year of Clockwork Mystery</h2>
              <p>With this change to scenario releases, you might be wondering what happens to the ongoing Year of Clockwork Mystery metaplot. We plan to wrap up that storyline early next year with the Paizo Printables <em>Season of Clockwork Mystery</em>. The original developers of Year of Clockwork Mystery are stepping back in to write the conclusion themselves alongside some trusted freelancers. This season includes three adventures to complete the metaplot, plus a bonus adventure featuring a climactic showdown against a Huge clockwork foe!</p>
              <h2><br></h2>
              <h2>Keeping the Metaplot Alive</h2>
              <p>With monthly Pathfinder Society scenarios shifting to Paizo Printables adventure releases, there's another obvious question: what happens to metaplot storylines?</p>
              <p>Paizo Printables will continue to explore different adventure themes—Hellfire Crisis, Aquatic, Spooky Monsters, Clockwork, and more to come—but that leaves a Starfinder-esque ‘Gap’ for the kind of longer, interconnected narrative that Pathfinder Society players have grown accustomed to over the years.</p>
              <p>To address that, here's a look further down the road, and how we plan to get there.</p>
              <p>In 2028, Paizo will release a <strong>Pathfinder Society Adventure Anthology (exact title TBD):</strong> a hardback book compiling several new, scenario-sized adventures. Much like Scoured Stars before it, or the upcoming <em>Invasion's Edge</em> hardcover for Starfinder, this book will feature several ~3-hour scenario-length adventures telling a cohesive story centered on the Pathfinder Society. All the content will be entirely new, effectively taking the place of our past seasonal content releases, just packaged as a hardback book.</p>
              <p>In summer 2027, at Gen Con, we'll release the first wave of these scenarios digitally to volunteers and some select community members, providing additional scenarios and metaplot content for Pathfinder Society play at Gen Con and at local game stores and clubs worldwide. In early 2028, we'll release a second wave in the same way, giving key volunteers and active Organized Play participants the chance to run these adventures throughout the year.</p>
              <p>Finally, just before Gen Con 2028, we'll release the full hardback book containing all previously released adventures plus the final chapters that complete the storyline. Every adventure will come with its own Chronicle Sheet and will be built with Organized Play in mind, while also welcoming new players into the Pathfinder Society.</p>
              <h2><br></h2>
              <h2>Starfinder… Question Mark?</h2>
              <p>So what about Starfinder in all this?</p>
              <p>Starfinder will continue with its monthly Society Scenario releases as currently scheduled.</p>
              <p>We're also exploring a 3D-printables line for Starfinder next year, potentially following a similar model to what we're building for Pathfinder.</p>
              <p>Beyond that, Starfinder has an exciting future ahead—unannounced products and some experimental content we're looking forward to trying out. Since its inception, Starfinder Society has been central to storytelling in the Starfinder setting, and you can already see that with the previous Invasion's Edge Society season, which is being released as a hardback compilation in 2027.</p>
              <p>When it comes to Pathfinder options in Starfinder Society, we’ll be opening those doors very soon. Our intent is to open several Pathfinder options, including several classes and archetypes, for Starfinder Society players. We’re going to be very tactical with this, focusing on class options presented in their respective books and avoiding alternate rules spread throughout the Pathfinder line in supplementary products. We’ll also be avoiding several additional ancestries to help keep the feel of Starfinder and Pathfinder campaigns distinct.</p>
              <p>We'll have more to share specifically about Starfinder soon, but for now, expect regular releases to continue. Look forward to a Printables line sometime in the new year!</p>
              <h2><br></h2>
              <h2>Some Final Thoughts</h2>
              <p>Organized Play is core to Paizo. I started my career as a freelancer working on Organized Play, and later helped launch Starfinder Society. We all care deeply about this program, and these changes reflect our commitment to its continued success.</p>
              <p>Some of the changes above may look drastic at first glance, but they're going to mean more overall content for the program, along with more tools to bring in new players. Whether it's early digital content available only to trusted volunteers and active campaign participants, or 3D-printable miniatures that help improve the visual appeal of your games at events and stores, we want to do everything we can to help this program, and everyone who champions it, succeed.</p>
              <p>Thank you all so much for your continued support of this vital part of Pathfinder, Starfinder, and Paizo as a whole.</p>
              <p><strong>Thurston Hillman<br></strong><em><strong>Associate Publisher</strong></em></p>
