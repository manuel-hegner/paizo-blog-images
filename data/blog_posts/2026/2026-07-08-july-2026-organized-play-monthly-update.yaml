           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d8aae3c3-fa1c-4eda-942d-43cda27d79a3/051520_PaizoOP.png?w=300" alt="Organized Play logo, white text over blue golem graphic on orange background" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>OPC Musings</h1>
              <p>Hi everybody,</p>
              <p>This blog is going to be a little different. As you know, a couple of weeks ago, Paizo announced a restructuring, laying off eleven employees—including both Pathfinder Society developers—and severely reducing our Organized Play output.</p>
              <p>I’m trying not to focus on any of that, and instead focus on the positive. On the thousands of players worldwide, on the people who have reached out to check in on me and my coworkers. On you all, who love our games so much and are determined to do whatever you can to help us, and to keep playing.</p>
              <p>The future is going to be rocky. I don’t have answers today, but I will soon, and they’ll be what they’ll be. For now, just know that we love you all. I’m going to keep the rest of this blog as positive as possible, as we need some good news in our lives right now, and I’ve got plenty of that to share.</p>
              <p><br></p>
              <h1>Digital Adventure Releases</h1>
              <p>The following adventures will be released on August 3, 2026, and can be run at events beginning on that date.</p>
              <p><a href="https://store.paizo.com/pathfinder-society-intro-year-of-clockwork-mystery/"><em>Pathfinder Society Scenario #8-01: Intro to the Year of Clockwork Mystery</em></a><em><br></em><a href="https://store.paizo.com/pathfinder-society-scenario-8-02-the-fey-reclamation/"><em>Pathfinder Society Scenario #8-02: The Fey Reclamation</em></a><em><br></em><a href="https://store.paizo.com/pathfinder-society-scenario-8-03-for-the-love-of-vanity/"><em>Pathfinder Society Scenario #8-03: For the Love of Vanity</em></a><em><br></em><a href="https://store.paizo.com/pathfinder-society-scenario-8-04-a-theft-in-riddleport/"><em>Pathfinder Society Scenario #8-04: A Theft in Riddleport</em></a></p>
              <p><a href="https://store.paizo.com/starfinder-society-scenario-2-01-the-first-cut/"><em>Starfinder Society Scenario #2-01: The First Cut</em></a><em><br></em><a href="https://store.paizo.com/starfinder-society-scenario-2-02-solar-shakeup/"><em>Starfinder Society Scenario #2-02: Solar Shake Up</em></a><em><br></em><a href="https://store.paizo.com/starfinder-society-scenario-2-03-bittersweet/"><em>Starfinder Society Scenario #2-03: Bittersweet</em></a><em><br></em><a href="https://store.paizo.com/starfinder-society-scenario-2-04-a-watery-grave/"><em>Starfinder Society Scenario #2-04: A Watery Grave</em></a></p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>GM and Volunteer Recognition</h1>
              <h2>Campaign Service Coins</h2>
              <p>Convention season has truly begun! One of my favorite things I get to do when I attend conventions is hand out Campaign Coins. We award these coins to members of the community who have gone above and beyond to provide an exceptional program to the community at large. Campaign Coins are awarded based on nominations; if you believe someone in your community is deserving of this award (whether or not they are a Venture Officer), send an email to organizedplay[at]paizo[dot]com with their name and reasons.</p>
              <p>Congratulations to a record batch of Campaign Coin awards:</p>
              <p><strong>Kirill Shtorm</strong>, who now holds a Campaign Coin and OP ID #892<br><strong>Derek Pearson</strong>, who now holds a Campaign Coin and OP ID #894<br><strong>Mark Price</strong>, who now holds a Campaign Coin and OP ID #895<br><strong>Emese Kollár</strong>, who now holds a Campaign Coin and OP ID #933<br><strong>Brenael</strong>, who now holds a Campaign Coin and OP ID #940<br><strong>Michael Beck</strong>, who now holds a Campaign Coin and OP ID #946<br><strong>Treassa Cumpston</strong>, who now holds a Campaign Coin and OP ID #950<br><strong>JJ Yardley</strong>, who now holds a Campaign Coin and OP ID #953<br><strong>Geoff Barbour</strong>, who now holds a Campaign Coin and OP ID #954<br><strong>Solatra, AKA Stygia, credited as Sasha Laranoa Harving</strong>, who now holds a Campaign Coin and OP ID #957</p>
              <h2>Order of the Wayfinder</h2>
              <p>In addition to the Campaign Service Coin, we also have one other award: the Order of the Wayfinder. This award is given out only once per year, and it recognizes a member of the community who has provided exceptional service. Typically, we give this award to individuals who have taken on a particular project and knocked it out of the park. Previously, this award has been awarded to the head of our Gen Con committee and our Regional Venture-Coordinator for the Online region, among others.</p>
              <p>In the past month I was actually able to induct <em>two </em>new members into the Order of the Wayfinder. While I had 2025’s in my pocket last year, there was never a good opportunity to award it, and I fixed that this year.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image right" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d08d2a24-af4d-40e4-8723-582333e48b25/IanHawthorne.jpg?w=300" alt="Ian Hawthorne, a white skinned older man with white hair and beard, holding his Wayfinder" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Ian Hawthorne, photographer Auke Teeniga</p>
              </figcaption>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>2025 Order of the Wayfinder - Ian Hawthorne (#109)</h3>
              <p>Ian has been the Regional Venture-Coordinator for the Isles region (covering Great Britain &amp; Ireland) since just before I joined the company. In that time, he has been the very model of a modern RVC. The Isles region was hit hard by the pandemic-era lockdowns, but his leadership steered them through and into a growth period today. His calm and decisive leadership has seen the region through turbulence these past six years. He has also served as one of the lead organizers for their presence at UK Games Expo, one of Europe’s largest gaming conventions and the region’s largest event of the year, as well as establishing a presence at Tabletop Scotland. Ian is someone whose opinions I trust implicitly, and he’s a delight to spend any length of time with. I am thrilled to induct Ian into the Order of the Wayfinder.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image right" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/431b6abd-7b59-4e60-b5d8-a8c92fa3f187/JanicePiette.jpg?w=300" alt="Janice, a white skinned woman with brown hair and a red skirt, hugging Alex, convention and organized play manager, as she receives her Wayfinder" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>:Janice Piette, photographer Betty Jo Osthoff</p>
              </figcaption>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>2026 Order of the Wayfinder - Janice Piette (#110)</h3>
              <p>Janice is the outgoing Venture Captain for the state of Ohio, a state that holds a special place in my heart. She took over in a turbulent time for the state and the area, but her leadership kept things steady and on track. She has served as the lead for Origins, the largest convention in the state and one of Organized Play’s largest presences outside of Gen Con, and led her team to a number of incredibly successful conventions. There’s nobody in the area who doesn’t love Janice and isn’t sad to see her leaving us later this year. She may be downsizing for a move to France, but I couldn’t let the opportunity pass without giving her one more thing to take with her.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>GM Ranks</h2>
              <p>Whether stars, novas, glyphs, or a secret fourth thing, achieving a 5 ranking in any program involves a substantial amount of time. To achieve the 5th milestone, a GM must run 150 games, of which at least 50 must be unique scenarios and 10 special scenarios, as well as running between one and three games for venture-captains (program dependent). A conservative estimate of the time needed to reach the 5th milestone is 650 hours!</p>
              <p>This month we had one GM reach their fifth rank!</p>
              <p><strong>5th Glyph (PFS2)</strong>: Brian Dailey<br>
                If you believe you’ve completed your 5th rank but haven’t been announced yet, please email me at <a href="mailto:organizedplay@paizo.com">organizedplay@paizo.com</a>.</p>
              <p>Until next time—Explore! Report! Cooperate! And be excellent to each other. We’ll see you at Gen Con!</p>
              <p><br></p>
              <p><strong>Alex Speidel<br></strong><em>Convention and Organized Play Manager</em></p>
              <p><br></p>
