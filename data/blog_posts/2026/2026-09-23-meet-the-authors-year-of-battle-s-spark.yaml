           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Greetings, players! In today’s blog we’d like to take a moment to recognize our talented freelance authors who contributed to the seventh season of Pathfinder Society (Second Edition) scenarios. Some of these authors have been writing for us for years, while others saw their names in print for the very first time!</p>
              <p><strong>Alex Speidel<br></strong><em>Convention and Organized Play Manager</em></p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/28f45cae-c137-43cf-a3fd-b46a08c6e17c/PZO160700_Season7Symbol_1500.png?w=500" alt="Pathfinder Society Year 7 Symbol, artist Rodrigo Gonzalez: A round image with a stylized ballista in the center." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Matt Duval (he/him)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-01-enough-is-enough/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-01: Intro to the Year of Battle’s Spark–Enough is Enough</em></a></h1>
              <p>What a thrill and privilege for Shay Snow to ask me to write the season opener. Not only returning to Breachill and <em>Age of Ashes</em> but the start of hostilities between Andoran and Cheliax. I wanted to rise to that challenge and can’t thank my testers and Shay enough for their help!</p>
              <p>I poured over <em>Hellknight Hill </em>and added in as many callbacks as I could manage. The themes were no good wars and enough is enough so I worked to bring the town’s struggles and people to life while under occupation, caught between armies, and their local heroes elsewhere. There’s a fun bit of turnabout for the PCs to twist an old threat to their advantage in the book store and the fight against the twins is one of my favorite low-level challenges I’ve written. I tried to echo a bit of Tolkien and Elrond as Brackett reflects on the armies gathered in opposition to tyranny. Most of all, I want PCs of any level to feel they’re doing something heroic and important and there’s no shortage of opportunity to prove their bravery here against true villains and save innocents.</p>
              <p>I hope this was fun, because I also got to write the opener for the second season of SFS2, <em>The First Cut</em>! See you Beyond the Blood Door!</p>
              <p>I’m online on Bluesky at sleepyfelixthecat.bsky.social.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image right" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/30422e68-8691-4fe4-b97a-dcc6b2f60046/%20PZO160705_ValiCairne.png?w=400" alt="Vali Cairne, artist Josef Kucera: Vali Cairne stands confidently in her furred boots and colorful riding coat. Her hair is short and there are bird motifs on her coat." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Hilary Moon Murphy (she/her)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-02-shipyard-sabotage/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-02: Shipyard Sabotage</em></a><em> </em>&amp; <a href="https://store.paizo.com/pathfinder-society-scenario-7-22-the-handmaiden-s-gaze/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-22: The Handmaiden’s Gaze</em></a></h1>
              <p>Hello everyone! I’m Hilary Moon Murphy, aka Hmm (she/her). I wrote both <em>Pathfinder Society Scenario #7-02: Shipyard Sabotage</em> and <em>#7-22: The Handmaiden’s Gaze</em>. But rather than talk about my own journey with these scenarios, I would like to talk about the two unsung heroes who have made all of our adventures possible: our tireless former developers, Josh Foster and Shay Snow.</p>
              <p><em>The Handmaiden’s Gaze</em> was the first and only time I got a chance to work with Shay Snow, but partnering with them on this adventure was a delight. Shay helped me bring out the personalities of the devilish antagonists, and gave me constant insights. In addition, Josh worked with me on the handouts and helped me breathe life in Marcos’s Marauders.</p>
              <p>Do you love <em>Shipyard Sabotage</em>, with its crazy swinging pirate battles? Josh Foster leaned into all of the craziness that I proposed, and gave me the encouragement to make it wilder, louder and funnier. All of my best work came under his guidance.</p>
              <p>Developers are amazing people, and these two created together all of our metaplot, and the frameworks around which all of us authors created our adventures, and I cannot thank them enough for all the love and energy they gave to Organized Play. I will miss them terribly.</p>
              <p>Okay. One final plug that is just for me. If you like my work, please look for the <em>Tengus and Teapots</em> trilogy of scenarios on Paizo Infinite.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Jeremy Scott (he/him)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-03-a-foot-in-the-door/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-03: A Foot in the Door</em></a></h1>
              <p>Ahoy, Pathfinders! My name is Jay Scott (he/him), the author of Pathfinder Society Scenario #7-03: A Foot in the Door. It was both daunting and exciting to write an underwater adventure set in Iblydos, but imagining the adventure locations quickly became my favorite aspect of the writing process. I loved visualizing the shipwrecks, underwater ruins, and sea creatures that set the stage for the scenario. While I can’t pinpoint one media influence, hours of watching Aquaman cartoons on Saturday mornings surely crept into my subconscious. Where else could underwater telepathic communication come from?</p>
              <p>Of course, the scenario wouldn’t exist without the Paizo employees who bring us wonder, magic, and adventure every month. Thank you! You can learn more about me and my adventures @jayscottgm on Bluesky.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Chris Wasko (he/him)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-05-battle-of-the-thorns/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-05: Battle of the Thorns</em></a></h1>
              <p>My name is Chris Wasko (he/him) and I wrote <em>PFS2 #7-05: Battle of the Thorns</em>. Being a twin myself, I had a lot of fun building the backstory between the two sisters, thinking about what sorts of forces might put pressure on such a profound bond and giving GMs a lot of space to build those interactions at the table. Given the setting, I also explored the idea of using the divinely influenced environment as a vehicle for both storytelling and non-combat problem-solving, as well as leaning hard into mounted combat mechanics that, in my opinion, don't get enough screen time in most campaigns. I hope everyone enjoys this gloomy romp through Nidal!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image right" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6ed83876-2546-49c9-a9c5-34a21189efb3/Automaton_1000x1500.png?w=400" alt="A humanoid automaton with no facial features other than two wide red and yellow eyes. It clutches its hands near its chest, cradling a ball of light." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Letterio Mammoliti (he/him)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-11-the-darkness-within/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-11: The Darkness Within</em></a></h1>
              <p>Howdy! I am Letterio Mammoliti and I had a lot of fun writing <em>The Darkness Within</em>! I got to open the doors of the Dark Archive and fill it with unstable artifacts and cryptic sarcophagi just so a group of Pathfinders can make their way to retrieve the ruby asp. I had a lot of fun coming up with what (and who) was imprisoned in the Hall of Mechanical Works and how they could be freed from the unending hunger of the Oneirophage.</p>
              <p>The Dark Archive is a very unique location and exploring it was truly a lot of fun. I hope people enjoyed running it and experiencing it.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Adam Wright (he/him)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-16/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-16: A Star’s Journey</em></a></h1>
              <p>Hi, I’m Adam Wright (He/Him). Writing <em>Pathfinder Society Scenario #7-16: A Star’s Journey</em> was an incredible opportunity to jump into the canon of the <em>Year of Battle's Spark</em>. Working with established characters like Star and Venture-Captain Wulessa Yuul was a distinct honor and I was thrilled to have a hand in the scenario. My favorite part to design was the blend of ancient Jistkan architecture with dynamic puzzles. I was fascinated with the idea of the mysterious, the ancient, and technology beyond the player’s current understanding. I hope it becomes a great introduction for new players who want to further their adventures! I'd also like to thank the devs who worked on the scenario. They do incredible unseen work and make the adventures we get to play far better!</p>
              <p>In addition to my freelance work, I design indie gaming modules, comics, and write about all things TTRPG related. You can find more of my work, solo adventures, and articles on my Substack at <a href="https://insightchecknewsletter.substack.com/">https://insightchecknewsletter.substack.com/</a>. Or check out my independently created games at <a href="https://www.drivethrurpg.com/en/publisher/19725/Slick-Dungeon-Press">https://www.drivethrurpg.com/en/publisher/19725/Slick-Dungeon-Press</a>.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image right" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/4da1b734-c3bb-4c3a-95d0-57fe342bb716/PZO160720_Antiope_FINAL.png?w=400" alt="Antiope, artist Allan Santos da Silva: An elegantly dressed female minotaur looking fearful." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Allie Bustion (they/she)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-18-freedom-on-the-sea/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-18: Freedom on the Sea</em></a></h1>
              <p>Hey, I'm Allie Bustion, a Black nonbinary writer. By day, I write for video games about caped crusaders and supervillains; by evening, I contribute to tabletop games like <em>Pathfinder</em>, <em>Starfinder</em>, <em>Thirsty Sword Lesbians</em>, and <em>Blades '68</em>; and by night, I furiously scribble down fiction prose that trends towards weird, horror, and romance. I've been previously published in Tenebrous Press’ <em>Skull &amp; Laurel #4</em> and Neon Hemlock’s <em>Unfettered Hexes</em> and am currently self-publishing a paranormal horror romcom serial over at <a href="https://parapoly.gay">ParaPoly.gay</a>. Yes, that's really the link. It's probably too much writing, if we're being real honest. A genuine love of storytelling in all its forms and the emotions stories evoke keeps me going, from paranoid fear to soft gentle love. You’ll find me yapping about it on Bluesky (<a href="https://bsky.app/profile/did:plc:5ztgampnxitkgmhzvb3crsgh">@madpierrot.design</a>) probably.</p>
              <p>I'm the entire reason for everything happening in the <em>Pathfinder Society Scenario 7-18: Freedom on the Sea</em>. Congratulations on your new GMing mechanic to steal and/or sorry about that. But it's fine, there's a very evil woman AND a charming sea captain there too!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Zuriel Wilburn-White (he/him)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-18-freedom-on-the-sea/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-20: The Strings of Hell</em></a></h1>
              <p>Hi, everyone! My name is Zuriel Wilburn-White (he/him), and I had the opportunity to write <em>PFS2 #7-20: The Strings of Hell</em>. I’m a huge fan of large ancestries, so getting to write for a scenario featuring minotaurs was super exciting. I loved getting to add some new details to the contrast between their stony, gruff reputation and their vibrant, structured culture that might not always be seen by outsiders. Writing for this scenario was a great experience, so I’d like to give a huge shoutout to Paizo for the opportunity to do so and the guidance I received throughout the process.</p>
              <p>I’m not really one for social media, so nothing to plug at the moment. Looking forward to lots of upcoming content from Paizo and the many talented people they work with!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Carlos Cabrera (he/they)</h1>
              <h1><a href="https://store.paizo.com/pathfinder-society-scenario-7-21-the-home-of-empty-breath/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>PFS2 #7-21: The Home of Empty Breath</em></a></h1>
              <p>Hi there! I wrote <em>Pathfinder Society Scenario #7-21: The Home of Empty Breath</em> in the undead nation of Geb!</p>
              <p>We've seen Geb before in Society play in <em>Quest #12: Putrid Seeds</em>, so with my return I wanted to add a little something fun and unexpected. That was when I pitched the return of the Anaphexia.</p>
              <p>I have been an Anaphexian fan of them since first edition, and have been "dying" to use them ever since. With Geb's Dead Laws, forcing those who perish there to become mindless undead provided the perfect opportunity. Their ability to prevent the <em>talking corpse</em> spell prior to this transition made them the perfect mystery to layer on top of the original mystery of the scenario. I was so glad Paizo said yes.</p>
              <p>I hope I get to do more with the organization at some point, but for now you can find me on Bluesky @carlosatscg, or at Something Clever Games where you can reach me by email and see a catalog of my work. We are actively pitching my daughter's coin-flipping push your luck board game, Coronation, and are working on a public demo copy of our paid work on a Mega Man expansion to the Street Fighters Miniatures Game!</p>
              <p>Explore, report, cooperate, and stay alive!</p>
              <h3><a href="https://paizo.com/threads/rzs8qyy2?NEW-BLOG-Meet-the-Authors-Year-of-Battle-s">Join the conversation on the Paizo Forums!</a></h3>
             </div>
            </div>
           </div>
           <div class="sharing_widget" data-v-7a806b22>
