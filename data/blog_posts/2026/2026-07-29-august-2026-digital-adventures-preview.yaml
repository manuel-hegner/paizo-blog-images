           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Hello, ‘Finders!</p>
              <p>August is fast approaching and that means we have a lot of exciting new scenarios on the horizon, so buckle up and let’s dive right in!</p>
              <h1>Starfinder Society</h1>
              <p>The Starfinder Society begins its second season: <strong>Beyond the Blood Door</strong>!</p>
              <p>Absalom Station needs heroes!</p>
              <p>A mysterious transmission broadcast to every screen and comm unit across Absalom Station heralds a magical attack on the streets of the station itself. As roiling red spheres rain blood on the streets, spawning violent monsters with every drop that falls, panic grips the populace and soon, it’s the people who bleed.</p>
              <p>Absalom Station is under attack and it’s up to you to battle bloodspawned beasts to put a stop to it! But as the dust settles and the blood dries, it’s clear this strange attack was a part of something greater. Someone wants to make Absalom Station bleed…</p>
              <p><a href="https://store.paizo.com/starfinder-society-scenario-2-01-the-first-cut/"><em>Starfinder Society Scenario #2-01: The First Cut</em></a> is an adventure for 1st- through 2nd-level characters written by Matt Duval. This is the first scenario in the brand new Beyond the Blood Door metaplot.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/2d1fce33-a21b-4505-813d-78f09636a78d/PZO260201_BLOODSPAWNEDHOUND.png?w=600" alt="Illustration by Tom Ventre: A canine monster made of blood, bone, and muscle snarls at the viewer, baring the teeth in its trefoil maw." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Tom Ventre</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>A distant celestial body, Protostar-Vast-9312, is approaching the next phase of its cycle—the dramatic transformation into a fully-fledged star! The solar flareup is incredibly rare, making it a valuable learning opportunity for scientific organizations in the Pact Worlds. The Deep Cultures Institute built an observatory to record the event with the most sensitive, cutting-edge magitech equipment possible, and have invited their allies and colleagues to join them.</p>
              <p>The Starfinder Society is among those invited to attend! It’s time to put on some sunglasses, calibrate those scientific devices, mingle with fellow attendees, and pilot that starship into the Vast for this once-in-a-lifetime stellar show!</p>
              <p><a href="https://store.paizo.com/starfinder-society-scenario-2-02-solar-shakeup/"><em>Starfinder Society Scenario #2-02: Solar Shake Up</em></a> is an adventure for 1st- through 2nd-level characters written by Sam W Tennyson.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/95136d15-4f81-42f1-aef9-f4a1ba82690c/PZO260202_BJOVRISHE_1200x1500.png?w=500" alt="Illustration by Bruno Cesar: A maraquoi scientist with brown fur grown long on their head and pulled into a messy bun, grins brightly. They look scholarly, and wear a blazer over a collared shirt and cozy sweater, alongside a variety of jewelry" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Bruno Cesar</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Stellar Sweets is a mainstay of the Drifter’s End district of Absalom Station, an independent chocolatier, confectionary, and tourist attraction owned by the overly eccentric Sweetie. Unfortunately, Sweetie’s recent passing has caused a rift to form between Sweetie’s talented protégés, as these culinary geniuses compete for control of Stellar Sweets. Soon, cotton candy explosions, caramel floods, and roving clouds of sticky sugar spread beyond the factory’s walls, and animated chocolate squoxes terrorize the populace. While the nearby residents have tried to be patient, they’ve hit their wits end and are calling for the closure of Stellar Sweets. Explore this strange candy factory and mend the rift between Sweetie’s rival protégés before Stellar Sweets is forced to close for good!</p>
              <p><a href="https://store.paizo.com/starfinder-society-scenario-2-03-bittersweet/"><em>Starfinder Society Scenario #2-03: Bittersweet</em></a><em> </em>is an adventure for 1st- through 2nd-level characters written by Brent Bowser.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/1a20825f-3f4f-498a-9682-b453e37b1669/PZO260203_VulkarisuHelper_1500.png?w=500" alt="Illustration by Allan Santos Da Silva: An adorable vulkarisu wearing a fitted vest and hat grins. Their fur orange is speckled with sprinkles. A vulkarisu is an intelligent squox; a mix between a fox and a squirrel." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Allan Santos Da Silva</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Finally, we’re launching a rescue mission to the mysterious region of space known to the Pact Worlds as Kazmurg’s Absurdity, or simply “the Absurdity.” This part of space is notoriously difficult to find and navigate because it’s quite literally broken by magic. Getting around requires knowing where you’re going or possessing a physical or virtual map of the place. Recently the Starfinder Society acquired a map of a solitary world in the Absurdity called Oamnil. Initial surveys of this gas giant have already been completed, with the Starfinders discovering numerous moons orbiting the world, all riddled with Acsie ruins.</p>
              <p><br></p>
              <p>The Starfinder Society partnered with esteemed local explorer, Greffgo, to scout the ruins on one of these moons. Unfortunately, Greffgo never reported back in. Driven by the worries of an eccentric diviner, a team of Starfinders follow the flight path and exploration route of this lost colleague, with the goal of finding him or at least uncovering evidence of his fate.</p>
              <p><br></p>
              <p>Fun fact: we briefly considered calling this scenario “The Hot Springs Episode.”</p>
              <p><br></p>
              <p><a href="https://store.paizo.com/starfinder-society-scenario-2-04-a-watery-grave/"><em>Starfinder Society Scenario #2-04: A Watery Grave</em></a> is an adventure for 3rd- through 4th-level characters written by Jenny Jarzabski.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/09e06948-63c8-41f6-85b9-d1e220cd78ef/PZO260204_GREFFGO_1500x1200.png?w=600" alt="Greffgo, Illustration by Victor Pereira: A crab-like alien raises its claws. It wears a wide-brimmed hat, explorer’s equipment, and has binoculars hanging around its neck." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Victor Pereira</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Pathfinder Society</h1>
              <p>The Pathfinder Society begins its eighth season: <strong>The Year of Clockwork Mystery</strong>!</p>
              <p>Recently, the Pathfinders located a strange artifact in an Azlanti temple: the <em>clockwork compass</em>. This artifact is shaped as a normal compass, however it has four empty slots that look as though they'd fit a number of different aeon stones. Sorrina Westyr, the master of spells in the Pathfinder Society, calls on a team of Pathfinders to help her with some experiments. But of course, as it's a Pathfinder experiment, nothing ever goes as it seems!</p>
              <p><a href="https://store.paizo.com/pathfinder-society-intro-year-of-clockwork-mystery/"><em>Pathfinder Society Scenario #8-01: Intro: Year of Clockwork Mystery</em></a> is an adventure for 1st- through 2nd-level characters written by Kim Frandsen.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/91de2271-3200-4c50-9149-41344efd5883/PZO160715-CLOCKWORK_COMPASS.png?w=400" alt="Illustration by Josef Kučera: a clockwork compass with a glass dome over its face and four empty stone slots" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d0d5c425-e090-44ef-ad75-4d4af8fec774/PZO160801_Ella.png?w=400" alt="Ella, artist Allan Santos Da Silva: This ghost of a halfling girl wears her hair in a long braid and looks very sad and worried. She wears a wayfinder on her hip alongside a number of glass vials." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Left to right, illustrations by Josef Kucera and Allan Santos Da Silva</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>The island nation of Bhopan was liberated from fey tyranny by the Pathfinder Society nearly a decade ago. Now, this island is threatened again—this time by the Thane, a fey monarch of great power. The Thane was amused by the antics of a team of Pathfinders at one of their recent celebrations, and has decided to see how entertaining the group can be. To that end, the Thane has challenged the Pathfinder Society to a game, with the fate of Bhopan hanging in the balance. You’ll need to pass the Thane’s tests and overcome fey trickery to save the day. What fun!</p>
              <p><a href="https://store.paizo.com/pathfinder-society-scenario-8-02-the-fey-reclamation/"><em>Pathfinder Society Scenario #8-02: The Fey Reclamation</em></a> is an adventure for 3rd- through 4th-level characters written by Lucas Servideo.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/b8bdebed-1de4-45c9-8ab0-a7ca7050af42/PZO160802_TheThane.png?w=400" alt="The Thane, artist Arthur Henrique Olivera Silva: this androgynous fey monarch wears regal blue-green robes and carries themselves with an air of superiority and condescension. They have antlers, elf-like pointed ears, and shoulder-length wavy black hair" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Arthur Henrique Olivera Silva</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Within the Foreign Quarter of Absalom, the Solstice Amphitheatre stood tall, welcoming performers and guests alike to popular plays, operas, and other fascinating performances, all centered around their beautiful leading lady. However, when the theater fell on hard times and eventually closed, the actress never left her place, continuing to perform to empty seats and silent crowds. The locals came to avoid the theater, especially after her death, but now new disappearances have prompted the Pathfinder Society to investigate and see what remains of the Solstice's former glory.</p>
              <p><a href="https://store.paizo.com/pathfinder-society-scenario-8-03-for-the-love-of-vanity/"><em>Pathfinder Society Scenario #8-03: For the Love of Vanity</em></a> is an adventure for 5th- through 6th-level characters written by David Schwartz.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/200bee73-3bd4-41d2-bbcb-9d5b09c46f96/PZO160803_GiselaPortrait.png?w=400" alt="Gisela Portrait, artist Lucas Fernando: A framed portrait of an actress wearing an elaborate powdered wig and white gown. She looks incredibly vain and proud, with hard eyes and a pinched mouth. The portrait’s frame is fancy but covered in dust." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Lucas Fernando</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>With the fall of Runelord Belimarius, ruler of the New Thassiolonian city of Xin-Edasseril, relics from ancient Thassilon have found their way onto black markets throughout the Saga Lands. Much of this trade is centered in Riddleport. The Pathfinder Society is doing what it can to obtain, catalogue, and preserve these relics, and has amassed quite the stockpile in a warehouse within the city. This makes for an irresistible target for a crew of enterprising pirates! It's up to you to keep these treasures safe!</p>
              <p><a href="https://store.paizo.com/pathfinder-society-scenario-8-04-a-theft-in-riddleport/"><em>Pathfinder Society Scenario #8-04: A Theft in Riddleport</em></a> is an adventure for 1st- through 2nd-level characters written by Kate Tremaine.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/bfc99202-10d2-434f-9fdb-e823b5feab06/PZO160804_CaptainRedcapErtztoff.png?w=400" alt="Captain Redcap Ertztoff, artist Fabio Di Bernardi: A balding pirate captain with a bright fringe of orange-red hair wears his dirty pirate coat unbuttoned, revealing a bare, muscular chest riddled with scars and a skull necklace. He looks confident and mean." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustartion by Fabio Di Bernardi</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Multi-Table Interactive Specials</h1>
              <p>We’ve also got two new multi-table interactive specials hitting gaming tables next month and they’re both going BIG!</p>
              <p>Ever since the legendary end to the monumental conflict that was the Great Kaiju War, the kaijus Zimibra the Coiling Death and Yorak the Horned Thunder have dwelled beneath the Shanguang Desert. Whenever Zimibra stirs in her slumber and Yorak leaps to her protection, the duo wreak havoc that takes decades to recover from. Stories of their rampages and the signs of their waking are passed on through generations by the nomadic Mutabi-qi tribes.</p>
              <p>Now, without any warning, a Mutabi-qi settlement is mysteriously leveled, Zimibra is missing, and there’s been a suspicious uptick in cult activity in the region. Amara Li, venture-captain of the Lantern Lodge in Tian Xia, gathers Pathfinder agents from across Golarion to investigate these intertwined mysteries.</p>
              <p><a href="https://store.paizo.com/pathfinder-society-special-7-99-the-kaiju-crisis/"><em>Pathfinder Society Special #7-99: Kaiju Crisi</em></a><a href="https://store.paizo.com/pathfinder-society-special-7-99-the-kaiju-crisis/">s</a> is a multi-table interactive special for 1st- through 8th-level characters written by Rigby Bendele.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/61a4c136-5223-4936-92dc-3d95b3fffd9e/PZO160799_Zimibra.png?w=500" alt="Zimibra, artist Fabio Di Bernardi: This enormous, centipede-like kaiju is poised coiled like a spring. It has a monstrous face with sharp fangs and a mane of white fur, a carapace slick with venom and dotted by tufts of white and purple fur." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Fabio Di Bernardi</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>So… what’s bigger than a kaiju?</p>
              <p>When an unexplored jungle moon scheduled for exploration disappeared without a trace, the Starfinder Society took notice. Their analysts examined the shattered remains of moons and echoes of gravitational wells, and soon Fitch, captain of the Society flagship <em>Master of Stars</em>, launched a formal investigation. Her field agents pored through countless distress signals dispatched by vanished starships, contacted Xenowardens worried over the sudden disappearance of entire oma pods, and interviewed priests from the church of Triune reconstructing a Drift beacon which had been inexplicably destroyed. From these disparate threads, Fitch wove a theory: someone has created a new superweapon capable of literally destroying worlds, and was testing it across the cosmos. What’s more, she identified this weapon’s unique magical signature—a strange mix of extra-planar energy, fiendish taint, and the kind of magitech code typically seen in Drift beacons.</p>
              <p><a href="https://store.paizo.com/starfinder-society-special-2-00-moon-busters/"><em>Starfinder Society Scenario #2-00: Moon Busters</em></a> is a multi-table interactive special for 1st- through 4th-level characters written by Michael Bramnik.</p>
              <h3><a href="https://paizo.com/threads/rzs8hwk2?NEW-BLOG-Organized-Play-Scenario-Previews">Excited for the new seasons? Join the conversation on the Paizo Forums!</a></h3>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6747344c-65a1-4205-bd2d-31db0a6dfa70/PZO260200_GARAKO_FIENDISHMOON_1500.png?w=500" alt="Garako Fiendish Moon, artist Fabio Rodrigues: A rocky moon is marred by lava seams. It opens along one seam, revealing a molten core and a ring of iron protrusions suspiciously like teeth…" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Fabio Rodrigues</p>
              </figcaption>
             </figure>
