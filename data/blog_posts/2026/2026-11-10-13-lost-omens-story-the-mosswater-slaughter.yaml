           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Unlocked at $350,000, 13 Lost Omens is a crossover zine that brings the horrors of 13 Omens to Golarion in two ways: a bestiary of 13 Omens creatures with stats for Pathfinder Second Edition <em>and </em>a new 13 Omens Story set in Golarion, the setting of Pathfinder!</p>
              <p>Thurston Hillman, author of <em>The Mosswater Slaughter—A 13 Omens Story, </em>shares some background on this crossover adventure!</p>
              <p>FINALLY, my murder adventure comes to light!</p>
              <p>A bit of history on this recently reached story. I’ve long been a fan of special games to run at conventions, inspired by the likes of Wes Schneider’s Bastardhall games at the PaizoCons of old. I took this to heart and when Starfinder first released, I put together a loose series of adventures called “The Perplexity” that I could run at events across the world. Later, these would become some fun bonus content for Paizo’s Organized Play program.</p>
              <p>But I needed something to run for Pathfinder… and for the longest time, I had this idea for an adventure, but I realized if I ran it, the characters would all die a terrible, terrible death.</p>
              <p><em>That</em> is the genesis for our recently announced new 13 Omens Pathfinder Story: The Mosswater Slaughter!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/91c375c7-00d2-433a-ae83-40cf21131216/13LostOmens_MockUp.jpg" alt="13 Omens: 13 Lost Omens. A 13 omens and pathfinder crossover. Pathfinder iconic wizard, Ezren, a grey haired human, looks into a dark crypt while a misty red skeleton floats ominously behind him." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Years ago, I was taken by the simple one-page description of the town of Mosswater from the <a href="https://store.paizo.com/pathfinder-chronicles-guide-to-the-river-kingdoms-pfrpg-pdf/"><em>Pathfinder Chronicles: Guide to the River Kingdoms</em></a>, which told the story of a quaint River Kingdoms fishing village on the borders of a lake that had some unique alchemical compounds. The village was full of competing merchants growing off the dye-trade… until 4664 AR, when the ogres moved in!</p>
              <p>Since reading that snippet, I had always wanted to tell the story of a group of players taking on the role of merchants* who spent the early parts of the adventure competing with one another for who could be the best merchants in Mosswater. Then, halfway through the game, the ogre family moves in and the level 0 characters have to survive against a bunch of hulking level 3+ monsters who’ve come to end them. It combined a fun social element with the macabre horror of movies like The Hills Have Eyes.</p>
              <p>Alas, I always ran into the conceptual problem that “some players are going to try to fight the evil, because they’ll assume I statted this adventure out for them to win.” This kept me pinned from writing the adventure, as it just never felt like the power fantasy of Pathfinder’s system worked for a story about small-scale squabbles leading into a desperate fight for survival.</p>
              <p>Then came 13 Omens, a perfect RPG for this type of story!</p>
              <p>Since the first day of 13 Omens, I’ve been wanting to write my Mosswater-based adventure as a 13 Omens story. It’s changed since years ago when I first drafted the adventure concept, with the final story taking some unexpected turns that will surely be a fascinating read to those who’ve followed Pathfinder for years—there might be something <em>worse</em> than ogres accosting Mosswater. Thanks to the ongoing support from our fans, I finally get to make this adventure and showcase it for the world to see. I couldn’t be more grateful for the opportunity.</p>
              <p>Though, now I’m going to have to decide on a NEW convention-only 13 Omens story to work on…</p>
              <p><strong>Thurston Hillman</strong><br><em><strong>Associate Publisher</strong></em></p>
             </div>
            </div>
