           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>There have been a few moments over the past twelve years of playing in front of the community, where the raw nature of “actual, actual play” has been on full display. This was one of them.</p>
              <p>Our party, The Aroden 5, suffered a Total Party Kill in the Test of Aroden.&nbsp;&nbsp;</p>
              <p>We’ll painfully relive it for you, but get caught up first if you need to:</p>
              <ul>
               <li><a href="https://paizo.com/blog/the-dead-god-s-deliverance">Introduction</a></li>
               <li><a href="https://paizo.com/blog/the-dead-god-s-deliverance-part-1">Part 1</a></li>
               <li><a href="https://paizo.com/blog/the-dead-god-s-deliverance-part-2">Part 2</a></li>
              </ul>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/a48ae838-4809-4d83-bdbf-8e0ff690b749/OoTAD_Continuation_WholeMap.jpg" alt="A man lounging on the floor next to a spread of multiple flip-mats making up the layout of an entire adventure dungeon" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>This was our final playthrough session, and it’s hard to describe how much anticipation and nostalgia exist during the ending of our Paizo blog projects. No two rosters are the same, and some players may not join each other at the table for years after. For this final session, we dialed up two prospective Order of the Amber Die members to take the roles of live-NPCs that we had befriended during the adventure. The first was Blostin, a blacksmith we met during our time in captivity. The other was Heinrich, henceforth known as “hard luck Heinrich,” whom we had initially found dead and <em>raised</em> him to join us.</p>
              <p>By now, we had escaped from our hryngar captors, delved the tomb of one of our church’s saints, and ventured into the lost Sanctum of Aroden. It was there that we placed our hands upon the replica of the Starstone and began the Test of Aroden. Our characters were built for this: All five of us were human, all five worshiped Aroden, and all five wielded the weapon of our lord. This test was a chance to prove that our party, The Aroden 5, were the ones capable of connecting with our dead god and bringing about his deliverance</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Highlights from <em>The Dead God’s Hand</em>:</h2>
              <p>□ With several teachers at our table, we were apprehensively wondering if the Test of Aroden had a rubric. If it did, we were about to flip the tables and test the rubric. As we relived scenes from Aroden’s life, we had to make the correct choices and overcome challenges that the Last Azlanti had experienced during his time. If we failed and some of us perished, we thankfully reawakened in the next scene. As you read below, you’ll see why we asked our GM: How many points off is it per character death, exactly?</p>
              <p>□ To pass one section of the Test, we had to infiltrate a fort and perform a daring rescue as Aroden had once done. We came up with a plan that involved splitting the party; don’t throw absolutes at us like “never split the party,” we’ve done it before when infiltrating a fort and achieved <a href="https://paizo.com/blog/giantslayer-marathon-part-2">victory</a>. This time, we used <em>invisibility potions</em> to cover our approach, but didn’t account for our armored characters being extra noisy on top of noisy. Though the plan failed and provoked a massive fight with a mirage dragon and its evil allies, the plan was still sound.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/24fb2b42-52d7-498a-b003-36f74eb9a8c6/OoTAD_Continuation_MirageDragon.jpg" alt="A close up image of players miniatures in a dungeon battling a mirage dragon" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>□ Remember the last blog, when we said to keep in mind the relatively innocent sword our commander found, called “<em>Meloth’s Lifedrinker</em>?” Well, there were consequences for taking it. In that same tough fight versus the mirage dragon, our friend Blostin found himself near death. Before we could get to him, we watched as our commander pointed the sword at Blostin – obviously a silent directive to try and reach him. Instead, the sword activated itself somehow, and our blacksmith friend was devoured by hundreds of unseen mouths in a horrific scene. It’s okay though, the sword devoured two enemies (and another PC) in a similar manner over the next couple of days. Would you keep the blade, or make your companion get rid of it?</p>
              <p>□ Déjà vu. Remember when we mentioned that gem we took from the tomb, known as the “<em>Heart of Sarnax</em>?” Well, there were consequences for taking it. While visiting with high priest Sarnax on his <em>ether ship</em> during one of the Test’s interludes, the heart spawned a giant ruby-like construct, a parody of the cleric that had a singular goal: the destruction of Sarnax. When the unholy construct dealt 56 damage to Cassiel with a backswing, we weren’t sure if we could stop it from getting to Sarnax – or what terrible event would happen if it did. In a controversial decision designed to test the bounds of the Test itself, our commander threw high priest Sarnax overboard from the <em>ether ship</em>, possibly to his death in the Great Beyond. Our grade probably dropped a bit, but at least it prevented the heart construct from killing Sarnax.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>The Deliverance</h2>
              <p>We entered this adventure with the optimistic goal of bringing our Lord Aroden back, or even to learn how we might enable his return in some way. Instead, we discovered the bygone Test of Aroden and ended up getting to walk in our god’s path, reliving some of the most important moments that shaped his life. Even devout worshippers such as us wouldn’t have thought this was even possible. While the <em>The Dead God’s Hand </em>is an adventure packed with powerful loot, the real treasures to be found are the lore and experiences you’ll walk away with. &nbsp;</p>
              <p>As Pathfinder fans, knowing about Earthfall is just part of understanding Golarion. Did you ever think you’d experience Earthfall, though? The final part of the Test of Aroden put us there. This was something we’d only seen in the Pathfinder Comics or caught the aftereffects during <a href="https://paizo.com/blog/order-of-the-amber-die-mdash-the-azlant-odyssey-part-3">The Azlant Odyssey</a>. Now we were standing in the throne room of ancient Azlant with the cataclysm mere moments away, when Aroden had to decide who to bequeath his legendary sword, the <em>Azlanti Diamond</em> upon. Just when we had chosen who should get the sword and therefore the throne – Earthfall began. Gotta admit, we were torn between an in-game need to run like heck, and an out-of-game desire to just stand there and take it all in.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/2693fe63-f6f8-4bde-8c24-d3742cbfa033/OoTAD_Continuation_ThroneRoomWarm.jpg?w=550" alt="Miniatures set up to resemble a throne room. Pillars line the walls and a green, glass-like throne sits empty on a dias." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/671dad04-e96e-4faa-a26f-2d1b9e398880/OoTAD_Continuation_ThroneBattle.jpg?w=550" alt="A set of miniatures set up to resemble a throne room, with a green glass throne up on a dias. The adventurers are surrounded by large eel-like monsters" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><strong>Character Deaths:</strong></h2>
              <p>□ We said we’d talk about this, but it’s not easy. Twelve was the number of deaths, tying our second-highest tally in a marathon session since <a href="https://paizo.com/blog/order-of-the-amber-die-mdash-the-strange-aeons-experiment-part-5">2017</a>. Seven deaths were part of the TPK caused by fighting the mirage dragon and too many of its allies at once, we should have taken the opportunity to fight them separately. Four deaths happened during Earthfall, with the best being our exemplar decapitated by falling throneglass. The last was Heinrich, <a href="https://www.youtube.com/shorts/r0VQqjMDHUY">again</a>, killed by <em>Meloth’s Lifedrinker</em> – bringing his personal total to four deaths in the same adventure. As for the TPK, it does hurt, but we make decisions as a team, we win or lose as a team, and we bounce back as a team.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><strong>Best Quote from Marathon 3:</strong></h2>
              <p>(inside the crumbling throne room of ancient Azlant)<br>
                Adam: “16 Will save? You’re <em>confused</em>.”<br>
                Matt: “I’m confused during the worst time in history, Earthfall.”<br>
                Shan: “All of the scholars would objectively agree.”</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/94d5bb3b-e727-458d-a915-9f3201580dc7/OoTAD_Continuation_TableGameplay3.jpg" alt="Two players sit at a game table, the man on the left is reaching forward to move miniatures sitting on a flip-mat at the cente rof the table." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><strong>The Ending:</strong></h2>
              <p>We finished the Test of Aroden without knowing our final grade. We found ourselves back in the Sanctum of Aroden, now able to approach the statue of the god of humanity that featured so heavily in the lore we had discovered. Our pilgrimage was at its end. For years, our characters had been searching for a way to reach our lord, to restore him – his deliverance was now right in front of us. If the legend was true, touching the hand of the statue would grant us an audience with Aroden himself…</p>
              <p><em>“Nothing. Nothing happens at all. The dead god’s hand is cold. His ancient wisdom without a voice.”<br></em>--Erik Mona</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><strong>More Content:</strong></h2>
              <p><a href="http://bluetablepainting.com/">Blue Table Painting</a> provided the excellent paintwork for the miniatures of The Aroden 5. For custom adventure-specific terrain/miniatures, that’s the handiwork of <a href="https://www.blackbardstudios.com/">Black Bard Studios</a>.</p>
