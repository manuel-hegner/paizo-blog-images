             <h1 data-v-7a806b22>
              <p>Iconic Encounter: An Exchange of Words</p></h1>
             <div class="byline" data-v-7a806b22>
              <a href="/blog/author/LuisLoza" title="More blog posts by Luis Loza" class="name" data-v-7a806b22>Luis Loza</a><span class="postDate" data-v-7a806b22> - Yesterday, 05:00 pm</span>
