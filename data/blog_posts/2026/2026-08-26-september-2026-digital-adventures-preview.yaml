           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Hello, ‘Finders!</p>
              <p>GenCon is over, summer is coming to a close, fall is fast approaching, and I’m left wondering: where has the time gone?! Time loops and reality warping aside, we’ve got four new digital adventures for you this month, including new entries in both Beyond the Blood Door and Year of Clockwork Mysteries. Let’s dive right in!</p>
              <h1>Starfinder Society</h1>
              <p>The recent magical attack against Absalom Station was heralded by a threatening but garbled transmission broadcast across the entire station. Determined to identify the mastermind of this attack, the Starfinders visit the district of Synthhaven to consult the hacktivist collective Syzygy. Enter a virtual recreation of this glitching broadcast while hackers work externally to repair and restore the corrupted file. What secrets will this high-tech team-up uncover?</p>
              <p><a href="https://store.paizo.com/starfinder-society-scenario-2-05-file-corrupted/"><em>Starfinder Society Scenario #2-05: File Corrupted</em></a> is a Beyond the Blood Door metaplot scenario for 1st- through 2nd- level characters written by Derry Luttrell.</p>
              <p><br></p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/0e8d7430-de85-4049-a588-8d181e32e6da/PZO260205_Nobody.png?w=400" alt="Nobody, artist Fabio Di Bernardi: An android with dull gray skin, an artificial glowing eye, and a respirator mask is dressed all in black, with their hood pulled low to obscure their face." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e975eb1e-e4e0-4b93-bb99-398d90a0bca3/PZO260206_PyetPawnBroker.png?w=400" alt="Pyet Pawn Broker, artist Arthur Henrique Olivera Silva: A male pahtra merchant with a wavy mane smiles slyly. They wear fine clothes and have speckled fur." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Left to right: illustrations by Fabio Di Bernardi and Arthur Henrique Olivera Silva.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>As the Starfinder Society continues to investigate the recent magical attack against Absalom Station, they discover a troublesome coincidence: a Starfinder agent used the chaos of the attack as cover to steal a valuable relic from First Seeker Ilyastre Memorial Museum. Believing this traitorous Starfinder, Brelomari, had foreknowledge of the attack, Venture-Captain Arvin tasks a team of Starfinders with investigating the theft, retrieving the stolen relic, tracking down Brelomari, and uncovering what connection she has to the attack’s perpetrators.</p>
              <p><a href="https://store.paizo.com/starfinder-society-scenario-2-06-an-inside-job/"><em>Starfinder Society Scenario #2-06: An Inside Job</em></a> is a Beyond the Blood Door metaplot scenario for 1st- through 2nd- level characters written by Tineke Bolleman.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Pathfinder Society</h1>
              <p>A recent ally of the Pathfinder Society has called upon some junior Pathfinders for assistance: help xem get xir treasure back from an old enemy! As the Pathfinders travel into a marsh-ridden island to infiltrate an old tavern, they'll be met with creepy crawlies, leaping lizards, and a smoking gun! It's up to them to confront the tengu pirate Blunderbuss and show him how the Society treats their friends!</p>
              <p><a href="https://store.paizo.com/pathfinder-society-scenario-8-05-a-sharks-guide-to-piracy/"><em>Pathfinder Society Scenario #8-05: A Shark’s Guide to Piracy</em></a> is an adventure for 1st- through 2nd-level characters written by John Curtin.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/aaff0347-9aea-4f3c-abeb-190215a34e87/PZO160805_Blunderbuss.png?w=400" alt="Blunderbuss, artist Felipe Felipe Carneiro: A barrel-chested tengu pirate with their arms crossed and two flintlock pistols holstered at their side. They have gray feathers and wear a lot of jewelry." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/4e0a0829-5fe5-428f-a7a7-26173270288d/PZO160806_Rannek.png?w=400" alt="Rannek, artist Allan Santos da Silva: A muscular man stands with his fists raised, ready to fight. He’s topless, with bronze skin veined with glowing streaks of copper. His reddish-brown hair is cropped short and spiky, and he looks both confident and serious." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Left to right: illustrations by Felipe Felipe Carneiro and Allan Santos da Silva.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Within the bowels of Starfall, the capital city of tech-centered Numeria, a member of the fallen Technic League has reached out to the Pathfinder Society with information about clockwork magic and how it may relate to the mysterious artifact discovered last year within an abandoned Azlanti temple. In the middle of negotiating her escape from Numeria, the scientist goes silent, leaving her contacts worried. It's up to the Pathfinders to delve into the seedy underbelly of Starfall and find out what happened to her!</p>
              <p><a href="https://store.paizo.com/pathfinder-society-scenario-8-06-falling-sparks/"><em>Pathfinder Society Scenario #8-06: Falling Sparks</em></a> is a Year of Clockwork Mystery metaplot scenario for 5th- through 6th-level characters written by Solomon St. John.</p>
              <p>That’s all from me this month. Take care of each other out there, ‘Finders!</p>
              <p><strong>Jessica Catalan<br></strong><em>Senior Developer</em></p>
