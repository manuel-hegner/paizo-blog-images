  \          <div class=\"blog__paragraph\" data-v-a2f23fca data-v-7a806b22>\n   \
  \        <div class=\"blog__paragraph__text\" data-v-a2f23fca>\n            <p>Last\
  \ week, both Paizo and the Archives of Nethys released statements concerning the\
  \ end of our commercial license agreement. These statements were met with an outpouring\
  \ of community confusion, concern, and displeasure; that sentiment has been heard\
  \ on all sides.</p>\n            <p>Over the past several days, we have continued\
  \ conversations regarding the relationship between Paizo and the Archives of Nethys.\
  \ Together, we’ve reached a solution that meets the needs of both teams and preserves\
  \ the stability of this essential community resource.</p>\n            <p>There\
  \ will be changes to the Archives of Nethys moving forward, but these changes will\
  \ not fundamentally disrupt the functionality of the Archives of Nethys:</p>\n \
  \           <ul>\n             <li>The Archives of Nethys will remain an official\
  \ rules archive for Pathfinder and Starfinder.</li>\n             <li>Paizo’s new\
  \ agreement with the Archives of Nethys is much less formal than a commercial license,\
  \ which reduces oversight and work on Paizo’s side and eliminates the need for the\
  \ Archives of Nethys to report royalties.</li>\n             <li>Paizo and the Archives\
  \ of Nethys have agreed that any art not included in the Community Use Policy license\
  \ will be removed from the Archives of Nethys’ webpages by the end of today, July\
  \ 24. \n              <ul>\n               <li>Paizo plans to release more art into\
  \ the <a href=\"https://paizo.com/licenses/communityuse\">Community Use Policy</a>\
  \ (CUP) soon, thus also expanding the Archives of Nethys’ art resources, as well\
  \ as those of other CUP creators.</li>\n              </ul></li>\n             <li>The\
  \ Archives of Nethys will continue to receive PDFs in advance of street date, on\
  \ the same schedule as Paizo employees and freelance contributors. This is not as\
  \ early as the full printer files the Archives of Nethys used to receive, but the\
  \ Archives of Nethys team is optimistic they can continue releasing new content\
  \ with minimal delays.</li>\n             <li>The Archives of Nethys will continue\
  \ to host the original Pathfinder First Edition PRD (<a href=\"https://legacy.aonprd.com\"\
  >legacy.aonprd.com</a>) for Paizo.</li>\n             <li>Lore and flavor text changes\
  \ on the Archives of Nethys that are required under the Community Use Policy are\
  \ expected to be minimal, if any are required at all.</li>\n            </ul>\n\
  \            <p>“The Archives of Nethys is a vital resource for the Paizo community,\
  \ and we are ready to support the volunteer team through these changes,” said Jim\
  \ Butler, Paizo’s CEO. “Open access to our games has always been a core tenet of\
  \ Paizo and will remain so. We value the dedication of the Archives of Nethys volunteer\
  \ team and are committed to supporting their work.”</p>\n            <p>“Thank you\
  \ to the community for your amazing enthusiasm and support during this adjustment,”\
  \ said Blake Davis, owner of the Archives of Nethys. “We hope that this agreement\
  \ will allow the Archives of Nethys to continue supporting the Pathfinder and Starfinder\
  \ communities for years to come.\"</p>\n            <p>Both Paizo and the Archives\
  \ of Nethys are committed to maintaining this community resource and adjusting to\
  \ ensure Pathfinder and Starfinder’s rulesets remain free and easy to access.</p>\n\
  \            <p>Game on!</p>\n            <p><strong>Jim Butler</strong><br><em>CEO,\
  \ Paizo Inc.</em></p>\n            <p><strong>Blake Davis</strong><br><em>Owner,\
  \ the Archives of Nethys</em></p>\n            <h3><a href=\"https://paizo.com/threads/rzs8ihe1?NEW-BLOG-Paizo-Archives-of-Nethys-Moving\"\
  >Join the conversation on the Paizo Forums</a></h3>\n           </div>\n       \
