           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Hail and well met, ‘Finders! This month’s new releases delve into the secrets of the dead god Aroden and beg for the favor of the gods that yet live!</p>
              <p>Never miss a release with our <a href="https://store.paizo.com/subscriptions">Paizo Subscriptions</a>—for everything from rulebooks to accessories! Subscribers get a free PDF with purchase, early access to game content, and exclusive discounts for members with 4 or more active subscriptions.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image above" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/ee2d0525-7bfc-4186-b6c5-fbd22919532c/PZO14007-HC_TheDeadGodsHand.png?w=350" alt="Pathfinder Second Edition The Dead God's Hand: Iconics Seoni the sorcerer, Valeros the fighter, and Merisiel the rogue are backed up against a store mural of a giant eye. A shadowed hand reaches towards them from the foreground " data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/27a03778-c00f-47be-b7eb-213de5d2f5c4/PZO14007-SE_TheDeadGodsHand.png?w=350" alt="Pathfinder Second Edition The Dead God's Hand Special Edition. An orange leatherette color with gold embossed text" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-adventure-the-dead-god-s-hand/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Adventure The Dead God’s Hand</a></h2>
              <p><strong>TAKE DESTINY BY THE HAND!</strong></p>
              <p>You’ve spent days, perhaps weeks, as prisoners in a mysterious dungeon, toiling at digging out ancient ruins for cruel cultists of the god of toil. But now, you’ve thrown off those shackles, only to stumble into an ancient dungeon whose unexplored halls hold secrets about the very nature of the Age of Lost Omens. Will you uncover the mysteries hidden beyond the Dead God’s Hand? Or will you become the latest victims of an ancient legacy?&nbsp;</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/a7e6d232-a386-460c-b14c-6e83f060bb72/PZO11042-FM_DeadGodsHandMulti-Pack.png?w=300" alt="Pathfinder Second Edition Flip Mat: The Dead God's Hand Multi-Pack" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3><a href="https://store.paizo.com/pathfinder-flip-mat-the-dead-god-s-hand-multi-pack/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Flip-Mat: The Dead God’s Hand Multi-Pack</a></h3>
              <p><strong>HANDS-OFF STANDOFFS</strong></p>
              <p>Bring the adventures beneath Absalom to life on your tabletop with Pathfinder Flip-Mat: The Dead God’s Hand Multi-Pack featuring three locations from the new Pathfinder Adventure The Dead God’s Hand. One of the two maps in this set depicts the Orthux complex, while the other shows the Sanctum of Aroden on one side and the Throne of Azlant on the other. Don’t spend your time sketching when you could be playing. With Pathfinder Flip-Mat: The Dead God’s Hand Multi-Pack you’ll be ready for action!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image above" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/8cc99087-a39b-45e2-93fd-777767ef48ad/PZO24009-SE_SecretsoftheSwarm.png?w=300" alt="Starfinder Second Edition Secrets of the Swarm special Edition. A green leatherette cover with soft yellow and blue embossed text" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6a16e296-f6ff-4831-be69-4ebbf23daadd/PZO24009-HC_SecretsoftheSwarm.png?w=300" alt="Starfinder Second Edition Secrets of the Swarm Adventure. A spaceship is stranded in the middle of space and surrounded on all sides by a swarm of smaller insect-like spaceships" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-secrets-of-the-swarm-adventure-path/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Adventure Path: Secrets of the Swarm</a></h2>
              <p><strong>TAKE A STAND AGAINST THE RELENTLESS SWARM!</strong></p>
              <p>The Szandite Collective, a peaceful federation of worlds connected by magical crystals, has long searched for the missing planet Krethiskar, which vanished without a trace in ancient times. When the collective finally found the planet, their ill-fated expedition discovered the grim truth: The destructive, insectile Swarm had overrun Krethiskar and transformed it into a husk world! Now, the Krethiskar Swarm has awoken from its long dormancy. Mutated by szandite crystals and driven by a mysterious purpose, the Swarm is attacking the peaceful Collective and seems to be searching for something…</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d4108abc-3940-42dd-b9aa-75f7903df0ac/PZO17004-BC_PathfinderDiceGods.png?w=300" alt="Pathfinder Dice Gods. Three gods stand in a temple lifting and presenting a large 12-sided die to the player" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-dice-gods/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Dice Gods</a></h2>
              <p>Only the most favored of the gods can win the dice-drafting game Pathfinder Dice Gods! On your turn, pick one of 8 iconic gods from the Pathfinder pantheon and roll their unique 12-sided die, using symbols you get to play a variety of minigames, scoring points and chaining success into more success. Compete with up to 4 other players, using both luck and tactical play to win this fast-paced game of divine dominance.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/ddd8e239-6339-4bba-a544-2eb79fadc44d/PZO21013_AbsalomStationMultipack.png?w=300" alt="Starfinder Flip-Mat Absalom Station Multipack" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-flip-mat-absalom-station-multi-pack/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Flip-Mat: Absalom Station Multi-Pack</a></h2>
              <p>YOU’RE CLEARED FOR DOCKING!</p>
              <p>Explore the famous port of call at the center of the galaxy with Starfinder Flip-Mat: Absalom Station Multi-Pack! Four maps showcase environments you might find on any space station across the galaxy, including an industrial maze of pipes, busy corridors packed with habitations and shops, an atmosphere controlled recreational park full of alien flora, and a zero-gravity space pier.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/2632656e-4e07-4def-9f32-34d9a61574bc/PZO160805E__19338.webp?w=300" alt="Pathfinder Second Edition Pathfinder Society Year of the Clockwork Mystery Scenario #8-05: A Shark's Guide to Piracy." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-society-scenario-8-05-a-sharks-guide-to-piracy/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Society Scenario #8-05: A Shark's Guide to Piracy</a></h2>
              <p>A Pathfinder Society adventure for 1st-2nd level characters, playable in 2-3 hours.</p>
              <p>A recent ally of the Pathfinder Society has called upon some junior Pathfinders for assistance: help xem get xir treasure back from an old enemy! As the Pathfinders travel into a marsh-ridden island to infiltrate an old tavern, they'll be met with creepy crawlies, leaping lizards, and a smoking gun! It's up to them to confront the tengu pirate Blunderbuss and show him how the Society treats their friends!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/c3e7215c-2b5f-42e1-8d92-434b20d67349/PZO260205E__24999.jpg?w=300" alt="Starfinder Second Edition Starfinder Society Beyond the Blood Door Scenario 2-05: File Corrupted" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-society-scenario-2-05-file-corrupted/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Society Scenario #2-05: File Corrupted</a></h2>
              <p>A Starfinder Society Scenario designed for 1st- through 2nd-level characters, playable in 2-3 hours.</p>
              <p>The recent magical attack against Absalom Station, now known as the Rending, was heralded by a threatening but garbled transmission broadcast across the entire station. Determined to identify the mastermind of this attack, the Starfinders visit the district of Synthhaven to consult the hacktivist collective Syzygy. Enter a virtual recreation of this glitching broadcast while hackers work externally to repair and restore the corrupted file. What secrets will this high-tech team-up uncover?</p>
              <p>This is an adventure in the ongoing Beyond the Blood Door metaplot.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/aa50d04a-a202-4c68-917d-9124cfffc015/PZO160806E__47903.webp?w=300" alt="Pathfinder Second Edition Pathfinder Society Year of the Clockwork Mystery Scenario #8-06: Falling Sparks" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-society-scenario-8-06-falling-sparks/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Society Scenario #8-06: Falling Sparks</a></h2>
              <p>A Pathfinder Society adventure for 5th-6th level characters, playable in 2-3 hours.</p>
              <p>Within the bowels of Starfall, the capital city of tech-centered Numeria, a member of the fallen Technic League has reached out to the Pathfinder Society with information about clockwork magic and how it may relate to the mysterious artifact discovered last year within an abandoned Azlanti temple. In the middle of negotiating her escape from Numeria, the scientist goes silent, leaving her contacts worried. It's up to the Pathfinders to delve into the seedy underbelly of Starfall and find out what happened to her!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/973993c7-c4a9-489f-ba4c-2ab0bcc43c94/PZO260206E__51589.jpg?w=300" alt="Starfinder Second Edition Starfinder Society Beyond the Blood Door Scenario 2-06: An Inside Job" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-society-scenario-2-06-an-inside-job/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Society Scenario #2-06: An Inside Job</a></h2>
              <p>A Starfinder Society Scenario designed for 1st- through 2nd-level characters, playable in 2-3 hours.</p>
              <p>As the Starfinder Society continues to investigate the recent magical attack against Absalom Station, they discover a troublesome coincidence: a Starfinder agent used the chaos of the Rending attack as cover to steal a valuable relic from First Seeker Ilyastre Memorial Museum. Believing this traitorous Starfinder, Brelomari, had foreknowledge of the attack, Venture-Captain Arvin tasks a team of Starfinders with investigating the theft, retrieving the stolen relic, tracking down Brelomari, and uncovering what connection she has to the Rending’s perpetrators.</p>
              <p>This is an adventure in the ongoing Beyond the Blood Door metaplot.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>From Our Partners</h2>
              <p>Our partners at Archives of Nethys, Demiplane, Fantasy Grounds, Hero Lab Online, and Roll20* are dropping new content this month as well! Buy your PDF on paizo.com to get a discount via the PaizoConnect API. Or pay full price on their platforms, sync your account, and get a complimentary PDF on the Paizo Store.</p>
              <p>*Roll20 is no longer a part of PaizoConnect and discounts and complimentary PDFs do not apply.</p>
              <p><br></p>
              <p>Bring Pathfinder and Starfinder to where you are, in person or online, and if you don’t have a favorite local game store, get books delivered to your door via a&nbsp;<a href="https://store.paizo.com/subscriptions">Paizo Subscription!</a> From rulebooks to adventures, accessories, and more, we’ve got subscriptions for every table! Subscribing to a line of books gets you the physical book and the PDF for one price! Subscribe to four lines or more to unlock exclusive discounts on subscriptions and added products.</p>
              <p>Thank you for playing Starfinder and Pathfinder!</p>
              <h3>Shop the&nbsp;<a href="https://store.paizo.com/">Paizo Store</a>&nbsp;and your&nbsp;<a href="https://paizo.com/paizo/locator">favorite local game store</a>&nbsp;today!</h3>
              <h3><a href="https://paizo.com/threads/rzs8pmc1?NEW-RELEASES-BLOG-September-2026">Excited for the new releases? Join the conversation in the Paizo Forums!</a></h3>
             </div>
            </div>
           </div>
           <div class="sharing_widget" data-v-7a806b22>
