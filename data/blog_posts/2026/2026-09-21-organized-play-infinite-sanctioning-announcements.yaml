             <h1 data-v-7a806b22>
              <p>Organized Play Infinite Sanctioning &amp; Announcements</p></h1>
             <div class="byline" data-v-7a806b22>
              <a href="/blog/a" title="More blog posts by Thurston Hillman" class="name disabled" data-v-7a806b22>Thurston Hillman</a><span class="postDate" data-v-7a806b22> - 1 hour, 9 minutes ago</span>
