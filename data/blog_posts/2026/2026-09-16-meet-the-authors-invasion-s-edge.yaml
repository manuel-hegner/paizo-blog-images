           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Greetings, players! In today’s blog we’d like to take a moment to recognize our talented freelance authors who contributed to the first season of Starfinder Society (Second Edition) scenarios. Some of these authors have been writing for us for years, while others saw their names in print for the very first time! Many of these adventures will be compiled into the <a href="https://store.paizo.com/starfinder-invasion-s-edge-adventure-path/"><em>Starfinder Invasion’s Edge</em></a><a href="https://store.paizo.com/starfinder-invasion-s-edge-adventure-path/"> Adventure Path</a>, available next spring.</p>
              <p><strong>Alex Speidel<br></strong><em>Convention and Organized Play Manager</em></p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e50185d6-0b11-4155-b1ef-82acc00a8363/PZO260100_Robot_1500.png?w=500" alt="Illustration by Kevin Sardinha: A cartoon robot shines a spotlight on the logo of the Starfinder Society, coming in from above with arms poised to seize the logo" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>John Godek III (he/him)</h1>
              <h1><em>SFS2 #1-00: Collison’s Wake</em></h1>
              <p>Hi! I’m John! I had the privilege of writing the special that kicked off Starfinder 2nd edition at Gen Con last year! I’m a long-time Paizo contributor with a heavy focus on Starfinder, so this was an especially fun project for me. With this scenario being set on Akiton, I went back to some of the early society scenarios that took place there and incorporated bits of lore from them. One of my favorite parts of the scenario was a creature that I made inspired by my daughter’s pet pigmy hedgehog! I was also able to include a really cool weapon, and the story of a heroic stand by a beloved character.<br><br>
                While I have completed over a dozen Starfinder and Pathfinder projects for Paizo (with a couple more forthcoming), this past year has been mostly dedicated to the <a href="https://renegadegamestudios.com/dungeon-crawler-carl/?srsltid=AfmBOoo-a8HPsIudGNle8v2aAscKlFU4zKnQ1FvhGRoDboV8VlAaoka8">Dungeon Crawler Carl RPG</a>. In addition to helping playtest, design and develop the game, I’m also producing <a href="https://www.youtube.com/@DungeonAnarchists">Dungeon Anarchists</a>, the first podcast dedicated to it. On the Paizo front, I’m in my 6th year producing the <a href="https://www.youtube.com/@IntrepidHeroes">Intrepid Heroes</a> actual play podcast, where we are currently playing through the <a href="https://store.paizo.com/pathfinder-adventure-path-hellbreakers/">Hellbreakers Adventure Path</a> with Paizo Senior Designer Jason Keeley as GM. If you want to chat some about gaming and game design, you can find me online at <a href="https://bsky.app/profile/johngodek.bsky.social">@johngodek.bsky.social</a>, or at <a href="http://johngodek.com">johngodek.com</a>.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Michael Bramnik (he/him)</h1>
              <h1><em>SFS2 #1-01: Invasion’s Edge</em></h1>
              <p>Hello there! My name is Michael Bramnik, and I was given the honor of helping launch Starfinder Society 2nd Edition by writing scenario #1-01: Invasion's Edge!</p>
              <p><br></p>
              <p>This adventure was intended to be the kick-off point for Starfinder agents embarking into the refreshed universe, both from a character and player standpoint. I was challenged to present an adventure that could help teach the 2nd edition engine to brand new players while also being fun for veterans of Starfinder 1e and Pathfinder 2e.</p>
              <p><br></p>
              <p>I always love when I can incorporate real-world science concepts into fiction that I write, and if you look closely, you'll see this adventure is full of them! And if you're going to GM this and want the soundtrack I crafted for it, I'm always happy to share.</p>
              <p><br></p>
              <p>You can find me online at <a href="https://canisdirus.bsky.social">https://canisdirus.bsky.social</a> and get a peek at my upcoming (announced) projects at <a href="https://canisdirus.carrd.co/">https://canisdirus.carrd.co/</a> along with a link to my Board Game Arena profile at the bottom of that page if you want to join me for some gaming online. I'm also a board member of the Organized Play Foundation (<a href="https://www.orgplayfoundation.org">https://www.orgplayfoundation.org</a>) 501(c)(3) organization, if you want to check out our work there.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Alex Speidel (he/him)</h1>
              <h1><em>SFS2 #1-04: The Great Absalom Relay</em></h1>
              <p>Do you like reality television? I like reality television. <em>The Amazing Race</em> is a particular favorite of mine, so when Jessica asked if I wanted this assignment, I responded “you will have to pay me <em>not</em> to write this adventure.”</p>
              <p>I’m very pleased with my love letter to competitive television programming, but what I’m <em>most</em> pleased about is how often I see this adventure recommended as a new player’s introduction to the game and the universe. I love writing adventures that bring people into our worlds (see: my entire previous body of work save one scenario), and it’s so gratifying and humbling to know that people actually <em>like</em> this adventure and recommend it highly. I suspect we haven’t seen the last of Rick Molbrun or the Zo! Media Superstars!</p>
              <p>In just a few weeks my next adventure, <em>SFS2 #2-07: Attack at the Freemarkets</em>, will drop for Starfinder Society, and I can’t wait to get to talk about that one. I’m on Bluesky at alexspeidel.bsky.social, Discord at AlexSpeidelPaizo, and behind the walls at your local convention.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Hilary Moon Murphy (she/her)</h1>
              <h1><em>SFS2 #1-10: Rites of Rekindling</em></h1>
              <p>Hello everyone! I’m Hilary Moon Murphy, aka Hmm (she/her). I wrote <em>Starfinder</em></p>
              <p><em>Society Scenario #1-10: Rites of Rekindling</em>. I loved the opportunity to present Starfinder’s first view of Lajok, the home planet for so many of our vlaka characters. Being able to set an adventure there was a pure joy. As a student of ASL and an accessibility advocate, I had the opportunity to imagine a vibrant city and joyous festival where deaf, blind, deaf-blind could celebrate as equals with the rest of the population. My developer, Jessica Catalan, also allowed me to do a battle on a bumper sled ride and a fight with an animated parade float, so the whole process was rip-roaring fun! I hope that all of you enjoy playing this scenario half as much as I enjoyed writing it.</p>
              <p>If you like my work, please look for the upcoming <em>Tengus and Teapots</em> trilogy of scenarios on Paizo Infinite. I also am planning some future Starfinder adventures there, so stay posted!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Sara Jeffers (any/all)</h1>
              <h1><em>SFS2 #1-11: Friends of the Forest</em></h1>
              <p>When writing <em>Friends of the Forest</em>, I was inspired by the places and people I grew up around in Washington state. It is the place that made me a friend of the forest, after all. I grew up in one set of Cascades valleys, and spent the first 24 years of my life exploring as many of the other nooks and crannies as I could, and now I shove all that love and appreciation into everything I write. (You're welcome!) The environment of Ste Xinnith is heavily based on the Olympic Rainforest, except on a ludicrously giant scale, and I wrote the Maraquoi NPCs as homages to people from my friends, family, clan, and tribe. (If you recognize your goofiness, well. That's on you, cousin.) My favorite part of the adventure is the gliding bears, because who doesn't want to have a majestic gliding bear as a friend? Especially if you get a little bit of experience for saving it! Aside from the cute animal, I also like that I snuck a drum circle and dancing in there, and so many beads. Next time there will be a powwow, stoodis! You can see what shenanigans I'm currently getting up to over on Bluesky at @BabaYaga.Quest.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/1fb1acaa-b456-46e2-b147-cfa8983b0c24/RipAndTear_PZO260112.png?w=700" alt="Rip and Tear, artist Lucas Fernando: Two muscular and intimidating female shobhad bandit raiders named Rip and Tear stand ready to leap into battle. One wields a fangblade and the other a rotolaser." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>IIllustration by Lucas Fernando.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Jeremy Corff (he/him)</h1>
              <h1><em>SFS2 #1-12: Take the Bait</em></h1>
              <p>I’m Jeremy Corff (he/him). You may know me from <em>Starfinder Society Scenario #1-12: Take the Bait</em>, <em>Alien Core</em>, <em>Return of the Runelords #1 and #3</em>, <em>Battlecry!</em> or some of my other work. I’ve been freelancing in TTRPGs for 9 years, and have worked with Paizo, Legendary Games, and many others.</p>
              <p>My contribution to <em>Invasion’s Edge</em> was <em>Take the Bait</em>, a loving homage to the <em>Mad Max</em> movies, running vehicular battles, and the post-apocalyptic wasteland genre. The level 3-4 range is the perfect time to introduce a more complicated combat with limited opportunities to recover, applying enough pressure to put the party in danger without overwhelming them. I doubt it will surprise many to learn that my favorite part is the defense of the convoy and the introduction of the twins – Rip and Tear. I hope those fine shobhad ladies make memories at your table as much as they have at mine!</p>
              <p>If you’d like to keep up with my work, you can find me on Blue Sky at <a href="https://bsky.app/profile/solorunstudio.bsky.social">@solorunstudio.bsky.social</a> or at my blog <a href="https://solorunstudio.com/">https://solorunstudio.com/</a> where I post weekly Starfinder content.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Rue Dickey (they/he/xe)</h1>
              <h1><em>SFS2 #1-13: Foul Humors</em></h1>
              <p>As a lover of all things gross, spooky, and cultish, I was thrilled to write <em>#1-13: Foul Humors</em> for this season of Starfinder Society! There's nothing more thrilling for me than hearing reports back from game stores and conventions that my scenario was run and everyone found it positively disgusting—thank you all! A personal favorite part of that adventure is the custom creature: the jellied rat king. I won't say more than that—you deserve the horrific surprise of encountering it in your own time. So many thanks to Jessica and the team for bringing me on for the inaugural season of Starfinder Society Second Edition! You can find more of my work for Starfinder in Tales from the Vast: Paradise Shutdown, where I also had some fun with cults! Keep up with me on bsky: ilananight.bsky.social or via my website: <a href="https://ilananight.space">https://ilananight.space</a>.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/350ebec3-b674-4bcf-a791-c3891610df6a/PZO260115-Arabhud-Final.png?w=500" alt="Arabhud, artist Allan Santos da Silva: A four armed fey with glowing antlers, a wide-brimmed hat, and a short and muscular build clutches a rifle far too big for it" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Allan Santos da Silva.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>David N. Ross (he/him)</h1>
              <h1><em>SFS2 #1-15: Ruins of the World Soul</em></h1>
              <p><em>Ruins of the World Soul</em> is shaped by my fondness for folklore, especially legends of close affinity for the land from my Chippewa ancestors, which parallels nicely some ideas already established about the Shoabhad by previous authors. The wrestling ring and of course the weird little fey are both favorite elements of mine. You can find me on Bluesky at davidnross.bsky.social and my monthly Pathfinder (and 5e) adventures at <a href="http://tomcartos.com">tomcartos.com</a>.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Letterio Mammoliti (he/him)</h1>
              <h1><em>SFS2 #1-17: Corpse Fleet Conflict</em></h1>
              <p>Hi everyone, my name is Letterio Mammoliti and I wrote the <em>Corpse Fleet Conflict</em>. I love the Diaspora, so being able to include some of its unusual characteristics in the initial starship scene was a treat for me. But my favorite part was definitely figuring out how to accommodate multiple paths into the ship and adding details in the environment so people could figure out what happened on the ship before their arrival.</p>
              <p>I hope you had a lot of fun running to the <em>Legacy</em>’s rescue and thwarting the Corpse Fleet’s plans!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/715b2302-cd80-4c5e-8796-49e2363d023c/MiriKor_1200x1500.png?w=500" alt="Miri Kor by Ernst Eskelsen: A vesk in a beanie and red leather jacket" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Ernst Eskelsena.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Jacob W. Michaels (he/him)</h1>
              <h1><em>SFS2 #1-20: Magic Unleashed</em></h1>
              <p>Hi everyone, I’m Jacob W. Michaels (he/him), the author of SFS Year 1’s #<em>1-20: Magic Unleashed</em>, which was my first Starfinder Society scenario! I had a great time with this one, hopefully channeling all sort of magical oddities with cracking skies, and crabby cloudbursts. I thoroughly enjoyed getting to write an Aspis agent, and having her order her henchminions to not leave things as they fled in panic—“you can run with your arms full!” As always, I love running for folks, and hearing their reactions to callbacks from previous adventures and encounters. If you enjoyed this one, you can check out my work in many Pathfinder Society scenarios, as well as <em>Hellbreakers</em> and <em>Vaultlines</em> (coming out soon! Or maybe just recently released depending on when this blog is released)!</p>
              <p>See you all next season!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Kate Baker (she/her)</h1>
              <h1><em>SFS2 #1-24: Final Gambit: Part One</em></h1>
              <p>Hi all! I’m Kate Baker (she/her), and you can find me on Bluesky as katebakergm.bsky.social.</p>
              <p>I was delighted to contribute to the first season of second edition Starfinder Society and I was even more delighted to get to work with my husband to write Parts One and Two of the finale of this season’s metaplot! This truly is one adventure split in half, and I recommend playing <em>Final Gambit: Part Two</em> as soon as you can after playing Part One.</p>
              <p>I had a lot of fun writing this adventure, and I hope you have just as much fun playing it. The art for the final encounter is absolutely incredible, and I hope that it starts to tie up all of your PCs’ hard work this season with the Wreck of the Returned!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/28d9e50e-aba1-43af-a9bf-1e01ce7a9908/FacetGuardians_1200x1500.png?w=500" alt="Facet Guardians by Alecksander Ribeiro: A crystalline monster shaped like a humanoid with arms and legs both ending in fine points" data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Illustration by Alecksander Ribeiro.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1>Dennis Muldoon (he/him)</h1>
              <h1><em>SFS2 #1-26: Final Gambit: Part Two</em></h1>
              <p>Hi folks! I'm Dennis Muldoon (he/him); I'm on Bluesky as dkmuldoon.bsky.social.</p>
              <p>I was thrilled to contribute to the first season of Starfinder Society in 2nd edition, and doubly so to write the season metaplot finale, <em>SFS2 #1-26: Final Gambit: Part Two</em>. Even better, I got to work closely with my wife, who wrote <em>Final Gambit: Part One</em>. These two scenarios really are two parts of a whole, and I definitely recommend playing them back-to-back if possible.</p>
              <p>This adventure was so much fun to write, especially crafting the final encounter, and I hope you enjoy playing it as much as I enjoyed writing it!</p>
              <p><br></p>
              <h3><a href="https://paizo.com/threads/rzs8rt1d?NEW-BLOG-Starfinder-Society-Author-Blog">Join the conversation on the Paizo Forums!</a></h3>
