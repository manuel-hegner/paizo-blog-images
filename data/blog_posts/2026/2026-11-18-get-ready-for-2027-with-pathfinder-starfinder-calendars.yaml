           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>The New Year is right around the corner, and we’re excited to announce 2027 Calendars featuring the art of Pathfinder and Starfinder from our partners at <a href="http://www.gothamcityonline.com/">Gotham Gifts!</a></p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/7ad6d741-1965-4d3a-ba3b-9913e990ffff/PF%20Cover.jpg?w=450" alt="Pathfinder 2027 Calendar Cover. Iconic witch, Feiya, a pale skinned human woman with long white hair, and her white furred, nine-tailed fox familiar, Daji, fight magic with magic against a lizard-folk in dark robes." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d80ceaed-07c0-4199-ac37-f4d5e3c9b7f8/PathfinderCalendar_01.jpg?w=450" alt="A lightly lit office room with a mock up of the pathfinder calendar on the wall behind the desk." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Add fantasy flare to your schedule with the <a href="https://www.amazon.com/gp/product/B0HD28RF9K?th=1">Pathfinder 2027 Wall Calendar!</a> Featuring 12 full-color illustrations from the pages of Pathfinder Second Edition rulebooks, setting books, and adventures, this calendar gives you some adventure to accompany your appointments!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/c9d33d08-23dd-4f09-9e34-1d296f3f6327/SF%20Cover.jpg?w=450" alt="Starfinder 2027 Calendar cover. Four aliens wearing similar uniforms stand in front of multiple cameras and microphones, lifting a trophy. From left to right, one is a large, humanoid beetle-like alien with pincers protruding from their jaw and a large shell-like carapace on their back. Second from the left is a humanoid cat-like alien that resemble a cheetah. The third alien, is a humanoid shaped, purpe blob, and the fourth alien is a tall, blue, orc-like alien with two tusks protruding from their jaw, pointing upwards." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/12678303-f81f-450b-b9bf-c515fda777d0/StarfinderCalendar_01.jpg?w=450" alt="A mockup of the starfinder calendar sits on a table alongside some loose blue polyhedral dice." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Chart your journey through the stars on the <a href="https://www.amazon.com/gp/product/B0HD332L67?th=1">Starfinder 2027 Wall Calendar!</a> This calendar showcases 12 pieces of art from Starfinder Second Edition, taking you on a year-long tour of Desna’s Path.</p>
              <p>Both calendars are printed in the United States on FSC-certified paper for guaranteed high-fidelity art that’s also environmentally conscious. Plus, they come pre-labeled with all major American and Canadian holidays and moon phases!</p>
              <p>Defeat the ultimate big bad—scheduling—with these new Pathfinder and Starfinder calendars!</p>
             </div>
            </div>
