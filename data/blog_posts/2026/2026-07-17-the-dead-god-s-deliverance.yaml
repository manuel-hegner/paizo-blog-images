           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>We’ve been waiting seven years for this moment.</p>
              <p>Starting in 2019, when we first heard of Erik Mona’s upcoming deluxe adventure, we’ve built and rebuilt parties of characters to play it. We’ve chosen – and changed – this project’s roster of players from among Order of the Amber Die’s members.</p>
              <p>Years passed: 2020, 2021, 2022, 2023. Yet, <a href="https://store.paizo.com/pathfinder-adventure-the-dead-god-s-hand/"><em>The Dead God’s Hand</em></a><em> </em>did not arrive.</p>
              <p>We moved on to new projects. On cold nights around the fire pit, we tried to guess why Paizo would delay the release of an already-announced adventure for so long. We knew just enough about what was inside its pages, to build some legends about why <em>The Dead God’s Hand</em> was taking so many years to get here. We knew that this adventure was originally the Paizo office campaign, with names like Bulmahn, Sutter, Schneider, Jacobs, and McCreary having played in it. We’d be treading on holy ground where our idols of the industry had journeyed. But for some reason, we still had to wait.</p>
              <p>There was a night in 2024, staring into the coals, when someone said it: Aroden is returning. The theory was not rejected. Right, because if Aroden was returning, then Paizo wouldn’t bring him back in the beginning of Pathfinder 2<sup>nd</sup> Edition, but more towards the middle. 2025 perhaps? We’ve followed our share of threads in the Pathfinder forums where either James Jacobs or Erik Mona was pressed about Paizo’s plans for the dead god. At best, their posts usually end with the line that there are no plans to have Aroden return. That is, there are no plans for <em>them </em>to make Aroden return. As Pathfinder fans, we know that Paizo is always full of surprises – especially one that could involve <em>your</em> characters bringing the god of humanity back.</p>
              <p>2026 is here, and so is The Dead God’s Deliverance!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/33f3f892-82f0-40e1-a88c-399bbb4da709/OoTAD_DGH_AmberDie.jpg" alt="An amber twenty sided die sitting on a copy of Pathfinder Second Edition: Absalom City of Lost Omens special edition. The book is sitting on a pile of coins, sitting a map of the city of Absalom." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Order of the Amber Die</h2>
              <p>In case you aren't familiar with our work from past projects, we'll repeat the staccato version. We only play published adventures. We use the complete rules set. We've had the same GM since our founding: 1987. We like to push the envelope of tabletop roleplaying. We only play marathon sessions -- days at a time. We'll play on location. Our GM isn't afraid to kill characters or TPK us; he'll do it in front of the community, too. Imagine us <a href="http://knowdirectionpodcast.com/2019/10/joining-order-of-the-amber-die/">like a roleplaying team</a>, complete with a Captain and Ref positions to help manage the game. We revere one d20 above all others, and that is the Amber Die. It doesn’t roll more 20s than it should, but it chains them when it does, and doubters have always been converted. After more than 170 adventures, we've even gotten rid of RPG absolutes: Yeah, we'll split the party.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>Past Pathfinder Projects</h2>
              <p><a href="https://paizo.com/threads/rzs2rhtg?The-Emerald-Spire-Project#1">The Emerald Spire Project</a>, 2014<br><a href="https://paizo.com/community/blog/v5748dyo5lhx3?Giantslayer-Marathon-Part-6">The Giantslayer Endeavor</a>, 2015<br><a href="https://paizo.com/community/blog/v5748dyo5lk5x?Order-of-the-Amber-DieThe-Strange-Aeons">The Strange Aeons Experiment</a>, 2016<br><a href="https://paizo.com/community/blog/v5748dyo6shdq?Order-of-the-Amber-Die-Beyond-the-Veiled-Past">The Azlant Odyssey</a>, 2017<br><a href="https://paizo.com/community/blog/v5748dyo6sgfm?Order-of-the-Amber-DieDoomsday-Dawn-Playtest">The Pathfinder Playtest</a>, 2018<br><a href="https://paizo.com/community/blog/v5748dyo6shta?Order-of-the-Amber-Die-The-Slithering-Salve">The Slithering Salve</a>, 2020<br><a href="https://paizo.com/community/blog/v5748dyo6x57l?The-Abomination-Arsenal-Part-7">The Abomination Arsenal</a>, 2022<br><a href="https://paizo.com/blog/the-crown-academy-part-1">The Crown Academy</a>, 2023<br><a href="https://paizo.com/blog/the-sky-scions-part-3">The Sky Scions</a>, 2025<br><a href="https://paizo.com/threads/rzs8cw05?The-Dead-Gods-Deliverance#1">The Dead God’s Deliverance</a>, 2026</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>The Deliverance</h3>
              <p>We approach each project with its own take. Safe to say that much of the community remembers our all-gunslinger party, or knows our recent family of dwarves with its out-of-game generations. For this project, we’re ready to usher in Aroden’s return, and we’ve built a party worthy of greeting the Last Azlanti when he sets foot in Absalom once more. We proudly introduce you to The Aroden 5!</p>
              <p>For ancestries, of course we’re all human, like the patron deity of humanity. For weapons, every character uses a longsword in some fashion – the weapon of Aroden himself. This party has been in Absalom for quite some time now, exploring forgotten places beneath the City of Lost Omens in their quest to find out more about the fate of their god. Our deity’s colors are green and gold, and each character wears a set of clothing to match. We’re going to be dressed properly for the return of the Last of the First Humans!</p>
              <p>The core members of the The Aroden 5 can be found below. Also listed are the names of each player and the year each became a member of OAD. We’re fortunate to have friends like artist <a href="https://www.youtube.com/@erikfrankhousepresents">Erik Frankhouse</a>, whose stellar portraits captured the grunge we were going for, especially with characters who worship a dead god. The backgrounds you’ll see listed below are a teaser from the adventure itself!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/42446809-0136-41be-97a3-6a7468352852/OoTAD_DGH_CompoundMap.jpg?w=550" alt="A photo of a compound map covered in miniatures of furniture decorating the different rooms" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/433c4c72-9aab-4a6c-98c2-53a047e1752b/OoTAD_DGH_Minis.jpg?w=550" alt="Five miniatures standing in front of a miniature flag with the symbol for Aroden" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>The Aroden 5</h3>
              <p>Meet<strong> Dorianth</strong>, a commander belonging to the lost sect known as the Knights of Aroden. He claims to be a descendant of Ilsur and has goals: Restoring the Knights and carrying the title of First Sword. Dorianth is all about longsword and board, but it’s his tactics and leadership that unite The Aroden 5.</p>
              <p>Human Commander<br>
                -Strategy: Plant banner and defend<br>
                -Background: Esoteric Bookworm<br>
                -Style: Longsword and shield<br>
                -Played by Erick Germer (member since 2007)</p>
              <p><br></p>
              <p>Meet <strong>Bettalia</strong>, “Betty,” a barbarian who channels the anger of Aroden. Betty is for everyone out there who still believes that Aroden was murdered, and isn’t happy about it. Her two longswords are ready to slash and hack through anything that stands in the way of bringing her god back.</p>
              <p>Human Barbarian<br>
                -Instinct: Spirit<br>
                -Background: Puddles Carnie<br>
                -Style: Twin longswords<br>
                -Played by Theodora Marcantonis (member since 2023)</p>
              <p><br></p>
              <p>Meet <strong>Uhlan Vale</strong>, an oracle who has foreseen the return of Aroden. Uhlan spends his days as a street preacher, preparing the people of Absalom for the return of his deity. Uhlan wields a spiritual longsword, and receives his guidance from Azlanti voices of the past.</p>
              <p>Human Oracle<br>
                -Mystery: Ancestors<br>
                -Background: Absalom Street Preacher<br>
                -Style: <em>Spiritual Armament<br></em>-Played by Logan Ernst (prospective member)</p>
              <p><br></p>
              <p>Meet <strong>Cassiel</strong> <strong>Seldeogaear</strong>, “Cass,” a student of Aroden’s background, who worships Acavna as the Last Azlanti did. Her character build pays homage to the Child of Acavna and Amaznen archetype from Pathfinder 1<sup>st</sup> Edition. She wields a longsword and open hand in the tradition of those martial casters that have come before her.</p>
              <p>Human Fighter<br>
                -Archetype: Wizard<br>
                -Background: Mystery Adept<br>
                -Style: Longsword and free hand<br>
                -Played by Shannon Hogan (prospective member)</p>
              <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>
              <p>Meet<strong> Alleuwyn Alsyr, </strong>an exemplar striding the path of Aroden. If the dead god will not return, then Alleuwyn will take his place; after all, a demigod is still better than no god. The exemplar dares to throw his longsword across the battlefield at foes. That’s impressive enough, but there is something about Alleuwyn that just makes us believe.</p>
              <p>Human Exemplar<br>
                -Ikons: Gleaming Blade, Scar of the Survivor, Victor’s Wreath (belt)<br>
                -Background: Destined for Greatness<br>
                -Style: Thrown longsword<br>
                -Played by Matthew Hardin (member since 2003)</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/2b08dd6a-bc3e-487d-a8b8-f466e0d18f9e/OoTAD_DGH_Aroden5Portraits.jpg" alt="Character art portraits of the Aroden 5, the new player characters of the Order of the Amber Die's Dead Gods Hand campaign." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3><strong>Highlights from Preparing The Dead God’s Hand:</strong></h3>
              <p>□ Here’s another teaser about the adventure: A plethora of NPCs that can accompany you, and character arcs for each. So many NPCs in fact, that we’ve chosen to go with additional players who will take the roles of live-NPCs at each session. It’s our pleasure to be accompanied by <a href="https://peterwoodworth.com/published-works/">Peter Woodworth</a> in his role as Krell the halfling rogue.&nbsp; Peter has authorship credits that go about as far back as when we first discovered a strange die with an amber hue. Fun fact: Order of the Amber Die was first featured in 1997, when one of our themed groups of characters (the Happy Blasters) was published in <em>Star Wars Adventure Journal #13</em>, courtesy of Pete!</p>
              <p>□ All these years have gone by, and we’ve never shown off the walls of our actual studio, usually you see the adventure-specific backdrops we surround ourselves with. Well, the studio walls are green -- a sign from Aroden himself that we should make this the first playthrough without backdrops! As we release content for this project, you’ll get to see more of where we play and shoot photos for the blogs, and catch a glimpse of the padded floor that is one of the secrets to how we’re still rocking the longest sessions in the industry.</p>
              <p>□ We’re adding – you guessed it – another teacher to our roster. We’ve got enough educators in Order of the Amber Die for a regular faculty meeting at this point. Welcome Shan Hogan, an AP Calculus teacher who will make sure that not a single hit point or attack bonus will go unaccounted for! We’re also matriculating one of the top students from our very own Crown Academy into his first official project: Logan Ernst. This young prospect has been blooded in <a href="https://store.paizo.com/pathfinder-adventure-crown-of-the-kobold-king-anniversary-edition-p2/">Crown of the Kobold King</a>, and has been asking for more action. Done.</p>
              <p>□ It’s green and gold everything for us until this project comes to an end, including matching dice sets from our friends at <a href="https://www.norsefoundry.com/">Norse Foundry</a>. Adam also put together a gold GM screen, and we have green and gold placards for our portraits. Our custom template for the commander’s banner aura is green with gold, and we’re pretty sure Theodora even had green and gold eyeshadow on in that photo. Expect a couple more custom props straight from the pages of <em>The Dead God’s Hand</em>, combined with some trimmings from <a href="https://beadleandgrimms.com/">Beadle and Grimm’s</a> 2022 Absalom Gold Edition set. Our table is ready! &nbsp;&nbsp;</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/ce89f03a-1ed2-43b2-bdda-48e41486c474/OoTAD_DGH_PlayTeaser.jpg?w=550" alt="Three people sitting around a gaming table covered in maps, books, character sheets, and minis" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e1ee5870-8915-4122-99c1-ed36512ad746/OoTAD_DGH_Studio.jpg?w=550" alt="A game room with green walls and a gaming table covered in a large map of the city of Absalom" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h3>What’s Next</h3>
              <p>We’ll leave you with a couple of playthrough reveal photos in this report, then drop a blog for every marathon session we run, and provide details of what we discover. As Adam likes to remind us, a TPK ends the project, and that would be rather embarrassing – it has happened before. To be clear, we have no idea what will happen regarding Aroden in this adventure, but you can expect to hear from us again soon (before the module’s release) with part one of the playthrough!</p>
              <p><br></p>
              <p><strong>Follow Order of the Amber Die:<br></strong>Our table was brought to life with the help of <a href="http://bluetablepainting.com/">Blue Table Painting</a> for our miniatures and <a href="https://www.blackbardstudios.com/">Black Bard Studios</a> for our custom terrain.</p>
              <p>-<a href="https://paizo.com/threads/rzs8cw05?The-Dead-Gods-Deliverance#1">The Dead God’s Deliverance thread</a><br>
