             <h1 data-v-7a806b22>
              <p>The Mechanics of Horror</p></h1>
             <div class="byline" data-v-7a806b22>
              <a href="/blog/author/JasonBulmahn" title="More blog posts by Jason Bulmahn" class="name" data-v-7a806b22>Jason Bulmahn</a><span class="postDate" data-v-7a806b22> - 1 minute ago</span>
