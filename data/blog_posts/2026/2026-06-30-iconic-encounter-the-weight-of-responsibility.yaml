             <h1 data-v-7a806b22>
              <p>Iconic Encounter: The Weight of Responsibility</p></h1>
             <div class="byline" data-v-7a806b22>
              <a href="/blog/a" title="More blog posts by Joshua Birdsong (he/him)" class="name disabled" data-v-7a806b22>Joshua Birdsong (he/him)</a><span class="postDate" data-v-7a806b22> - Yesterday, 05:00 pm</span>
