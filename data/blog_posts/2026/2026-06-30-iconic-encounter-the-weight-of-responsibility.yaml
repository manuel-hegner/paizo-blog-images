              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Continue Usharak’s journey in the pages of <a href="https://store.paizo.com/pathfinder-impossible-magic"><em>Pathfinder Impossible Magic</em></a>, releasing in hardcover, digital download, special edition, and sketch cover variant on July 30! Get your copy early and receive a free PDF copy of the book by <a href="https://store.paizo.com/subscriptions/pathfinder-subscriptions/">subscribing</a> today!</p>
              </figcaption>
             </figure>
            </div>
