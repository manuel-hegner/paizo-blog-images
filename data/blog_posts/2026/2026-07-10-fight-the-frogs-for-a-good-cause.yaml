           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Nothing quite says “summer” like frogs, am I right? Yeah, you read that correctly! This year, we’re spending our July celebrating <em>Pathfinder Game Night: Dawn of the Frogs</em> with the <a href="https://www.humblebundle.com/books/pathfinder-second-edition-bundle-frogs-paizo-inc-books" data-new-window="true" target="_blank" rel="noopener noreferrer"><strong>Pathfinder Second Edition Bundle of Frogs!</strong></a> on Humble Bundle. This bundle is live now and is scheduled to run through July 31st at 11 A.M. Pacific. It features the usual digital downloads of a wide array of Pathfinder titles you might be used to as well as a new, exclusive short story ebook, an exclusive Foundry VTT module, and (for the first time ever) 3D-printable files to bring your Pathfinder game to life! As always, your support of the bundle will directly benefit a great cause—in this case, the Craft Emergency Relief Fund (CERF+).</p>
              <p>Founded in 1985, CERF+ provides craft artists with support and resources for disaster and emergency relief, education programs, and readiness grants to strengthen preparedness. Committing to generosity, inclusion, and care, the organization advocates for the thrive-ability of craft artists and craft as an art form. Learn more about CERF+ at their website, <a href="http://www.cerfplus.org">www.cerfplus.org</a>, or on Instagram (@cerfplus), Facebook (@CERFplus), and LinkedIn (CERF+).</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/3101b413-0d91-4856-9668-75c1d493c65c/cerf_Logo.png?w=400" alt="Craft Emergency Relief Fund text logo" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Now for the question I’m sure everyone is asking: what do you mean, frogs? We mean FROGS! Swamp-dwelling, fly-eating, and yes, sometimes-demon-worshipping FROGS!</p>
              <p>Supporters who donate $5 or more will get a taste of Pathfinder Second Edition with the following digital products: <a href="https://store.paizo.com/pathfinder-beginner-box-pdf/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Beginner Box</em></a>, <a href="https://store.paizo.com/pathfinder-core-gm-screen-pdf/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Core GM Screen</em></a>, <a href="https://store.paizo.com/pathfinder-character-sheet-pack-pdf" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Character Sheet Pack</em></a>, <a href="https://store.paizo.com/pathfinder-flip-mat-bayou-hideout-pdf/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Flip-Mat: Bayou Hideout</em></a>, <a href="https://store.paizo.com/pathfinder-tales-the-swamp-warden-epub/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Tales: The Swamp Warden</em></a>, <a href="https://www.myminifactory.com/users/PaizoPrintables?show=tribe" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Paizo Printables Welcome Pack Demo Adventure: Last Croak</em></a>, and <em>Pathfinder: Swampsong</em>.</p>
              <p>The last two titles on this list deserve special attention. The first, <em>Paizo Printables Welcome Pack Demo Adventure: Last Croak</em>, has previously been available exclusively as a part of the Welcome Pack for subscribers of the <a href="https://www.myminifactory.com/users/PaizoPrintables?show=tribe" data-new-window="true" target="_blank" rel="noopener noreferrer">Paizo Printables Tribe</a>/<a href="https://www.patreon.com/cw/PaizoPrintables" data-new-window="true" target="_blank" rel="noopener noreferrer">Patreon</a>, which launched in April. This brief adventure, written by Thurston Hillman, showcases a handful of miniatures in the Paizo Printables Welcome Pack, and since they happen to be FROGS!, we included the adventure here.</p>
              <p>The second, <em>Pathfinder: Swampsong</em>, is an all-new short story from veteran Pathfinder Tales novelist Gabrielle Harbowy. Fans of the heroines from her novel, <em>Gears of Faith</em> (which was, coincidentally, included in our last Humble Bundle), will be happy to learn that Keren and Zae return in this newly commissioned story, this time deep in the swamps of the River Kingdoms in search of a lost relic of the Knights of Ozem.</p>
              <p>All told, the $5 tier includes $64.44 in value!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/4ac56ddd-b0d1-4098-adbe-abf3a6d60fef/PZO2106.png?w=300" alt="Pathfinder Beginner Box (Remastered Edition): The Box cover art is the Pathfinder Iconics battle a green dragon flying low above their heads." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/1894f249-2178-4c64-980d-4f78f15988c5/PF_LastCroak_WelcomeAdventure.jpg?w=300" alt="Paizo Printables Welcome Pack Demo Adventure: Last Croak. Pathfinder iconics, Valeros, Merisiel, Kyra, and Ezren battle their way through a dark swap full of frog folk called Tripkee" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6319ff6c-b199-436a-82cd-86074be34f9e/Swampsong_cover.jpg?w=300" alt="Pathfinder Swampsong by Gabrielle Harbowy. A short story cover featuring a woman in shining full plate armor and a winged, frog-like monster with three eyes and a long purple tongue." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Those supporters who<em> </em>donate $15 or more will also receive an additional $211.83 in value with the following exciting titles: <a href="https://store.paizo.com/pathfinder-player-core-pdf/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Player Core</em></a>, <a href="https://store.paizo.com/pathfinder-gm-core-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder GM Core</em></a>, <a href="https://store.paizo.com/pathfinder-monster-core-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Monster Core</em></a>, and<em> </em>six Pathfinder Society Scenarios featuring swampy encounters—<a href="https://store.paizo.com/pfs-intro-1-the-second-confirmation/" data-new-window="true" target="_blank" rel="noopener noreferrer">Intro #1: The Second Confirmation</a>; #1–05: <a href="https://store.paizo.com/pfs-scenario-1-24-lightning-strikes-stars-fall/" data-new-window="true" target="_blank" rel="noopener noreferrer">Trailblazer’s Bounty; #1–24: Lightning Strikes, Stars Fall</a>; <a href="https://store.paizo.com/pfs-scenario-2-17-lost-maid-of-anactoria/" data-new-window="true" target="_blank" rel="noopener noreferrer">#2–17: Lost Maid of Anactoria</a>; <a href="https://store.paizo.com/pfs-scenario-5-02-the-blackwood-lost" data-new-window="true" target="_blank" rel="noopener noreferrer">#5–02: The Blackwood Lost</a>; and <a href="https://store.paizo.com/pfs-scenario-6-14/?" data-new-window="true" target="_blank" rel="noopener noreferrer">#6–14: Twice in Steel</a>. They will also obtain the 8 Pathfinder Flip-Mat and Flip-Mat Classics titles that are utilized in these scenarios—<a href="https://store.paizo.com/pathfinder-flip-mat-ambush-sites-multi-pack-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Ambush Sites Multi-Pack</em></a>, <a href="https://store.paizo.com/pathfinder-flip-mat-classics-ancient-dungeon-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Ancient Dungeon</em></a>, <a href="https://store.paizo.com/pathfinder-flip-mat-classics-deep-forest-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Deep Forest</em></a>, <a href="https://store.paizo.com/pathfinder-flip-mat-classics-falls-rapids-pdf" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Falls &amp; Rapids</em></a>, <a href="https://store.paizo.com/pathfinder-flip-mat-planar-tavern-pdf" data-new-window="true" target="_blank" rel="noopener noreferrer">Planar Tavern,</a> <a href="https://store.paizo.com/pathfinder-flip-mat-swamp-ruins-pdf" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Swamp Ruins</em></a>, <a href="https://store.paizo.com/pathfinder-flip-mat-wicked-dungeon-pdf" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Wicked Dungeon</em></a>, and <a href="https://store.paizo.com/pathfinder-flip-mat-classics-woodlands-pdf" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Woodlands</em></a>.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/95108e6b-f543-4a20-ae57-1afadcd9e947/PZO30126__88480.jpg?w=300" alt="Pathfinder Flip-Mat: Swamp Ruins. A square tiled flip mat of swamp greenery dotted with dilapidated buildings" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e025d031-5436-439c-bf8a-cc120b2ae3c5/PZO160614E.jpg?w=300" alt="Pathfinder Society Scenario #6-14: Twice in Steel" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/2ac579ae-3c54-4c29-b415-7763ec28891a/PZO12001_PEPathfinderPlayerCore.png?w=300" alt="Pathfinder Remaster Player Core: Pathfinder iconics battle a large red dragon on the steps of a crumbling ruin" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>If you support the bundle with a donation of $30 or more, you’ll unlock an additional $265.87 in value, including two additional Humble Bundle exclusives! This tier includes: <a href="https://store.paizo.com/pathfinder-player-core-2-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Player Core 2</em></a>, <a href="https://store.paizo.com/pathfinder-howl-of-the-wild-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Howl of the Wild</em></a>, the <a href="https://store.paizo.com/tales-of-the-zoetrope/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder: Tales of the Zoetrope</em></a><em> </em>short fiction collection, the <em>P</em><a href="https://store.paizo.com/pathfinder-lost-omens-world-guide-pdf/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>athfinder Lost Omens World Guide</em></a>, the <a href="https://store.paizo.com/pathfinder-lost-omens-character-guide-pdf/?" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Lost Omens Character Guide</em></a>, the <a href="https://downloads.paizo.com/ExtinctionCurse_PlayersGuide.pdf" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Adventure Path: Extinction Curse Player’s Guide</em></a><em> </em>and<em> </em>the entire <a href="https://store.paizo.com/pathfinder/pathfinder-second-edition/adventure-paths/extinction-curse/" data-new-window="true" target="_blank" rel="noopener noreferrer">6-part Extinction Curse Adventure Path</a>, <a href="https://store.paizo.com/pathfinder-game-night-dawn-of-the-frogs-pdf/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Game Night: Dawn of the Frogs</em></a>, an exclusive Foundry VTT module adapting <a href="https://www.myminifactory.com/users/PaizoPrintables?show=tribe" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Paizo Printables Welcome Pack Demo Adventure: Last Croak</em></a> to the popular virtual tabletop program, and a 17-figure bundle of Paizo Printables miniatures that provide every figure needed to represent the iconic heroes and monstrous enemies featured in <em>Pathfinder Game Night: Dawn of the Frogs</em>. We’ve also included 8 brand-new sculpts that are unique to this bundle!</p>
              <p>As if that weren’t enough, supporters who redeem their codes by the end of the bundle’s live window will receive a free month of membership in the Paizo Printables Tribe on myminifactory.com (new subscribers only). In addition to the free month of membership, you’ll also get all 17 minis added to your My Mini Factory library, allowing you to easily sort and access them later from the platform where the rest of your Paizo Printables figures live. If you happen to redeem your code in July or later (before it expires), we’ll grant you the miniatures and your free month of Tribe membership the following month.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/19a02292-1119-48e3-9640-0f1e4989cee9/July26_HB_CrittersMinis.png?w=200" alt="Seven mock ups of different swamp creature miniatures including large fanged frogs, snakes, mushroom leshy, and giant insects." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/bdc63e0a-efdd-4a6d-98b5-64b033a1ba1b/PZO12005-HC.jpg?w=200" alt="Pathfinder Second Edition Howl of the Wild" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>If you support the bundle with a donation of $40 or more, you’ll also receive a physical copy of the <a href="https://store.paizo.com/pathfinder-game-night-dawn-of-the-frogs/" data-new-window="true" target="_blank" rel="noopener noreferrer"><em>Pathfinder Game Night: Dawn of the Frogs </em></a>boxed set. Upon redeeming the code on the Paizo Store, a copy will be added to your cart, and all you’ll owe at checkout are shipping and VAT charges based on your location and selected shipping method. That’s an additional $34.99 in value, and an additional boxload of FROGS!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/845f22b1-ac0b-4f01-bd38-cd897b46aa96/PZO14006-BX.png?w=300" alt="Pathfinder Game Night: Dawn of the Frogs. Three dimensional game box mockup, the cover art features pathfinder iconics battling bipedal frog creatures in a dark swamp" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
