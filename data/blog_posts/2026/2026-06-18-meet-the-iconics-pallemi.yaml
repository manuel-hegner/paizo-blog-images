             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Pallemi is a runesmith, a new class debuting in <a href="https://store.paizo.com/pathfinder-impossible-magic/"><em>Pathfinder Impossible Magic</em></a>, a 256-page hardcover Pathfinder Second Edition release coming July 30 in standard, special, and sketch cover editions! If you’d like to get it early and with a free PDF, subscribe to the <a href="https://store.paizo.com/pathfinder-rulebook-subscription/">Pathfinder Rulebook</a>, <a href="https://store.paizo.com/pathfinder-special-edition-rulebook-subscription/">Special Edition</a>, or <a href="https://store.paizo.com/pathfinder-sketch-edition-rulebook-subscription/">Sketch Edition</a> lines today!</p>
