           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image above" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6bf03e8c-9ad0-443e-9376-485df7ab7b00/Oct26_NewReleases_Featured.jpg?w=700" alt="Find Your Path—October 2026 New Releases! Two images next to each other. On the left is a starfinder technomancer fighting her way through robots. The right image is the pathfinder iconic fighter and champion battling a large drider in knights armor" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Hail and well met, ‘Finders! This month’s new releases hack your Starfinder games into hyperdrive and explore the fiendish ramifications of the Hellfire Crisis!</p>
              <p>Never miss a release with our <a href="https://store.paizo.com/subscriptions">Paizo Subscriptions</a>—for everything from rulebooks to accessories! Subscribers get a free PDF with purchase, early access to game content, and exclusive discounts for members with 4 or more active subscriptions.</p>
              <p>Exciting News! The Paizo Webstore now has a <a href="https://store.paizo.com/blog/">blog of its own!</a> We’ll be splitting blog content between here and there—lore, game content, and community blogs will continue living right here, but product-focused blogs (like new releases) will live on the Store Blog! This is the last New Releases blog that will be cross-posted here to the Community Blog.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image above" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/47792dd0-c26a-4aa9-9c37-dab271707b3d/PZO22006_TechCore_HC.png?w=300" alt="Starfinder Second Edition Tech Core: starfinder iconics flee from three flying robotic drones" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/4e374dd0-4d65-45d3-885c-35435d3003ac/PZO22006_TechCore_SE.png?w=300" alt="Starfinder Second Edition Tech Core: Silver and purple embossed text on a dark leatherette cover" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/bcba8326-05a8-4b01-a2e8-ff26c1508051/PZO22006_TechCore_SK.png?w=300" alt="Starfinder Second Edition Tech Core: starfinder iconics flee from three flying robotic drones. The art is in a silver metal looking frame, resembling an old video game cover." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-tech-core/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Tech Core</a></h2>
              <p>UPGRADE TODAY!</p>
              <p>Blast off into a bold new frontier of technology! Starfinder Tech Core introduces the rules for tactical starship combat, allowing heroes to build their own starships and face off against enemy vessels and space hazards! This system fits seamlessly with normal combat mode, giving GMs the tools to create epic encounters! Tech Core is also packed with new options to upgrade your characters to the next level. Hack the universal code as a spell-slinging technomancer or blow it all to smithereens as a crafty mechanic. Arm any Starfinder character with new gear, spells, and feats. You can even play as a cyborg, sentient robot organism, or living hologram!</p>
              <p>Starfinder Tech Core is available in standard hardcover, hobby-exclusive retro videogame inspired hardcover, foil embossed faux-leather Special Edition hardcover, and PDF versions.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image above" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d0581093-d9c9-4006-8448-b4c457911ce9/PZO13010-HC_CheliaxInfernalInheritance.png?w=300" alt="Pathfinder Lost Omens: Cheliax Infernal Inheritance. Pathfinder iconic fighter and champion battle a large drider wearing full spiked armor." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/f1c56aaa-ed65-490c-9ce7-74a52cc6226a/PZO13010-SE_CheliaxInfernalInheritance.png?w=300" alt="Pathfinder Lost Omens: Cheliax Infernal Inheritance Special Edition. Silver embossed text on a dark blue leatherette cover" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-lost-omens-cheliax-infernal-inheritance/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Lost Omens Cheliax, Infernal Inheritance</a></h2>
              <p>IT’S ALL GONE TO HELL!</p>
              <p>The nation of Cheliax held great influence for centuries, but that all seemed fated to end with the Hellfire Crisis. As the great war approached its conclusion, Cheliax and its neighbors found themselves transformed, with some nations growing in size and others rising for the first time from the ashes of conflict. This gazetteer details the region in and around Cheliax—the region now known as the Infernal Inheritance—and provides information on the history, cultures, and current events there. It includes in-depth looks at six nations, their capitals, and their people, making this in an invaluable resource for any campaign in the Lost Omens setting. It also includes new character options and a large poster map for infernal campaigns of all kinds!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/e7ea2168-6cc9-4ab6-b41a-15eb9382dd9b/PZO14011-BX_Adventure_Cover.jpg?w=350" alt="Pathfinder Game Night: The Dragon's Crown. A medium sized purple dragon chases a winged devil across a city's rooftops. The devil is laughing while clutching a crown in its arms." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-game-night-the-dragon-s-crown/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Game Night: The Dragon’s Crown</a></h2>
              <p>DANGERS ABOVE AND BELOW!</p>
              <p>Trouble stirs on the tangled rooftops of the city of Korvosa when a mischievous imp steals a house drake’s beloved crown. Left sorely wounded, the drake turns to heroes for help, but are you up to the challenge of tracking that thieving imp down and dealing with the mysterious new crime boss who ordered the theft in the first place?</p>
              <p>&nbsp;The Dragon’s Crown is an adventure for four 1st-level pregenerated characters: Amiri the barbarian, Lem the bard, Sajan the monk, and Seoni the sorcerer. The adventure is split into three parts, each of which presents everything needed to run an exciting game night with your friends. Poster maps of all combat encounters in the adventure, dice, and all the cardboard pawns you’ll need to run those battles, are included as part of this all-in-one, ready-to-play Pathfinder experience!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/ca4c045d-eca6-4002-ba0d-6abf3b298a65/PZO11043-FM_Haunted_Library_2d_print__63297.webp?w=350" alt="Pathfinder Flip-Mat Haunted Library: A top down view of a square tiled map of a large library. Most of the shelves are standing in organized rows while a few have fallen over and are surrounded by scattered books." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-flip-mat-haunted-library/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Flip-Mat: Haunted Library</a></h2>
              <p>LOST IN THE STACKS!</p>
              <p>Whether the player characters are researching obscure lore or seeking secrets lost to time, no Game Master wants to draw every shelf and study cubicle when the action begins. Fortunately, with the latest Pathfinder FlipMat, you don’t have to! This ready-to-use and captivatingly illustrated map shows an open library lined with bookshelves that have seen better days, while the other side shows the library’s archives. Spread out Pathfinder Flip-Mat: Haunted Library and get right to the action.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d87378df-ffb6-4c6a-9307-bcc1d3b54fa0/PZO160807E__71782.webp?w=350" alt="Pathfinder Society Scenario #8-07: In The Halls of Dead Justice. A hairless catfolk wearing a purple robe and large beaded necklace stares into the distance" data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-society-scenario-8-07-in-the-halls-of-dead-justice/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Society Scenario #8-07: In The Halls of Dead Justice</a></h2>
              <p>A Pathfinder Society adventure for 7th-8th level characters, playable in 2-3 hours.</p>
              <p>The lich Msasa, a cruel Blood Lord in her own right, has been advocating for the Pathfinder Society over the past few months, trying to establish a lodge within the undead nation of Geb's capital city, Mechitar. When one of her rivals offers to assist, she smells a rat and sends in the Society to figure out what it is that he wants, ending in the Pathfinders being challenged to a trial by combat to establish their strength and capabilities. All around them, undead shoulders shrug, telling them to either play at Gebbite politics or go home with their tails between their legs.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/b2c9c213-9750-4313-8f4e-48c80c52f186/PZO260207E__15139.jpg?w=350" alt="Starfinder Society Scenario #2-07: Attack at the Freemarkets. A masked female kasatha dressed in a colorful shirt, a black, belted mini skirt, and knee-high lace up boots manipulates a wrist mounted computer with her two lower hands. Her two upper hands are raised in the air and crackling with magical electricity. She has a baton hooked onto her belt and a pistol holstered on her thigh." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/starfinder-society-scenario-2-07-attack-at-the-freemarkets/" data-new-window="true" target="_blank" rel="noopener noreferrer">Starfinder Society Scenario #2-07: Attack at the Freemarkets</a></h2>
              <p>A Starfinder Society Scenario designed for 1st- through 2nd-level characters, playable in 2-3 hours.</p>
              <p>The Starfinder Society has identified the perpetrators behind the recent Rending attack as an unknown cell of the cult of the Devourer. What’s more, they’ve uncovered evidence that the Rending was just the beginning, and more attacks are planned against Absalom Station. Desperate to prevent more bloodshed, the Starfinders have identified a few sites they believe will be targets. Chief among these sites is the Freemarkets, a massive mall-like market featuring independent and budding businesses operated by AbadarCorp. A team of Starfinders is swiftly deployed to the Freemarkets to foil this pending attack.</p>
              <p>This is an adventure in the ongoing Beyond the Blood Door metaplot.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <figure class="blog__paragraph__image left" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/9c65d21b-2137-437c-b56f-781a89b9daf5/PZO160808E__38215.webp?w=350" alt="Pathfinder Society Scenario #8-08: Treatise on the Study of Clockwork. A female aiuvaran scholar lounges on a cushioned chair, one elbow over the chair’s back, one leg on the chair’s arm, and one leg stretched out across the floor. She uses her remaining hand to fiddle with a clockwork gear, which she holds up near her face to examine. Her black hair is braided in an updo, and a quill is tucked in her hair behind her ear." data-v-a2f23fca>
             </figure>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><a href="https://store.paizo.com/pathfinder-society-scenario-8-08-treatise-on-the-study-of-clockwork/" data-new-window="true" target="_blank" rel="noopener noreferrer">Pathfinder Society Scenario #8-08: Treatise on the Study of Clockwork</a></h2>
              <p>A Pathfinder Society adventure for 5th-6th level characters, playable in 2-3 hours.</p>
              <p>Within Ustalav's University of Lepidstadt, a professor of clockwork magics has reached out to the Society to offer her research to assist with their investigation of the strange clockwork compass. When the Pathfinders arrive to gather that research, they're informed that it's currently being held in eerie Schloss Caromarc, home of the infamous Alpon Caromarc and his Beast of Lepidstadt, the giant amalgam of flesh and brain. The Pathfinders will need to escort the professor through the castle to set the home to rights and locate her research!</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" style="clear:both;" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>From Our Partners</h2>
              <p>Our partners at Archives of Nethys, Demiplane, Fantasy Grounds, Hero Lab Online, and Roll20* are dropping new content this month as well! Buy your PDF on paizo.com to get a discount via the PaizoConnect API. Or pay full price on their platforms, sync your account, and get a complimentary PDF on the Paizo Store.</p>
              <p>*Roll20 is no longer a part of PaizoConnect and discounts and complimentary PDFs do not apply.</p>
              <p><br></p>
              <p>Bring Pathfinder and Starfinder to where you are, in person or online, and if you don’t have a favorite local game store, get books delivered to your door via a&nbsp;<a href="https://store.paizo.com/subscriptions">Paizo Subscription!</a> From rulebooks to adventures, accessories, and more, we’ve got subscriptions for every table! Subscribing to a line of books gets you the physical book and the PDF for one price! Subscribe to four lines or more to unlock exclusive discounts on subscriptions and added products.</p>
              <p>Thank you for playing Starfinder and Pathfinder!</p>
              <p>Shop the&nbsp;<a href="https://store.paizo.com/">Paizo Store</a>&nbsp;and your&nbsp;<a href="https://paizo.com/paizo/locator">favorite local game store</a>&nbsp;today!</p>
              <h3><a href="https://paizo.com/threads/rzs8su2t?NEW-RELEASES-BLOG-October-2026">Join the conversation on the Paizo Forums!</a></h3>
             </div>
            </div>
           </div>
           <div class="sharing_widget" data-v-7a806b22>
