           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Howdy! Luis Loza here! Boy, do I have some news for you. As the blog’s title suggests, Pathfinder will be turning the globe to head to a region that a lot of you have been waiting for. I, the rest of the Pathfinder team, and a stellar list of authors, have the great honor to announce the setting of a few future Pathfinder projects: Arcadia! Starting in the summer of 2027, we’ll be taking a look at this mostly-unexplored continent to provide new setting information, character options, and more! Let’s take a look at some of what’s in store!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/d13da0e7-8588-4eee-af59-ee1a68f88218/PZO13015_ArcaneEmpires_Opener.jpg" alt="Arcane Empire Opener, artist Santiago Roldan: A large airship hovers in place as it docks high above a mountain range. Several laborers standby, ready to load goods." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>An airship docks in the Arcane Empires, by Santiago Roldan</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1><strong>Lost Omens Arcadia World Guide</strong></h1>
              <p>The first product on our release list is <em>Lost Omens Arcadia World Guide</em>, slated for September 2027! This enormous tome is our first deep dive into the continent of Arcadia and features a large variety of lore information. From the continent’s history to its people to the various faiths of the land, this book has all the information you need to kickoff a campaign based in Arcadia. The book’s largest sections take a look at the nations of Arcadia, each of which are part of one of a dozen metaregions. Much like with the metaregions found in <a href="https://store.paizo.com/pathfinder-lost-omens-world-guide/">Lost Omens World Guide</a>, the metaregions of Arcadia group nations together into thematically-linked regions to aid with the creation of campaigns. For example, the Arcane Empires metaregion features nations where magic is prominent throughout and is perfect for high fantasy campaigns that explore how magic intersects with technology, religion, and everyday life.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/c5ccc6c0-5254-4cff-b2f8-50e21426460d/PZO13015_FallenRazatlan_Opener.jpg" alt="Fallen Razatlan, artist Santiago Roldan: A festival takes place in a Mesoamerican plaza. Two large puppets, one of Kazutal and the other of Ah Pook, are the central celebration piece." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>A festival in Fallen Razatlan, by Santiago Roldan</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>One of the most notable and influential metaregions is a land known as Fallen Razatlan. In the ancient days of Arcadia, the empire of Razatlan made use of magical portals they called war gates to travel across the far reaches of the continent. Their military and magical might allowed them to conquer a large portion of Arcadia. Eventually, the people of Arcadia broke free of Razatlan’s hold and the empire crumbled. The region of Fallen Razatlan is home to the nation of Razatlan, a proud nation, yet one that is an echo of its former might. It’s also home to Innazpa, a nation where stories literally come to life through the power of belief; Nalmeras, a land where a quintet of knightly orders maintain peace; Sipulajaw, home to unique body modifications seen nowhere else in Arcadia; and Xopatl, a nation where a malfunctioning magical network powers everyday life.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/df211b94-9aee-4c53-8eb0-2cdafdd369eb/PZO13015_HauntedWastes_Opener.jpg" alt="Haunted Wastes, artist Israel Maccari Dionisio: A strange rider atop a horse among the ruins of a battlefield. The rider’s body has been transformed and mutated, causing strange growths that bulge out from beneath their armor." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>A war-torn battlefield in the Haunted Wastes, by Israel Maccari Dionisio</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Another notable region is a place known as the Haunted Wastes. While the Razatlani Empire attempted to conquer all of Arcadia, the empire of Otreska attempted to shore up their defenses against the impending armies. To supplement their forces, they created a magical, empire-spanning ritual that returned the dead back to life and allowed them to keep fighting. The <em>Gift of Salvation</em>, allowed the Otreskan Empire to survive, but the ritual eventually became corrupted and began to bring its people back wrong. Some transform into beings who have lost all their memory and sense of self. Others transform into terrifying monsters as their bodies become corrupted and misshapen by the ritual’s power. Most notably among these is Emperor Otreska, the ruler who has changed into a cruel and erratic man after hundreds of deaths.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/746a737b-97ad-4a38-86c5-b8753865e8f2/GlassDesert_Concept.jpg" alt="Glass Desert Concept, artist Kent Hamilton: A large spire stands in the center of a sand dune. A massive glass structure has grown around the base of the spire." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>A desert transformed into glass in the Deadshot Lands, by Kent Hamilton.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>As I mentioned above, Arcadia will have 12 metaregions, each of which gets explored in the book. While I can’t go into all of them, I can give you a little taste of what you can expect!</p>
              <ul>
               <li><strong>Arcane Empires:</strong> Magic permeates the land and is part of everyday life. Airships, magical technology, and more about in this region where even everyday commoners have some magical abilities.</li>
               <li><strong>Deadshot Lands:</strong> The frontiers of the Deadshot Lands are a place full of danger. Luckily, the prevalence of firearms does a lot to keep these dangers at bay.</li>
               <li><strong>Fabled Frosts:</strong> Valenhall calls many to these icy lands. Those seeking glory must deal with giants, fallen warriors, and ancient evils to reach the promised afterlife.</li>
               <li><strong>Fallen Razatlan:</strong> After the fall of the Razatlani Empire, the nation of Razatlan and its neighbors learned to live alongside in a new age. These nations carve out their own identities while also contending with their Razatlani pasts.</li>
               <li><strong>Haunted Wastes:</strong> In trying to save itself, the empire of Otreska cursed itself. The people of the land are doomed to die and live, over and over, becoming corrupted as they do.</li>
               <li><strong>Land of the Northern Lakes:</strong> An abundance of skymetals and other resources turned this region into an economic powerhouse. Industries and technology blossom as the lands are scavenged for more.</li>
               <li><strong>Land of Second Souls:</strong> Death isn’t the end here. Every person earns a second chance, but never returns quite exactly like they were in their first life.</li>
               <li><strong>Mataverde:</strong> The enormous rainforest of Mataverde is dangerous and uncompromising. Life here is difficult, but also full of wonder.</li>
               <li><strong>Ocean Kingdoms:</strong> The major kingdoms of Okaiyo reached the lands of Arcadia, establishing relationships and even homes. This region is a gateway to the vast ocean beyond the continent.</li>
               <li><strong>Primal League:</strong> A strong connection to the First World has created a fantastical site where nature thrives. A magical accord keeps the fey of the region in relatively good standing with everyone else.</li>
               <li><strong>Salt Stretch:</strong> After a destructive event literally salted the region, all that was left was a desiccated, devastated land. Despite this, people have learned to survive among the magically irradiated salts.</li>
               <li><strong>Southern Marches:</strong> The eerie and occult thrive among these lands. Home to spirits, strange creatures, and more, life moves a little slower and a little more oddly here.</li>
              </ul>
              <h1><br></h1>
              <h1><strong>Lost Omens Arcadia Map Archive</strong></h1>
              <p>Those of you wanting to make use of Arcadia for your home campaigns can also look forward to the <em>Lost Omens Arcadia Map Archive</em>. This collection features a map for each of the twelve metaregions included in the World Guide, as well as a map of the continent as a whole. This collection is ready to map all of your new adventures when it hits shelves in October 2027!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/73f53ab5-d50a-4087-9e9e-3859a3f89404/ArcadiaWorldMap_1339x2000.jpg" alt="Arcadia World Map, artist Rob Lazzaretti: A large detailed map of the entire continent of Arcadia, including mountain rangers and rivers throughout the land." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>The map of Arcadia, by Rob Lazzaretti.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h1><strong>Lost Omens Character Guide</strong></h1>
              <p>Following hot on the heels of the World Guide is <em>Lost Omens Character Guide</em>! Slated for a November 2027 release, this book gives you everything you need to play a character from Arcadia. Featuring new archetypes, companions, equipment, and skill feats, this book One especially exciting feature are the new ancestries! The Character Guide features four new ancestries, one of which has never been playable in Pathfinder’s history! While we’ll look at two today, you’ll have to wait until later to get a look at rougarous and wyrwoods.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/ff6b2dc3-d8f5-4734-908c-9fe0049fb5f4/KlinkoiAncestry_Concept.jpg" alt="Klinkoi Ancestry Concept, artist Kent Hamilton: Concept art showcasing klinkois, large insectile creatures resembling stick insects. The concept art shows various poses." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Klinkoi concept art, by Kent Hamilton.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>The first of these is klinkois. These insectile people are known both for their tremendous size and their ability to emotionally connect with other klinkois. A klinkoi resembles living tree branches and towers over most other ancestries. It’s not uncommon for Arcadian crowds to feature multiple klinkois who are stepping over the humans and halflings meandering about. Klinkoi empathy is unmatched and a klinkoi is known to match the strong emotions of others in their vicinity. As a result, many klinkois have learned how to patiently access their emotion, lest they set off others of their kind in a wave of emotion.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/7a01af65-b83e-4cc0-a3d3-50f3eb677d14/SyrinxAncestryConcept_2000.jpg" alt="Syrinx Ancestry Concept, artist Kent Hamilton: Concept art showcasing syrinxes, creatures resembling owls. The concept art shows various poses." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Syring concept art, by Kent Hamilton.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>One of the other new ancestries are syrinxes. These feathered humanoids resemble owls and come in a variety of sizes. Some are smaller, similar in height to halflings, while others are bulkier and taller, much like humans. Like klinkois, syrinxes are found all over Arcadia and are a common sight along with other common ancestries. Syrinxes have a knack for an attention to detail and are known for developing unique, personal obsessions. A given syrinx might be an expert on the history of Razatlani music, the magic used to elevate airships, or a single craft or trade. While this habit makes for many reclusive syrinxes, just as many are excited for an opportunity to set out into the world and perform a bit of field research.</p>
              <h1><strong>Looking to the Future</strong></h1>
              <p><em>Lost Omens Arcadia World Guide</em> and <em>Lost Omens Arcadia Character Guide</em> are just the first bit of Arcadia content that you can look forward to in the future. We’ll of course have adventure content that takes place in Arcadia, but more information on that will be coming at a later date!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/dd3c09f4-1ac0-4e39-a5b1-b52ead97d361/PZO13015_ArcadiaIntroduction.jpg" alt="Arcadia Introduction, artist Santiago Roldan : Four adventurers stand outside of the entrance to an ancient ruin. They are on the lookout for danger as they make their way inside." data-v-a2f23fca>
              <figcaption class="style--match_paragraph" data-v-a2f23fca>
               <p>Arcadian heroes embark on adventure, by Santiago Roldan.</p>
              </figcaption>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Lastly, we wanted to take a moment to showcase all of the incredible authors that helped bring Arcadia to life! These books literally wouldn’t exist without the hard work of all of these authors. The Lost Omens Arcadia books are brought to you by Angel Amore, Lady Azulina, Joseph Blomquist, James Case, Adam Daigle, Rue Dickey, Eleanor Ferron, Alastor Guzman, Timothy Hickson, Laura Lynn Horst, Sara Jeffers, Michelle Jones, Michelle Y. Kim, Priscilla N. Lagares, Aaron Lascano, Luis Loza, Ron Lundeen, Stephanie Lundeen, Derry Luttrell, Mahpiya, Marlowe Miller, Jaime Reyes Mondragon, Zac Moran, Matt Morris, Ianara Natividad, Chesley Oxendine, Tomas Giménez Rioja, quinn b. rodriguez, David N. Ross, Simone D. Sallé, Michael Sayre, Navaar Seik-Jackson, Shay Snow, Solomon St. John, Liam Stevens, Gina Susanna, Diego Valdez, Shan Wolf, and Christian Zeuch</p>
              <p>We hope that you’re as excited as I am to check out Arcadia! We’ll have updated and information coming in the upcoming weeks and months, so stay tuned and make sure to subscribe to the <a href="https://store.paizo.com/pathfinder-lost-omens-subscription/">Lost Omens</a> and <a href="https://store.paizo.com/pathfinder-adventure-path-subscription/">Adventure Path</a> lines to ensure you catch updates as we make our way to Arcadia!</p>
              <p><br></p>
              <p><strong>Luis Loza<br></strong><em><strong>Creative Director, Rules &amp; Lore</strong></em></p>
