              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/b1e904eb-d445-41b0-b3a9-187e887a4af0/OotAD_DGH_Arazni.mov?w=500" data-v-a2f23fca>
             </figure>
