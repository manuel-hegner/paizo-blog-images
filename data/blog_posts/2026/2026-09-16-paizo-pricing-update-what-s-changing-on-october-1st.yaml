            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Greetings, ’Finders!</p>
              <p>Nobody enjoys writing a post like this, but we want to be upfront with you about what’s changing, what isn’t, and why.</p>
              <p>Beginning <strong>October 1, 2026</strong>, prices will go up on a small selection of Pathfinder and Starfinder books. Most of our catalog—including every Adventure Path—won’t be affected.</p>
              <h2>Why Now</h2>
              <p>Making a book has grown more expensive in pretty much every way. Tariffs and shifting global trade rules, paper and printing, freight, warehousing, and fulfillment all cost more than they did when many of our current prices were set. We’ve absorbed as much of it as we responsibly can, but much of it simply remains beyond our control.</p>
              <p>What we won’t do is cut corners on the books themselves. Adjusting a handful of prices lets us keep making the games you love, at the quality you’ve come to expect from Paizo, hopefully for years to come.</p>
              <h2>The Promise We Made About the Core Books</h2>
              <p>In 2023, we told you we’d hold the Pathfinder Core hardcovers—Player Core, GM Core, Monster Core, and Player Core 2—at $59.99 through at least their first printing. These are the first books most new players pick up, and we wanted that first step into the world of Pathfinder to be as easy as possible.</p>
              <p>We kept that promise. Those books are now a couple of printings in, and the costs associated with printing them again has grown past what that price can carry.</p>
              <p>So, starting October 1, the Core hardcovers and their Sketch Editions will move to <strong>$69.99</strong>—the same price NPC Core, Monster Core 2, Guns &amp; Gears (Remastered), and the Starfinder Player Core and GM Core already carry today. If you’re new to the game, or picking up a gift for a friend who is, the Pocket Editions and PDFs remain the most affordable ways to bring the rules to your table.</p>
              <h2>What’s Changing on October 1</h2>
              <ul>
               <li><strong>Pathfinder Core books:</strong> Player Core, GM Core, Monster Core, and Player Core 2 (hardcover and Sketch Edition) go from $59.99 to $69.99.</li>
               <li><strong>Rulebook Pocket Editions:</strong> Pathfinder and Starfinder Pocket Editions currently priced at $29.99 move to $34.99, the price the Pathfinder Player Core Pocket Edition already carries.</li>
               <li><strong>Select Lost Omens hardcovers</strong> go up $5: Rival Academies to $49.99, Shining Kingdoms to $64.99, and Draconic Codex to $69.99.</li>
               <li><strong>Starfinder Alien Core</strong> (including the retailer cover) goes from $64.99 to $69.99, in line with Starfinder Player Core and GM Core.</li>
               <li><strong>Special Editions</strong> keep their usual $20 premium over the standard edition, so a few will move alongside their standard books..</li>
              </ul>
              <h2>What’s Not Changing</h2>
              <ul>
               <li>Adventure Paths and standalone adventures</li>
               <li>Pathfinder Society and Starfinder Society scenarios</li>
               <li>Fiction and accessories</li>
               <li>PDFs—we adjusted PDF prices earlier this year, and they aren’t changing again</li>
               <li>Lost Omens Divine Mysteries and Tian Xia World Guide, which stay at $79.99</li>
              </ul>
              <h2>How We’ll Price New Books</h2>
              <p>Going forward, new Pathfinder and Starfinder books will be priced according to what goes into them: page count, art, and the development and editing hours behind every page. A longer, more art-rich book will cost a bit more; a slimmer one will cost less. We think that’s fairer than asking very different books to share a single price, and it helps us plan a healthier line for the years ahead.</p>
              <h2>Before Prices Change</h2>
              <p>Current prices hold on our webstore through <strong>September 30</strong>. If there’s a Core book or Pocket Edition you’ve been meaning to pick up, now is a good time—and your local game store may still have copies on the shelf.</p>
              <h2>Our Commitment to the Planet Hasn’t Changed</h2>
              <p>The commitments we shared in 2023 still stand. We print with soy-based inks, which give richer, more vibrant color with less ink on every page. Most of our paper is FSC-certified, sourced from responsibly managed forests that replace what they harvest, protect biodiversity and old-growth forests, and respect the rights of Indigenous Peoples. And our shipping boxes use recycled content, cushioned with starch-based peanuts and air pockets rather than foam.</p>
              <p>Your books still arrive as safely as we can pack them—just with a little more thought for the world they travel through.</p>
              <h2>Looking Ahead</h2>
              <p>We hope to keep these prices steady through at least the coming year. We know every dollar you spend on this hobby is a choice, and we never take that choice for granted.</p>
              <p>Thank you for building worlds with us, for welcoming new players to your tables, and for sticking with Paizo through a year of big changes. We couldn’t do any of it without you.</p>
              <p>See you at the table,</p>
              <p><strong>Christian Moore</strong><br><em>Chief Growth Officer</em></p>
