              </div><span data-v-7a806b22>Back to Blog</span></a>
            </div>
            <section class="tags" data-v-7a806b22>
             <svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="tags" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" class="fa-lg svg-inline--fa fa-tags fa-w-20" data-v-7a806b22>
              <path fill="currentColor" d="M497.941 225.941L286.059 14.059A48 48 0 0 0 252.118 0H48C21.49 0 0 21.49 0 48v204.118a48 48 0 0 0 14.059 33.941l211.882 211.882c18.744 18.745 49.136 18.746 67.882 0l204.118-204.118c18.745-18.745 18.745-49.137 0-67.882zM112 160c-26.51 0-48-21.49-48-48s21.49-48 48-48 48 21.49 48 48-21.49 48-48 48zm513.941 133.823L421.823 497.941c-18.745 18.745-49.137 18.745-67.882 0l-.36-.36L527.64 323.522c16.999-16.999 26.36-39.6 26.36-63.64s-9.362-46.641-26.36-63.64L331.397 0h48.721a48 48 0 0 1 33.941 14.059l211.882 211.882c18.745 18.745 18.745 49.137 0 67.882z" data-v-7a806b22></path>
             </svg><a href="/blog/tags/virtual_tabletop" class="link--tag" data-v-7a806b22>Virtual Tabletop</a><a href="/blog/tags/pathfinder_second_edition" class="link--tag" data-v-7a806b22>Pathfinder Second Edition</a><a href="/blog/tags/pathfinder_roleplaying_game" class="link--tag" data-v-7a806b22>Pathfinder Roleplaying Game</a>
            </section>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>We’re extremely excited to bring <a href="https://www.foundryvtt.store/products/pf2e-bastion-of-blasphemies" data-new-window="true" target="_blank" rel="noopener noreferrer">Bastion of Blasphemies to Foundry Virtual Tabletop</a>. We believe that one of Ustalav’s most notorious hauntings deserves some special treatment in its creation. Our friends at Paizo have done an amazing job creating an epic adventure with a huge scale, intriguing mysteries, and terrifying events for your table. We’ve taken the baton and have some very ambitious plans for how we can make it even better for your virtual table. Since it won’t be available on July 30th like the book version, we wanted to give you a peek behind the curtain to show you some of those plans.</p>
              <p>To say that the maps for Bastardhall are large doesn't quite do justice to the sheer volume, scale, and scope of work that clearly went into making it a fully mapped reality for players to explore. In a virtual tabletop where players can zoom in and have to navigate with their tokens the map needs to be <em>even larger</em>.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/a956b7c5-89ff-4ee2-ae86-a8d3dd1b3092/bastion-of-blasphemies-fidelity-comparison.webp" alt="Two maps side by side, on the left if a square tiled print map of a path and field with a wall running between them, on the right is the Virtual tabletop version of the map with more detail and plants decorating the map" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>What we're planning to do for Bastion of Blasphemies is incredibly ambitious: we want to bring it to your virtual table as a truly immense and immersive experience. Imagine every single five-foot-square of Bastardhall and its surrounding shores, lovingly remapped by community-favorite cartographers as a single Foundry VTT scene, fully leveraging our brand new Scene Levels feature and taking advantage of the advanced graphics frameworks that came with V14. Every token, every light, every wall, and animated door, across every floor all carefully placed on a single Scene with <strong>staggering dimensions of 36,000×48,000 pixels</strong>.</p>
              <p>That makes it, by far, the largest map to ever ship in a Paizo module. Our cartographers (Narchy and Kobold DM) are also stretching the limit of what is possible using Clip Studio Paint. CSP won’t even export a PNG the full size of this map so we’re knitting it together from smaller slices. The original maps also had different scales for different areas which we’ve standardized to make for a consistent experience and to ensure that all of the levels match up perfectly. There’s even extra spaces which weren’t present in the originals. Both Narchy and Kobold DM are nervous that I’m showing off these works in progress at all but I’m sure it’s obvious to everyone else how high quality their work is even at this early stage of development. Just wait until you can see it finished along with all of the other levels!</p>
              <p>To make all of this happen in Foundry VTT we’re using KTX2 compressed textures and creating a tiled image pyramid that works a lot like Google Maps. Zoom out to see the entire Scene and as you zoom in further we load higher resolution versions of the tiles that make up the map seamlessly in the background. This still wasn’t enough to give us satisfactory performance though. We want this module to work well even if you’ve been priced out of having an epic gaming rig by high PC component pricing. We’ve implemented a custom wall batching system, a quadtree for visibility testing, and made optimizations to how walls and point sources are computed when doing things that impact the canvas like opening or closing doors. Here’s what that means in layman’s terms: we have tested scenes with thousands of walls per level at a stable FPS. Obviously, the better your hardware the better your experience will be, but we’re doing our best to make it playable on as many systems as possible.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <video controls="controls" data-v-a2f23fca>
               <source src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/ceef0e52-a9c3-41d1-ba89-cf6af8c36600/wip-bastion-demo.mp4" type="video/mp4" data-v-a2f23fca>Your browser does not support the video tag.
              </video>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>I’ve talked a lot about the mega-scene for Bastardhall but that’s not all that you’ll be getting with our module. You can expect the same attention to detail and effort across everything else, just like the rest of our modules. Here’s a highlight of some of the other things you’ll get:</p>
              <ul>
               <li>The full adventure content is presented in a stylized journal that incorporates all 9 chapters, an extensive adventure toolbox, art handouts for your players, and a player's guide. Everything is expertly linked for quick access and includes callouts for various events, inline checks, and more.</li>
               <li>Complete Actors for all creatures, hazards, and traps along with 175 carefully crafted tokens with support for our Dynamic Token Ring.</li>
               <li>Custom effects for important events throughout the adventure which can be applied to actors.</li>
               <li>Immersive ambient audio and positional sound effects for every explorable area.</li>
              </ul>
              <h3>We hope you're all as excited to see this come to life as we are. <br><br><a href="https://www.foundryvtt.store/products/pf2e-bastion-of-blasphemies" data-new-window="true" target="_blank" rel="noopener noreferrer">Bastion of Blasphemies is coming to Foundry Virtual Tabletop on September 16, 2026!</a></h3>
              <h3><a href="https://paizo.com/threads/rzs8pard?NEW-BLOG-Bastion-of-Blasphemies-on-Foundry-VTT">Join the conversation on the Paizo Forums!</a></h3>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/4d0e47bb-cdd7-444b-830e-ed14fe6a945b/actors-with-tokens.webp" alt="Pathfinder Bastion of Blasphemies on Foundry Virtual Tabletop Pre Built Actors with 175 unique tokens" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/5c0bd383-fe46-414f-bd1a-ab3414bcfb76/bob-journal-screenshot.webp" alt="Pathfinder Second Edition Bastion of Blasphemies The full adventure text, complete adventure toolbox and players guide available on Foundry Virtual Tabletop in August 2026" data-v-a2f23fca>
             </figure>
