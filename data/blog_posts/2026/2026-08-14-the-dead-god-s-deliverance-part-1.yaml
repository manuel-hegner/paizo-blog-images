           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <p>Some adventures are worth waiting years for, and we believe <a href="https://store.paizo.com/pathfinder-adventure-the-dead-god-s-hand/"><em>The Dead God’s Hand</em></a> is one of them. Our party, The Aroden 5, is ready to tell you what we’ve discovered and show off some teasers from Erik Mona’s deluxe adventure! If you need to, go ahead and get caught up on what this project is all about:</p>
              <ul>
               <li><a href="https://paizo.com/blog/the-dead-god-s-deliverance">Introduction</a></li>
              </ul>
              <p><em>Editor’s Note: Everything from here on contains spoilers for The Dead God’s Hand. Read at your own peril.</em></p>
              <p>Remember how we created that themed party wearing Aroden’s colors, looking super slick and ready to usher in the return of our god? Well, we got careless while searching for clues in forgotten parts of Absalom, and ended up as captives of the hryngars. It was bad enough that we started out this adventure as prisoners inside a compound – but not as demoralizing as having the gray dwarves take our special gear. Talk about kicking our enthusiasm before the first dice rolls! This had to be one of the roughest opening scenes in any of our projects, up there with <a href="https://paizo.com/blog/order-of-the-amber-die-the-strange-aeons-experiment-part-1">The Strange Aeons Experiment</a> in 2016.</p>
              <p>We only managed to hide a single item per character for survival purposes, so we knew that in order to make it out of the hryngar compound we would need some allies. The NPCs in this adventure are not just fellow prisoners with stat blocks, as there is an entire gallery devoted to describing each character. Erik Mona has included plenty of roleplaying tips, guidance on how to manage so many NPCs, and even character arcs for each; this is similar to what you might see for one or two key NPCs at the end of an Adventure Path volume, only this gallery has upwards of ten characters. Over the years, some groups out there have implemented our systems like utilizing a Player Captain or running marathon sessions, but if you’ve ever considered trying out our live-NPC method, this might be the perfect adventure for it. We were proud to be joined by activist <a href="https://www.rebekahbruesehoff.com/">Rebekah Bruesehoff</a>, who jumped into the action of the Pathfinder Roleplaying Game for the first time, playing the role of Labella the fearless acrobat. We also had our close friend and author <a href="https://peterwoodworth.com/published-works/">Peter Woodworth</a> roll with us as Krell the opportunistic rogue. With allies alongside, our jailbreak had begun!</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/6f598d09-4e72-4535-935b-7c680cdf04d9/OoTAD_DGH_GuestTableShot.jpg?w=525" alt="Three pathfinder players are sitting around a gaming table, they have characters sheets and art in front of them. One is leaning over the table, looking at the map and miniatures in the center." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/839e116c-14a1-45ce-8ffb-d8f538d145ae/OoTAD_DGH_PropsFinal.jpg?w=525" alt="a prop book decorated to look like an old leather tome with light blue-grey embellishments  " data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><strong>Highlights from </strong><em><strong>The Dead God’s Hand</strong></em><strong>:</strong></h2>
              <p>□ Free from our cell, we looked and listened in all directions. We could hear chanting coming from behind some double doors — definitely avoid that! Turns out it was a ritual to summon a daemon, requiring eight hours to complete. Our GM keeps a meticulous log of every in-game minute that passes, because it might matter. After exploring the entire hryngar compound, we chose to brave the chapel and interrupt the ceremony. Little did we know, there was just sixteen minutes to spare! We brought Aroden’s will against evil Droskarites in a fierce fight that could have gone the other way.</p>
              <p>□ Here’s the good news: Your characters will get some of their items back. A few rooms into our escape, we came across a pile of gear our captors were storing. We were each allowed to name five items of importance that had been taken from us, but we could now recover. We each started by choosing our awesome Aroden-themed attire, of course!</p>
              <p>□ Our closest call didn’t come from combat. Did we really need all three keys to the elaborate “tripartite lock” that blocked our final escape? Isn’t that what barbarians are for? One hard kick later, the lock’s complex gears were grinding so loud that it blew out our ear drums, delivered 148 damage across the party, alerted most of the compound, and dropped two PCs to Dying 2. Yeah, let’s just go find the keys.</p>
              <p>□ One really cool feature of playing so much Pathfinder is the overlap between projects. Currently we’re facing the legacy of Droskar in <a href="https://paizo.com/blog/the-crown-academy-part-1">Crown of the Kobold King</a>, headed to a city filled with Droskar-worshipping hryngar in <a href="https://paizo.com/blog/the-sky-scions-part-3">Sky King’s Tomb</a>, and then Erik Mona had us discover the holy book of Droskar right here in a priestess’s chamber: <em>The Blood Litany of Droskar.</em> Erik described it as “a black tome edged in crude metal embellishments,” having worn pages, which we took and gave to one of our members to create as a prop. As for what’s inside the book, you’ll have to play <em>The Dead God’s Hand</em> to find out! &nbsp;</p>
              <p>□ We make mistakes like everybody else. With almost no gear, we waded through a spiderweb-gauntlet to reach a laboratory ruled by some kind of arachnid-creature that wielded a sphincter-tube as a weapon (you’re just going to have to see this for yourself). As one can imagine, we were happy to have survived the encounter. Desperate for items, we broke into the Search exploration activity without thinking, completely ignoring the gasping victim on the table. The captive was none other than Shevala Iorae, a famous venture-captain of the Pathfinder Society. It’s been an uphill relationship ever since, and this fail is not on the rookies.</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/678c4533-da41-4917-a3ca-c69542b58fa4/OoTAD_DGH_ChapelBattle.jpg?w=525" alt="A close up photo of pathfinder players' miniatures in a room decorated like a temple. There is a large stained glass window at the top of the room, it is designed to look like a roaring fire in a curved fireplace. In the center of the room appears to be a deep well." data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/7b94c58a-bdf4-488d-a590-8957f870f9c5/OoTAD_DGH_LaboratoryFinalBrighter.jpg?w=525" alt="A close up photo of pathfinder players' miniatures in a room that appears to be a workshop. There is dust covering the walls but a clean table in the cente of the room with a large lever." data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2>The Deliverance</h2>
              <p>Based on the title of our project, we entered this adventure believing that our god might return. A lofty expectation, but if you’re a fan of the Last Azlanti, put yourself in our place for a second. One of the dig tunnels leading far away from the hryngar compound connected to a series of worked stone chambers. Before we knew it, deep beneath Absalom, we were standing in a gallery devoted to the highest-ranking priest of our faith: Sarnax the Great. We gazed in awe at bas-reliefs that described stories from ages past, depicting Aroden and his followers. We barely had time to slap hands around the table, because right in this gallery was several still-burning ancient Azlanti artifacts known as the <em>Flame of the Radiant Spark</em>. Sarnax once used this healing artifact to defeat the Yellow Death sickness in Absalom’s early history, but these white candles with blue flames could also be used to revive the dead. We saw it as our sacred duty to prevent them from ending up in the hands of the hryngar.</p>
             </div>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><strong>Character Deaths:</strong></h2>
              <p>□ None. Props to our commander’s Plant Banner feat, granting four temporary hit points per round, which was just too beefy for most enemies to overcome.</p>
              <h2><strong>Best Quote from Marathon 1:</strong></h2>
              <p>(We watched as Blostin, our fellow prisoner, fell into a pit filled with spiders)<br>
                Dorianth the commander: “May Aroden guide your hand!”<br>
                Krell the rogue: “Umm, you know that god is dead, right?”</p>
              <h2><strong>Current Situation:</strong></h2>
              <p>Picture exploring a cramped tomb, and then entering a vast chamber that suddenly becomes lit by magical orbs flickering into existence. Their light reveals a ship. Yes, a massive boat. In a tomb. Based on the artwork we’ve seen in the previous hallway, this looks like Sarnax’s <em>ether ship</em>, which the high priest of Aroden used to travel the Great Beyond. We ventured aboard, discovering the recent remains of a fellow prisoner, known only as Heinrich. We used the <em>Flame of the Radiant Spark </em>and restored him to life. Now to explore the rest of the ship…</p>
             </div>
             <figure class="blog__paragraph__image below" data-v-a2f23fca>
              <img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/ed105ce4-efb2-4f1f-8682-6c3fdb767e9d/OoTAD_DGH_DaylightEtherShip.jpg?w=500" alt="Pathfinder players are all standing around a gaming table working to set up the map, lights, and miniatures" data-v-a2f23fca><img src="https://cdn.paizo.com:443/a7d62ac8-7f03-00ef-f1f0-83fb8bf332e2/5baa9c49-0c4a-49f8-b6be-14d58b54d9f1/OoTAD_DGH_RadiantSpark.jpg?w=500" alt="A group of players in a dark room leaning around a table with a miniature of a pirate ship, lit up only by electric candles with blue flames" data-v-a2f23fca>
             </figure>
            </div>
           </div>
           <div class="blog__article--component_wrapper" data-v-7a806b22>
            <div class="blog__paragraph" data-v-a2f23fca data-v-7a806b22>
             <div class="blog__paragraph__text" data-v-a2f23fca>
              <h2><strong>More Content:</strong></h2>
              <p>The symbol on the metal tripartite amulets seen in the photo is the official hryngar Clan Orthux rune, which did not make it into the adventure but is now revealed here! Erik Mona provided the symbol to us, and one of our members crafted tripartite keys with the rune on them. <a href="http://bluetablepainting.com/">Blue Table Painting</a> provided the excellent paintwork for the miniatures of The Aroden 5. For custom adventure-specific terrain/miniatures such as the stained-glass holy symbol of Droskar, that’s the handiwork of <a href="https://www.blackbardstudios.com/">Black Bard Studios</a>.</p>
              <p><br></p>
